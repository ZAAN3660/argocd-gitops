apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: keda-operator
  namespace: keda
  labels:
    release: kube-prometheus-stack   # 必须带：stack 的 Prometheus 只认领带此标签的监控资源
spec:
  selector:
    matchLabels:
      app: keda-operator
  podMetricsEndpoints:
    - port: metrics                  # 字符串=按容器端口名匹配；8080 已在 operator 容器声明为 metrics 端口
      interval: 15s
      path: /metrics
      # 注意：9666 是内部 gRPC metricsservice（--metrics-service-bind-address），不是 HTTP 指标端口。
      # operator 需开启 --enable-prometheus-metrics=true（KEDA helm chart 默认 false），
      # 本集群已通过 kubectl patch deployment 开启（仓库内无平台组件源文件，见 README 说明）。
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keda-metrics-apiserver
  namespace: keda
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: keda-operator-metrics-apiserver
  endpoints:
    - port: metrics                     # apiserver 的 8080 指标端口
      interval: 15s
      path: /metrics
