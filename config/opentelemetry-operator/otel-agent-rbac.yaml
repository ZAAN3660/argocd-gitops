# 归属声明：本文件是配置层资源，挂在宿主组件 opentelemetry-operator 名下（otel-agent 无独立
# 安装层目录，目录镜像规则见 README）。镜像对象：operator 默认为 otel-agent 生成的权限之外，
# 本 ClusterRole + ClusterRoleBinding 是采集所需的最小补充权限。
# 应用流程：由 config/opentelemetry-operator/kustomization.yaml 打包，Argo CD 与 otel-agent.yaml 一同应用。
# prometheus receiver 用 kubernetes_sd_configs (role: pod) 做服务发现，
# 需要 list/watch Pods。operator 默认不为自定义镜像生成此权限（k8s
# 发行版不含 prometheus receiver，所以默认 RBAC 没有 pods 权限）。
# 最小权限：只给 pods 的 get/list/watch（cluster scope，因为 SD 未限制命名空间）。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent-pod-reader
subjects:
  - kind: ServiceAccount
    name: otel-agent-collector
    namespace: monitoring
