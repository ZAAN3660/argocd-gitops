apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # project 必须先于 appset 同步。否则，appset 引用的 project 会因不存在而导致应用无法 syncing
  - projects/bookinfo.yaml                # bookinfo 应用域边界
  - projects/infra.yaml                   # 平台基础组件应用域边界（X 方案：CRD 随组件走）
  # 一个应用一个 AppSet：每个应用的环境清单独立维护
  - appsets/bookinfo-productpage.yaml   # 生成 bookinfo-productpage-<env>
  - appsets/bookinfo-details.yaml       # 生成 bookinfo-details-<env>
  - appsets/bookinfo-ratings.yaml       # 生成 bookinfo-ratings-<env>
  - appsets/bookinfo-reviews.yaml       # 生成 bookinfo-reviews-<env>
  # infra 域：集群级组件整个集群只装一次，不按环境发散——一个 AppSet 按组件枚举 8 个 Application（命名规则见 README）
  - appsets/infra-components.yaml        # 生成 cert-manager / metrics-server / keda / argo-rollouts / istio-base / istiod / istio-gateway / opentelemetry-operator
