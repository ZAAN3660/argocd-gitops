# observability 域：消费 config/opentelemetry-operator（配置层）——OpenTelemetry
# 的运行时行为配置：mode: daemonset 的 Collector agent CR + 补权 RBAC。
# agent 无独立安装物（官方只提供 Operator + CRD，operator 本体装在 infra/），
# 期望状态由本仓库定义，归配置层；目录名镜像 infra/opentelemetry-operator（宿主组件）。
# 集群级、每节点一份、整个集群只装一次，不随环境分发。
# 生成 Application：observability-otel-agent（无环境后缀），带 component label
#（值 = 宿主组件词根 opentelemetry-operator，与 infra 层同值，UI 过滤即得跨层视图）。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel-agent
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - {}                       # 固定单元素：N 恒等于 1，无发散维度
  template:
    metadata:
      name: 'observability-otel-agent'
      namespace: argocd
      labels:
        component: opentelemetry-operator
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: observability
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: config/opentelemetry-operator
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
