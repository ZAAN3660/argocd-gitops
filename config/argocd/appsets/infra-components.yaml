# infra 应用域：平台基础组件都是集群级资源，整个集群只装一次，不按环境发散。
# 一个 AppSet 按组件枚举生成 8 个 Application，Application 名 = 官方 chart 名，
# 例外按 README 命名规则：泛化词加域前缀（istio-base / istio-gateway），官方名自含词根的不加（istiod）。
# 与各组件 helm release 的 app.kubernetes.io/instance 标签天然对齐，接管认领零摩擦。
# 每个 Application 带 component label（值取 group 字段，istio 三个 App 归一为 istio），
# 与 config 层 AppSet 的 label 同词根同值，UI 按 component=<词根> 过滤得跨层完整视图。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-components
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - component: cert-manager          # 接管前 v1.21.1，releaseName 对齐现有标签 instance=cert-manager
            group: cert-manager
            path: infra/cert-manager
            namespace: cert-manager
            wave: -2
          - component: metrics-server        # 接管前集群里不存在（kube-system 只有 coredns），GitOps 新装
            group: metrics-server
            path: infra/metrics-server
            namespace: kube-system
            wave: -2
          - component: keda                  # 接管前 2.20.2
            group: keda
            path: infra/keda
            namespace: keda
            wave: -2
          - component: argo-rollouts         # 无官方 helm chart，静态落仓 install.yaml v1.9.1
            group: argo-rollouts
            path: infra/argo-rollouts
            namespace: argo-rollouts
            wave: -2
          - component: istio-base            # CRD 必须先于 istiod 就绪
            group: istio
            path: infra/istio/base
            namespace: istio-system
            wave: -2
            revLabel: default                 # 给 istio-system ns 打 istio.io/rev 标签（gateway 注入依赖）
          - component: istiod                # 接管前 istioctl 1.30.3 安装；meshConfig 权威在 config/istio/istio-cm.yaml，infra 只装不配
            group: istio
            path: infra/istio/istiod
            namespace: istio-system
            wave: -1
            revLabel: default
          - component: istio-gateway         # gateway Pod 注入依赖 istiod 的 sidecar-injector
            group: istio
            path: infra/istio/gateway
            namespace: istio-system
            wave: 0
            revLabel: default
          - component: opentelemetry-operator  # 依赖 cert-manager（wave -2）签发 webhook 证书
            group: opentelemetry-operator
            path: infra/opentelemetry-operator
            namespace: opentelemetry-operator
            wave: -1
  template:
    metadata:
      name: '{{.component}}'
      namespace: argocd
      labels:
        component: '{{.group}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: infra
      # caBundle 由 cert-manager / istiod / keda 等运行时回填，统一豁免避免"sync 清掉→控制器重写→漂移"死循环。
      # 对无 webhook 的组件（metrics-server / argo-rollouts / istio-gateway）此豁免为空操作，换来模板零分支。
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        # 接管期 v1：manual；全部验证后 v2 提交统一改 automated prune selfHeal
        {{- if .revLabel }}
        # istio 三组件：ns 由 CreateNamespace 创建（裸 ns），rev 标签在此补打。
        # gateway chart 的 Pod 模板 image 为字面量 auto，缺标签则 sidecar 注入被跳过，
        # kubelet 直接拉 docker.io/library/auto。其他组件不配此字段，块不渲染。
        managedNamespaceMetadata:
          labels:
            istio.io/rev: '{{.revLabel}}'
        {{- end }}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
