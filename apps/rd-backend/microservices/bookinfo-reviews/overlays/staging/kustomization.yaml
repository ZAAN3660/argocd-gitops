# v2
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
patches:
  - target:
      kind: DestinationRule
      name: bookinfo-reviews
    patch: |-
      - op: replace
        path: /spec/host
        value: reviews.staging.svc.cluster.local
