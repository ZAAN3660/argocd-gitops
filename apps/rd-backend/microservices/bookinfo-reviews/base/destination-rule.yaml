# v3
# base 里 host 写占位 FQDN，各 overlay 用 patch 换成自己命名空间的真实
# FQDN：DestinationRule 的 host 是目标服务的全限定名，跨命名空间必须显式。
# v3 新增 trafficPolicy 熔断：与官方 Circuit Breaking 任务页同构——
# 官方示例正是给 reviews 的 v1/v2/v3 三个 subset 挂连接池+异常驱逐，
# 这里照搬其演示值（故意设小，便于压测观察触发），生产按容量上调。
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: bookinfo-reviews
spec:
  host: reviews.<namespace>.svc.cluster.local    # 占位：实际值由 overlay patch 注入，这里仅保持字段完整
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1                     # 官方演示值：与上游最多保持 1 条 TCP 连接
      http:
        http1MaxPendingRequests: 1            # 官方演示值：HTTP/1.1 排队中的请求最多 1 个
        maxRequestsPerConnection: 1           # 官方演示值：每条连接只复用 1 个请求
    outlierDetection:
      consecutive5xxErrors: 1                 # 官方演示值：连续 1 次 5xx 就驱逐
      interval: 1s
      baseEjectionTime: 3m                    # 驱逐后 3 分钟再放回负载均衡池
      maxEjectionPercent: 100                 # 允许驱逐全部实例（演示值，生产通常 <50%）
  subsets:
    - name: v1                                # subset 名是路由层引用子集时的句柄
      labels:
        version: v1                           # 按 Pod 的 version 标签切分流量子集
    - name: v2
      labels:
        version: v2
    - name: v3
      labels:
        version: v3
