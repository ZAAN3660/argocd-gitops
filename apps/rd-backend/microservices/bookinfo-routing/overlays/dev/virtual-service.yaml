# v4
# 统一路由表：一个 VS 挂到 Gateway 上，同时承接集群内短名流量。
# hosts 里除域名外必须列出 details/reviews/ratings 短名——
# productpage→details 这类内部调用只有进了 VS，canary 权重才生效。
# 规则从上到下第一条命中生效：header/cookie 定向放行在前，
# 权重路由居中，无 match 的兜底路由放最后（Rollout 只改权重路由）。
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: bookinfo
spec:
  hosts:
    - 'bookinfo.example.com'               # 外部域名（Gateway 入口）
    - details                              # 集群内短名：productpage 内部调用经过它
    - reviews                              # 集群内短名：productpage 内部调用经过它
    - ratings                              # 集群内短名：reviews 内部调用经过它
  gateways:
    - bookinfo-gateway
  http:
    # ---------- details：定向灰度 ----------
    - name: details-header-canary          # 带 x-canary: true 的请求 100% 金丝雀
      match:
        - uri:
            prefix: /details
          headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: details-canary
            port:
              number: 9080
    - name: details-cookie-canary
      match:
        - uri:
            prefix: /details
          headers:
            cookie:
              regex: "(^|;\\s*)canary=1(;|$)"
      route:
        - destination:
            host: details-canary
            port:
              number: 9080
    # ---------- ratings：定向灰度 ----------
    - name: ratings-header-canary
      match:
        - uri:
            prefix: /ratings
          headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: ratings-canary
            port:
              number: 9080
    - name: ratings-cookie-canary
      match:
        - uri:
            prefix: /ratings
          headers:
            cookie:
              regex: "(^|;\\s*)canary=1(;|$)"
      route:
        - destination:
            host: ratings-canary
            port:
              number: 9080
    # ---------- productpage：定向灰度（prefix / 兜底匹配，放最后防吞掉上面规则） ----------
    - name: productpage-header-canary
      match:
        - uri:
            prefix: /
          headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: productpage-canary
            port:
              number: 9080
    - name: productpage-cookie-canary
      match:
        - uri:
            prefix: /
          headers:
            cookie:
              regex: "(^|;\\s*)canary=1(;|$)"
      route:
        - destination:
            host: productpage-canary
            port:
              number: 9080
    # ---------- 权重路由（Rollout 发布时动态改 weight） ----------
    - name: details-route
      match:
        - uri:
            prefix: /details
      route:
        - destination:
            host: details
            port:
              number: 9080
          weight: 100
        - destination:
            host: details-canary
            port:
              number: 9080
          weight: 0
    - name: ratings-route
      match:
        - uri:
            prefix: /ratings
      route:
        - destination:
            host: ratings
            port:
              number: 9080
          weight: 100
        - destination:
            host: ratings-canary
            port:
              number: 9080
          weight: 0
    # ---------- reviews：保留三版本 subset 演示（未接入 Rollouts） ----------
    - name: reviews-route
      match:
        - uri:
            prefix: /reviews
      route:
        - destination:
            host: reviews
            subset: v1
            port:
              number: 9080
          weight: 100                        # dev 权重 100% v1，单版本基线
    # ---------- productpage：无 match 的兜底路由（覆盖 /、/productpage、/login 等） ----------
    - name: productpage-route
      route:
        - destination:
            host: productpage
            port:
              number: 9080
          weight: 100
        - destination:
            host: productpage-canary
            port:
              number: 9080
          weight: 0
