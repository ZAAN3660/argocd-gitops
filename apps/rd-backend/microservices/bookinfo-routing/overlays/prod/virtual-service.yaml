# v5
# 与 dev 同构，唯一差异在 reviews-route 的权重：prod 以 v1 为主
# 稳定版，v2 灰度 15%，v3 保底 5% 便于故障降级。升级时只改这三个
# weight 值，不动匹配规则与 destination host。
# v5 与 dev 同步给四条权重路由加 timeout/retries，取值同官方 HTTPRetry 示例。
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: bookinfo
spec:
  hosts:
    - 'bookinfo.example.com'
    - details
    - reviews
    - ratings
  gateways:
    - bookinfo-gateway
  http:
    - name: details-header-canary
      match:
        - uri:
            prefix: /details
          headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: details-canary
            port:
              number: 9080
    - name: details-cookie-canary
      match:
        - uri:
            prefix: /details
          headers:
            cookie:
              regex: "(^|;\\s*)canary=1(;|$)"
      route:
        - destination:
            host: details-canary
            port:
              number: 9080
    - name: ratings-header-canary
      match:
        - uri:
            prefix: /ratings
          headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: ratings-canary
            port:
              number: 9080
    - name: ratings-cookie-canary
      match:
        - uri:
            prefix: /ratings
          headers:
            cookie:
              regex: "(^|;\\s*)canary=1(;|$)"
      route:
        - destination:
            host: ratings-canary
            port:
              number: 9080
    - name: productpage-header-canary
      match:
        - uri:
            prefix: /
          headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: productpage-canary
            port:
              number: 9080
    - name: productpage-cookie-canary
      match:
        - uri:
            prefix: /
          headers:
            cookie:
              regex: "(^|;\\s*)canary=1(;|$)"
      route:
        - destination:
            host: productpage-canary
            port:
              number: 9080
    - name: details-route
      match:
        - uri:
            prefix: /details
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: details
            port:
              number: 9080
          weight: 100
        - destination:
            host: details-canary
            port:
              number: 9080
          weight: 0
    - name: ratings-route
      match:
        - uri:
            prefix: /ratings
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: ratings
            port:
              number: 9080
          weight: 100
        - destination:
            host: ratings-canary
            port:
              number: 9080
          weight: 0
    - name: reviews-route
      match:
        - uri:
            prefix: /reviews
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: reviews
            subset: v1
            port:
              number: 9080
          weight: 80                         # prod 主干版本
        - destination:
            host: reviews
            subset: v2
            port:
              number: 9080
          weight: 15                         # 灰度新版本
        - destination:
            host: reviews
            subset: v3
            port:
              number: 9080
          weight: 5                          # 低流量保底
    - name: productpage-route
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: productpage
            port:
              number: 9080
          weight: 100
        - destination:
            host: productpage-canary
            port:
              number: 9080
          weight: 0
