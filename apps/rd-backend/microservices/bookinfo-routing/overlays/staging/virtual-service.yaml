# v4
# 与 dev 同构，唯一差异在 reviews-route 的权重：staging 把
# 50% 流量切到 v2（带星级评分版本），验证 ratings 链路。其余
# 规则（header/cookie/权重路由）与 dev 完全一致。
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: bookinfo
spec:
  hosts:
    - 'bookinfo.example.com'
    - details
    - reviews
    - ratings
  gateways:
    - bookinfo-gateway
  http:
    - name: details-header-canary
      match:
        - uri:
            prefix: /details
          headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: details-canary
            port:
              number: 9080
    - name: details-cookie-canary
      match:
        - uri:
            prefix: /details
          headers:
            cookie:
              regex: "(^|;\\s*)canary=1(;|$)"
      route:
        - destination:
            host: details-canary
            port:
              number: 9080
    - name: ratings-header-canary
      match:
        - uri:
            prefix: /ratings
          headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: ratings-canary
            port:
              number: 9080
    - name: ratings-cookie-canary
      match:
        - uri:
            prefix: /ratings
          headers:
            cookie:
              regex: "(^|;\\s*)canary=1(;|$)"
      route:
        - destination:
            host: ratings-canary
            port:
              number: 9080
    - name: productpage-header-canary
      match:
        - uri:
            prefix: /
          headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: productpage-canary
            port:
              number: 9080
    - name: productpage-cookie-canary
      match:
        - uri:
            prefix: /
          headers:
            cookie:
              regex: "(^|;\\s*)canary=1(;|$)"
      route:
        - destination:
            host: productpage-canary
            port:
              number: 9080
    - name: details-route
      match:
        - uri:
            prefix: /details
      route:
        - destination:
            host: details
            port:
              number: 9080
          weight: 100
        - destination:
            host: details-canary
            port:
              number: 9080
          weight: 0
    - name: ratings-route
      match:
        - uri:
            prefix: /ratings
      route:
        - destination:
            host: ratings
            port:
              number: 9080
          weight: 100
        - destination:
            host: ratings-canary
            port:
              number: 9080
          weight: 0
    - name: reviews-route
      match:
        - uri:
            prefix: /reviews
      route:
        - destination:
            host: reviews
            subset: v1
            port:
              number: 9080
          weight: 50                         # staging 引入一半 v2 流量
        - destination:
            host: reviews
            subset: v2
            port:
              number: 9080
          weight: 50
    - name: productpage-route
      route:
        - destination:
            host: productpage
            port:
              number: 9080
          weight: 100
        - destination:
            host: productpage-canary
            port:
              number: 9080
          weight: 0
