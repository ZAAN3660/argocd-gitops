# v1
# 本地限流（Istio 1.30 官方 Rate Limit 任务页 "Local rate limiting" 示例）：
# 在 productpage sidecar 的 inbound 链路上插入 envoy.filters.http.local_ratelimit，
# token_bucket 4 个 / 60s = 每个 productpage Pod 每分钟最多 4 个请求
# （官方演示值，故意设小：正常连点几下页面就会看到 HTTP 429 和
# x-local-rate-limit: "true" 响应头；生产按容量上调，见 docs/istio-resilience.md）。
#
# 两个关键边界（详见 docs/istio-resilience.md）：
# 1. 本地限流按 Envoy 实例独立计数：Pod 数越多总配额越高，不是全局精确限流；
#    全局限流需部署官方 ratelimit 服务（ConfigMap 描述符 + EnvoyFilter 联动）。
# 2. EnvoyFilter 只作用于同命名空间的 workload：本文件随 routing overlay
#    渲染进 dev/staging/prod，各自只限制本环境 app=productpage 的 sidecar，
#    三个环境配额互相独立（官方 EF 参考：root namespace 才全域生效）。
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: filter-local-ratelimit-productpage
spec:
  workloadSelector:
    labels:
      app: productpage                      # 只注入 productpage 的 sidecar（各环境一份）
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/udpa.type.v1.TypedStruct
            type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            value:
              stat_prefix: http_local_rate_limiter
              token_bucket:
                max_tokens: 4                # 官方演示值：桶容量 4 个 token
                tokens_per_fill: 4           # 每 fill_interval 补充 4 个
                fill_interval: 60s
              filter_enabled:
                runtime_key: local_rate_limit_enabled
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                runtime_key: local_rate_limit_enforced
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              response_headers_to_add:
                - append: false
                  header:
                    key: x-local-rate-limit
                    value: "true"            # 被限流的响应带上此头，便于识别与测试
