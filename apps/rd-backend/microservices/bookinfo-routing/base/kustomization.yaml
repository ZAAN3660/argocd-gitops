# v1
# routing 按环境差异拆成 base + overlays：Gateway 三环境共用，
# VirtualService 因 reviews 权重策略不同而逐环境覆盖。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml                            # 南北流量的统一入口，三环境共用
  - analysistemplates.yaml                  # 灰度分析模板：每环境一份，各服务 Rollout 共用
  # virtual-service.yaml 不放 base：各环境路由权重不同，放在 overlay 侧由环境决定
