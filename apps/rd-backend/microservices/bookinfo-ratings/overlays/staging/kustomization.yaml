# v4
# 灰度发布 overlay：base 提供 Rollout/双 Service/ScaledObject/PodMonitor/
# AnalysisTemplate 骨架，本层用显式 patch 注入服务身份：
# 名字、短名、路由名、扩缩容目标、QPS 查询，全部与服务强相关。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging                    # 与 appset 同环境条目的 namespace 严格一致，否则永久 OutOfSync
labels:
  - pairs:
      app: ratings                              # 覆写 base 占位标签值
    includeSelectors: true                   # 必须显式开启：selector 与 Pod 模板标签同步改写，各服务互不串选
resources:
  - ../../../../base
images:
  - name: app                                # 匹配 base 里名为 app 的容器镜像字段
    newName: docker.io/istio/examples-bookinfo-ratings-v1
    newTag: 1.16.2
patches:
  - target:                                  # 目标：Rollout，用改名前占位名定位
      kind: Rollout
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: bookinfo-ratings-app           # Rollout 名带服务前缀，命名空间内唯一
      - op: replace
        path: /spec/strategy/canary/stableService
        value: ratings                          # 稳定通道 = 官方短名（镜像硬编码的 DNS 名）
      - op: replace
        path: /spec/strategy/canary/canaryService
        value: ratings-canary                   # 金丝雀通道
      - op: replace
        path: /spec/strategy/canary/trafficRouting/istio/virtualService/routes/0
        value: ratings-route                    # 只接管 routing 层 VS 里这一条权重路由
      - op: replace
        path: /spec/selector/matchLabels/app
        value: ratings                          # labels 转换器不处理 Rollout 的 selector 路径，必须显式改写，否则 Rollout 选不中自己的 Pod
      - op: replace
        path: /spec/template/metadata/labels/app
        value: ratings                          # Pod 模板标签与 selector 同步改写，二者必须一致
  - target:
      kind: Service
      name: service
    patch: |-
      - op: replace
        path: /metadata/name
        value: ratings                        # 官方短名：镜像内部硬编码、VS 引用都用它解析
  - target:
      kind: Service
      name: service-canary
    patch: |-
      - op: replace
        path: /metadata/name
        value: ratings-canary
  - target:
      kind: ScaledObject
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: bookinfo-ratings-scaler
      - op: replace
        path: /spec/scaleTargetRef/name
        value: bookinfo-ratings-app           # 与 Rollout 最终名一致
      - op: replace
        path: /spec/triggers/2/metadata/query
        value: |
          sum(rate(istio_requests_total{destination_service=~"ratings.*", response_code=~"2..|3.."}[2m]))
  - target:
      kind: PodMonitor
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: bookinfo-ratings-monitor
      - op: replace
        path: /spec/selector/matchLabels/app
        value: ratings                        # 与 Pod 实际标签一致，stable+canary 一起抓
