# v4
# KEDA 自动扩缩容：CPU / 内存 / QPS 三个信号谁超标谁触发，
# 实际扩缩由 KEDA 创建的 HPA 执行，副本数取各指标建议值的最大值。
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: app                                 # 占位名：overlay patch 改成 bookinfo-<服务>-scaler
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout                           # 扩的是 Rollout：与灰度发布共存，KEDA 只调副本数不碰流量
    name: app                               # 占位：overlay patch 改成 Rollout 最终名
  minReplicaCount: 1                        # 最少副本：有流量的服务别设 0
  maxReplicaCount: 10                       # 扩容上限
  pollingInterval: 5                        # 每 N 秒查一次触发器指标
  cooldownPeriod: 120                       # 指标降下来后等 N 秒才缩容，防抖动
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:                            # 扩容要快：立即响应突发
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100                    # 一次最多翻倍
              periodSeconds: 15
        scaleDown:                          # 缩容要慢：防止来回抖动
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 20                     # 一次最多缩 20%
              periodSeconds: 60
  triggers:
    - type: cpu                             # 触发器 1：CPU 使用率超 80%（依赖 resources.requests.cpu）
      metricType: Utilization
      metadata:
        value: "80"
    - type: memory                          # 触发器 2：内存使用率超 75%（依赖 resources.requests.memory）
      metricType: Utilization
      metadata:
        value: "75"
    - type: prometheus                      # 触发器 3：QPS 超阈值（网格指标，stable+canary 合计）
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: |                            # 占位 query：overlay patch 替换 destination_service
          sum(rate(istio_requests_total{destination_service=~"app.*", response_code=~"2..|3.."}[2m]))
        threshold: "10"                     # 每秒成功请求超 10 扩容；演示值，生产按容量评估
