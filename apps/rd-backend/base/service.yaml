# v4
apiVersion: v1
kind: Service
metadata:
  name: service                             # 占位名：overlay patch 改成官方短名（镜像硬编码）
spec:
  type: ClusterIP
  selector:
    app: app                                # 占位：与 canary Service 同值，发布时控制器注入 hash 标签区分两个通道
  ports:
    - name: http
      port: 9080
      targetPort: 9080
      protocol: TCP
