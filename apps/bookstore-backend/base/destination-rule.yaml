# v3
# 熔断骨架：connectionPool 限制到上游的连接/请求并发，
# outlierDetection 在实例连续返回 5xx 时把它驱逐出负载均衡池。
# v3 取值切换为“压测豁免档”：准备压测/灰度发布期间，阈值放到
# 实际打不穿的程度，避免熔断干扰（v2 复盘：官方演示值曾在单副本
# 场景自 DoS，详见 docs/istio-resilience.md）。
# 档位速查：官方演示档（1/1/1、5xx×1、驱逐 3m）| 日常安全档
# （10/10/10、5xx×5、驱逐 30s）| 压测豁免档（本文件当前值）。
# 压测结束后建议切回日常安全档（v2 取值，git 历史可查）。
# host 写占位 FQDN：与 reviews 自带 DR 同一约定，由 overlay patch
# 换成 <短名>.<ns>.svc.cluster.local。
# 注意：本 DR 只覆盖稳定通道短名；host 模式的金丝雀短名
# （<短名>-canary）不受熔断保护，需要时复制本文档再改 host。
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: app                                 # 占位名：overlay patch 改成 <短名>-dr
spec:
  host: app.<namespace>.svc.cluster.local   # 占位：overlay patch 改成 <短名>.<ns>.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1024                # 压测豁免：1024 条连接，单副本 Python 应用打不穿
      http:
        http1MaxPendingRequests: 1024       # 压测豁免：排队上限 1024
        maxRequestsPerConnection: 0         # 0 = 连接不限复用次数（Envoy 默认语义）
    outlierDetection:
      consecutive5xxErrors: 100             # 压测豁免：连续 100 次 5xx 才驱逐（≈不驱逐）
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
