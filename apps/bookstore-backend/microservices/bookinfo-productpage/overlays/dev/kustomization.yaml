# v7
# 灰度发布 overlay：base 提供 Rollout/双 Service/ScaledObject/PodMonitor/
# DestinationRule 骨架，本层用显式 patch 注入服务身份。
# v6 labels 新增 K8s 官方推荐标签（app.kubernetes.io/*，见 docs/naming.md）。
# 名字、短名、路由名、扩缩容目标、QPS 查询，全部与服务强相关。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev                    # 与 appset 同环境条目的 namespace 严格一致，否则永久 OutOfSync
labels:
  - pairs:
      app: productpage                              # 覆写 base 占位标签值
    includeSelectors: true                   # 必须显式开启：selector 与 Pod 模板标签同步改写，各服务互不串选
  - pairs:
      app.kubernetes.io/name: productpage          # 官方推荐标签：应用名
      app.kubernetes.io/part-of: bookinfo          # 官方推荐标签：所属应用
      app.kubernetes.io/managed-by: argocd         # 官方推荐标签：管理工具
    # 此条不加 includeSelectors：只贴元数据，选择器保持 app 单键。
    # app.kubernetes.io/instance 不写：Argo CD 自 v2.2 起默认占用该键做追踪标签，避免冲突
resources:
  - ../../../../base
images:
  - name: app                                # 匹配 base 里名为 app 的容器镜像字段
    newName: docker.io/istio/examples-bookinfo-productpage-v1
    newTag: 1.16.2
patches:
  - target:                                  # 目标：Rollout，用改名前占位名定位
      kind: Rollout
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: productpage-v1           # Rollout 名带服务前缀，命名空间内唯一
      - op: replace
        path: /spec/strategy/canary/stableService
        value: productpage                          # 稳定通道 = 官方短名（镜像硬编码的 DNS 名）
      - op: replace
        path: /spec/strategy/canary/canaryService
        value: productpage-canary                   # 金丝雀通道
      - op: replace
        path: /spec/strategy/canary/trafficRouting/istio/virtualService/routes/0
        value: productpage-route                    # 只接管 routing 层 VS 里这一条权重路由
      - op: replace
        path: /spec/selector/matchLabels/app
        value: productpage                          # labels 转换器不处理 Rollout 的 selector 路径，必须显式改写，否则 Rollout 选不中自己的 Pod
      - op: replace
        path: /spec/template/metadata/labels/app
        value: productpage                          # Pod 模板标签与 selector 同步改写，二者必须一致
  - target:
      kind: Service
      name: service
    patch: |-
      - op: replace
        path: /metadata/name
        value: productpage                        # 官方短名：镜像内部硬编码、VS 引用都用它解析
  - target:
      kind: Service
      name: service-canary
    patch: |-
      - op: replace
        path: /metadata/name
        value: productpage-canary
  - target:
      kind: ScaledObject
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: productpage-scaler
      - op: replace
        path: /spec/scaleTargetRef/name
        value: productpage-v1           # 与 Rollout 最终名一致
      - op: replace
        path: /spec/triggers/2/metadata/query
        value: |
          sum(rate(istio_requests_total{destination_service=~"productpage.*", response_code=~"2..|3.."}[2m]))
  - target:
      kind: PodMonitor
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: productpage-monitor
      - op: replace
        path: /spec/selector/matchLabels/app
        value: productpage                        # 与 Pod 实际标签一致，stable+canary 一起抓
  - target:
      kind: DestinationRule
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: productpage-dr          # 熔断 DR：名字带服务前缀，命名空间内唯一
      - op: replace
        path: /spec/host
        value: productpage.dev.svc.cluster.local  # DR host 用 FQDN，与 reviews DR 同一约定
