# v4
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - virtual-service.yaml
patches:
  - target:
      kind: DestinationRule
      name: reviews-dr
    patch: |-
      - op: replace
        path: /spec/host
        value: reviews.staging.svc.cluster.local
