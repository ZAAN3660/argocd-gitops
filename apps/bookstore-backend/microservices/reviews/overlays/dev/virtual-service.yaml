# v1
# reviews 共享应用的东西向 VS：subset 分流契约（官方 Traffic Shifting 同构）。
# dev 全量 v1（单版本基线）；三个版本的 Rollout 与共享资源同在本应用
# 这里只声明它们之间的流量分配。
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
spec:
  hosts:
    - reviews
  http:
    - name: reviews-route
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: reviews
            subset: v1
            port:
              number: 9080
          weight: 30
        - destination:
            host: reviews
            subset: v2
            port:
              number: 9080
          weight: 35
        - destination:
            host: reviews
            subset: v3
            port:
              number: 9080
          weight: 35
