# v2
# 服务名必须用短名 reviews：productpage 镜像硬编码了该 DNS 名，
# 改成其他名字会导致 productpage 解析 reviews 失败。
apiVersion: v1
kind: Service
metadata:
  name: reviews
  labels:
    app: reviews                    # 资源标识标签，与选择器值一致便于检索
spec:
  type: ClusterIP
  selector:
    app: reviews                    # 故意不写 version：三个版本的 Pod 同时被选中，流量在此汇聚
  ports:
    - name: http
      port: 9080
      targetPort: 9080
      protocol: TCP
