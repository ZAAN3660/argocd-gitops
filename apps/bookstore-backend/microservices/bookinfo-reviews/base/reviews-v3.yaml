# v2
# 与 v1 的差异只有三处：名字后缀、version 标签、镜像 tag。
# v3 版本行为：星级评分为红色，用于路由层演示肉眼可辨的版本差异。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-v3
  labels:
    app: reviews
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews
      version: v3
  template:
    metadata:
      labels:
        app: reviews
        version: v3
        sidecar.istio.io/inject: "true"    # 必须注入 sidecar：reviews→ratings 内部调用要经过 VS 才参与灰度
        istio.io/rev: default
      annotations:
        sidecar.istio.io/inject: "true"
        istio.io/rev: default
    spec:
      containers:
        - name: reviews
          image: docker.io/istio/examples-bookinfo-reviews-v3:1.16.2
          ports:
            - containerPort: 9080
