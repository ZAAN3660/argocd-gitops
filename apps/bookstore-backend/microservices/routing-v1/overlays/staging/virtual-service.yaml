# v6
# 网关专属 VS：与 dev 完全一致（外部入口的路由结构不随环境变化）。
# 枚举路径、无兜底；productpage 的 Rollout 只改 productpage-route 权重。
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bookinfo
spec:
  hosts:
    - bookinfo.example.com
  gateways:
    - bookinfo-gateway
  http:
    - name: productpage-route
      match:
        - uri:
            exact: /productpage
        - uri:
            prefix: /static
        - uri:
            exact: /login
        - uri:
            exact: /logout
        - uri:
            prefix: /api/v1/products
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: productpage
            port:
              number: 9080
          weight: 100
        - destination:
            host: productpage-canary
            port:
              number: 9080
          weight: 0
