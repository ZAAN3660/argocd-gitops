# v2（合并原 bookinfo 网关 VS，原 v6 的 match 路径枚举不再保留）
# 一个 VS 同时管两路流量：
#   南北向：hosts=bookinfo.example.com + gateways=bookinfo-gateway（外部入口）
#   东西向：hosts=productpage + gateways=mesh（网格内短名调用）
# 注意：gateways 必须同时写 gateway 和 mesh——只写 gateway 会切断网格内路由，
# 网格内调用将绕过 VS 直连 Service（灰度期间会打到金丝雀 Pod）。
# Rollout.trafficRouting 引用本 VS 的 productpage-route 权重。
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: productpage
spec:
  hosts:
    - bookinfo.example.com
    - productpage
  gateways:
    - bookinfo-gateway
    - mesh
  http:
    - name: productpage-route
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: productpage
            port:
              number: 9080
          weight: 100
        - destination:
            host: productpage-canary
            port:
              number: 9080
          weight: 0
