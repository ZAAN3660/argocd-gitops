apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 本文件是 bootstrap-bookinfo 根应用（path: apps/bookinfo）渲染的唯一入口，显式列表的三条铁律：
# 1. 不列 bootstrap.yaml 自身 → 根应用不自引用（自引用会导致自管理告警、删除时 finalizer 卡死）
# 2. 不列服务子目录（productpage/ 等）→ 根应用不抢业务 App 的资源，
#    业务清单归各 AppSet 生成的 Application 独有（CONTRIBUTING 资源单一归属铁律）
# 3. project 排在 appset 前，且 project 自带 sync-wave -1 → 同一次 sync 内先建 project 再建 appset
resources:
  - project.yaml                           # bookinfo 业务域权限边界（AppProject bookinfo）
  - appsets/bookinfo-productpage.yaml      # 生成 bookinfo-productpage-<env>
  - appsets/bookinfo-details.yaml          # 生成 bookinfo-details-<env>
  - appsets/bookinfo-ratings.yaml          # 生成 bookinfo-ratings-<env>
  - appsets/bookinfo-reviews.yaml          # 生成 bookinfo-reviews-<env>
