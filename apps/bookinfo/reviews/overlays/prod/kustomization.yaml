apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  - virtual-service.yaml
patches:
  - target:
      kind: Rollout
      name: reviews-v1
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Rollout
      name: reviews-v2
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Rollout
      name: reviews-v3
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: DestinationRule
      name: reviews
    patch: |-
      - op: replace
        path: /spec/host
        value: reviews.prod.svc.cluster.local
