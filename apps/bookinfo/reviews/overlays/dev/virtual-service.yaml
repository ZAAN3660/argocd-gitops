apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
spec:
  hosts:
    - reviews
  http:
    - name: reviews-route
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: reviews
            subset: v1
            port:
              number: 9080
          weight: 30
        - destination:
            host: reviews
            subset: v2
            port:
              number: 9080
          weight: 35
        - destination:
            host: reviews
            subset: v3
            port:
              number: 9080
          weight: 35
