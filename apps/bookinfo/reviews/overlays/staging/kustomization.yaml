# v5.1（骨架环境：放开 staging 但三个版本 Rollout 副本数 0）
# 本层职责：namespace、DR host 注入、东西向 VS（三环境权重不同，留在 overlay）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - virtual-service.yaml
patches:
  - target:
      kind: Rollout
      name: reviews-v1
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Rollout
      name: reviews-v2
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Rollout
      name: reviews-v3
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: DestinationRule
      name: reviews
    patch: |-
      - op: replace
        path: /spec/host
        value: reviews.staging.svc.cluster.local
