# v8（重构改名：reviews-dr → reviews，与应用名一致，全仓去掉 -dr 后缀）
# base 里 host 写占位 FQDN，各 overlay 用 patch 换成自己命名空间的真实
# FQDN：DestinationRule 的 host 是目标服务的全限定名，跨命名空间必须显式。
# v3 新增 trafficPolicy 熔断：与官方 Circuit Breaking 任务页同构——
# 官方示例正是给 reviews 的 v1/v2/v3 三个 subset 挂连接池+异常驱逐。
# 取值是"压测豁免档"（阈值放到实际打不穿），准备压测/灰度发布期间
# 不让熔断干预。档位速查：官方演示档（1/1/1、5xx×1、3m）| 日常安全档
# （10/10/10、5xx×5、30s）| 压测豁免档（当前值）；压测后建议切回
# 日常安全档（git 历史可查）。复盘详见 docs/istio-resilience.md。
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: reviews
spec:
  host: reviews.<namespace>.svc.cluster.local    # 占位：实际值由 overlay patch 注入，这里仅保持字段完整
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1024                 # 压测豁免：1024 条连接
      http:
        http1MaxPendingRequests: 1024        # 压测豁免：排队上限 1024
        maxRequestsPerConnection: 0          # 0 = 连接不限复用次数
    outlierDetection:
      consecutive5xxErrors: 100              # 压测豁免：连续 100 次 5xx 才驱逐（≈不驱逐）
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
  subsets:
    - name: v1                                # subset 名是路由层引用子集时的句柄
      labels:
        version: v1                           # 按 Pod 的 version 标签切分流量子集
    - name: v2
      labels:
        version: v2
    - name: v3
      labels:
        version: v3

# ============ 练手模板：官方演示档（注释保留，不生效） ============
# 上方 trafficPolicy 是正式取值（压测豁免档：1024 连接/100 次 5xx，实际打不穿）。
# 练手时把正式取值逐项换成演示档（一打就穿），提交走 GitOps，练完切回（git 历史可查）：
#   maxConnections:          1024 → 1      # 并发连接超过 1 → 新连接被拒
#   http1MaxPendingRequests: 1024 → 1      # 排队上限 1
#   consecutive5xxErrors:    100  → 1      # 连续 1 次 5xx → 驱逐出负载均衡池
#   baseEjectionTime:        30s  → 3m     # 熔断窗口：驱逐 3 分钟
#   interval: 10s（不变）
# 生效链：productpage 调 reviews 时，productpage 的 sidecar 读本 DR。
# 陷阱：1) DR 是客户端侧配置，改的是调用方行为；2) 熔断 + 重试互相放大
#   （正式 VS retries: 3 + perTryTimeout 2s，驱逐后重试可能打爆其他实例）；
#   3) subset 级 trafficPolicy 优先级高于顶层，本 DR 无 subset 级策略，不受影响。
