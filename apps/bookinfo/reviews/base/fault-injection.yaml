# 故障注入（Fault Injection）练手模板 —— 未启用，教学保留
# 不在 kustomization.yaml 的 resources 里 → 不渲染进集群，即"注释掉"。
#
# 【心智骨架】
# fault 挂在 VS 的 http route 上，两个注入原语：
#   1. delay —— 模拟"服务变慢"：按百分比给匹配流量加固定延迟
#   2. abort —— 模拟"服务故障"：按百分比直接返回 HTTP 状态码
# 混沌工程最轻量工具：不搞坏服务，只对流量做手脚。
#
# 【运行时因果链】（生效链：productpage 调 reviews）
# productpage 的 sidecar 调 reviews → 匹配本 VS 的 fault route
#   → 只有带 x-fault-injection: on 的请求被注入，其余不受影响
#   → 注入请求里 50% 延迟 5s、10% 直接 503（两者独立判定）
#   → 关键演示点：5s > 正式 VS 的 perTryTimeout 2s，延迟会触发
#     productpage 侧的重试（attempts: 3）——一次注入，能看到
#     "注入 → 超时 → 重试 → 可能二次超时"的完整连锁，这就是
#     熔断模板陷阱 2 说的"熔断 + 重试互相放大"的近亲。
#   → 注入目的地限定 subset v3（A/B 实验版），v1/v2 完全不受影响。
#
# 【练手步骤】
#   1. kubectl apply -f 本文件 -n dev
#   2. 正常浏览 productpage：一切如常（未带 header，不受注入影响）
#   3. 带 header 访问：
#      curl -H 'x-fault-injection: on' http://dev.bookinfo.com/productpage
#      刷新若干次：约一半变慢（5s），约十分之一报错（503）
#   4. 调大 percentage 到 100、httpStatus 换成 500，感受"全站故障"
#   5. 练完 kubectl delete -f 本文件 -n dev
#
# 【陷阱】
#   1. 同 host 多 VS 会合并路由：本文件与正式 reviews A/B VS 同 host，
#      apply 后与正式路由叠加——靠 match header 把注入限定在测试流量。
#   2. percentage 是"匹配本 route 的流量"的比例，不是全站比例。
#   3. delay 超过调用方 perTryTimeout 才触发重试（本文件 5s > 2s）。
#   4. abort 会被调用方 retries 吃掉一部分：503 会重试 2 次再报错，
#      观察到的报错次数会少于注入比例。
#   5. delay 与 abort 独立判定：本文件 50% 与 10% 不是互斥的。
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews-fault-injection
spec:
  hosts:
    - reviews
  http:
    - name: reviews-fault-route
      match:
        - headers:
            x-fault-injection:
              exact: "on"
      fault:
        delay:
          percentage:
            value: 50                     # 50% 的匹配请求
          fixedDelay: 5s                  # 延迟 5s（超过 perTryTimeout 2s）
        abort:
          percentage:
            value: 10                     # 10% 的匹配请求
          httpStatus: 503                 # 直接返回 503
      route:
        - destination:
            host: reviews
            subset: v3                    # 注入只落在 v3（A/B 实验版），不污染 v1/v2
