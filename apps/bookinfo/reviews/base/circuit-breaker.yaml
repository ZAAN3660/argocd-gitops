# 熔断（Circuit Breaking）练手模板 —— 未启用，教学保留
# 不在 kustomization.yaml 的 resources 里 → 不渲染进集群，即"注释掉"。
#
# 【与正式 DR 的分工】
# destination-rule.yaml 的正式 DR 已带熔断骨架（压测豁免档：1024/100）。
# 本文件是【演示档实验模板】（1/1/1、5xx×1、驱逐 3m），一打就穿。
#
# 与 ratings/details 的模板不同：reviews 三版本共用短名 reviews，没有
# canary 短名，本文件 host 与正式 DR【同 host】——手动 apply 会与正式
# DR 冲突（Istio 同 host 只认一份）。因此练手路径不同（见下）。
#
# 【心智骨架】
# 熔断 = trafficPolicy 的两个部件：
#   1. connectionPool   —— "堵"：连接/请求数超限就拒绝新连接
#   2. outlierDetection —— "踢"：实例连续 5xx 就被驱逐出负载均衡池
# 两者都写在【调用方出站时读取的 DR】上，管的是调用方的行为。
#
# 【运行时因果链】（生效链：productpage 调 reviews）
# productpage 的 sidecar 调 reviews
#   → 读本 DR：并发连接超过 1 → 新连接被拒；实例连续 1 次 5xx → 驱逐 3m
#   → 3m 内流量转向健康实例
#
# 【练手步骤】（同 host 冲突，二选一）
#   A. 改档位走 GitOps（推荐）：把下方 trafficPolicy 的演示档阈值复制进
#      destination-rule.yaml 提交 push，ArgoCD sync 生效；练完再改回
#      （git 历史可查，回滚干净）。
#   B. 临时替换：kubectl delete -n dev destinationrule reviews &&
#      kubectl apply -f 本文件（host 的 <namespace> 替换成 dev）。
#      下一轮 ArgoCD sync 会自动恢复正式 DR —— self-heal 就是天然回滚。
#
# 【陷阱】
#   1. DR 是客户端侧配置：改的是调用方的出站行为，不是被调方自身。
#   2. 熔断 + 重试互相放大：正式 VS 有 retries: 3 + perTryTimeout 2s，
#      驱逐后的重试可能打爆其他实例。
#   3. subset 级 trafficPolicy 优先级高于顶层：若 subsets 也定义
#      trafficPolicy，本文件的顶层字段会被部分覆盖（当前正式 DR 无
#      subset 级策略，不受影响）。
#   4. 阈值是官方演示档，仅教学用；生产值见正式 DR 的三档速查注释。
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: reviews-circuit-breaker
spec:
  host: reviews.<namespace>.svc.cluster.local   # 手动 apply 前替换 <namespace>
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1                # 官方演示档：1 条连接即打穿
      http:
        http1MaxPendingRequests: 1
        maxRequestsPerConnection: 0
    outlierDetection:
      consecutive5xxErrors: 1            # 官方演示档：1 次 5xx 即驱逐
      interval: 10s
      baseEjectionTime: 3m               # 官方演示档：驱逐 3 分钟
      maxEjectionPercent: 100
