apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: reviews            # 官方推荐标签：应用名
      app.kubernetes.io/part-of: bookinfo        # 官方推荐标签：所属应用
      app.kubernetes.io/managed-by: argocd       # 官方推荐标签：管理工具
    # 不加 includeSelectors：Service/Rollout 选择器维持 app+version 原有逻辑。
    # app.kubernetes.io/instance 不写：Argo CD 自 v2.2 起默认占用该键做追踪标签，避免冲突
resources:
  - service.yaml                            # 一个 Service 三版本共用，端口统一 9080
  - destination-rule.yaml                   # Istio DestinationRule：三个版本声明为子集 + 熔断策略
  - reviews-v1.yaml                         # 版本 Rollout：无 trafficRouting，副本数金丝雀
  - reviews-v2.yaml                         # 版本 Rollout：同上
  - reviews-v3.yaml                         # 版本 Rollout：同上
  - podmonitor.yaml                         # 网格指标抓取
  - envoyfilter-ratelimit.yaml              # 本地限流
  - analysistemplates.yaml                  # 分析模板
