# v3（修复 InvalidSpec：补回最小 canary 策略）
# A/B 测试：三个版本（v1/v2/v3）长期并存，流量分配由共享 VirtualService 的
# 权重 + header 规则决定（见 overlays 下的 virtual-service.yaml）。
# 版本之间的"发布"= 调 VS 权重，不是 Rollout 的职责；但 API 强制 strategy 存在，
# 故保留最小 canary（无 steps 无 trafficRouting），详见 reviews-v1.yaml 头部注释。
# 与 v1 的差异：名字后缀、version 标签、镜像 tag。
# v3 版本行为：调用 ratings 展示红色星级，肉眼可辨的版本差异。
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: reviews-v3
  labels:
    app: reviews                    # 服务标识：共享 Service 靠它聚合三个版本
    version: v3                     # 版本标识：DR subset 与 VS 权重靠它分流
spec:
  replicas: 1
  revisionHistoryLimit: 2           # 保留 2 个历史 ReplicaSet，够一次回滚
  strategy:
    canary:
      maxUnavailable: 0             # 最小 canary：无 steps 无 trafficRouting，语义见 v1 头部注释
  selector:
    matchLabels:
      app: reviews
      version: v3
  template:
    metadata:
      labels:
        app: reviews
        version: v3
        sidecar.istio.io/inject: "true"    # 必须注入 sidecar：内部调用要过 VS 才参与 subset 路由
        istio.io/rev: default
      annotations:
        sidecar.istio.io/inject: "true"
        istio.io/rev: default
    spec:
      containers:
        - name: reviews
          image: docker.io/istio/examples-bookinfo-reviews-v3:1.20.3
          ports:
            - containerPort: 9080
