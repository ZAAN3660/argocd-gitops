# v2（发布策略切换：版本内渐进发布 → A/B 测试）
# A/B 测试：三个版本（v1/v2/v3）长期并存，流量分配由共享 VirtualService 的
# 权重 + header 规则决定（见 overlays 下的 virtual-service.yaml）。
# 版本之间的"发布"= 调 VS 权重，不是 Rollout 的职责，因此本 Rollout
# 不再带 strategy：版本内镜像更新走默认滚动替换，canary 机制整体退役
# （金丝雀解决"新旧渐变"，A/B 解决"版本并存"，两者二选一不可叠加）。
# v1 版本行为：不调用 ratings，评论区无星级。
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: reviews-v1
  labels:
    app: reviews                    # 服务标识：共享 Service 靠它聚合三个版本
    version: v1                     # 版本标识：DR subset 与 VS 权重靠它分流
spec:
  replicas: 1
  revisionHistoryLimit: 2           # 保留 2 个历史 ReplicaSet，够一次回滚
  selector:
    matchLabels:
      app: reviews
      version: v1
  template:
    metadata:
      labels:
        app: reviews
        version: v1
        sidecar.istio.io/inject: "true"    # 必须注入 sidecar：内部调用要过 VS 才参与 subset 路由
        istio.io/rev: default
      annotations:
        sidecar.istio.io/inject: "true"
        istio.io/rev: default
    spec:
      containers:
        - name: reviews
          image: docker.io/istio/examples-bookinfo-reviews-v1:1.20.3
          ports:
            - containerPort: 9080
