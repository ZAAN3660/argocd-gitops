# v3（修复 InvalidSpec：补回最小 canary 策略）
# A/B 测试：三个版本（v1/v2/v3）长期并存，流量分配由共享 VirtualService 的
# 权重 + header 规则决定（见 overlays 下的 virtual-service.yaml）。
# 版本之间的"发布"= 调 VS 权重，不是 Rollout 的职责。
# 但 Rollout API 强制 strategy 写 canary/blueGreen 之一（缺失会被控制器判 InvalidSpec），
# 故保留最小 canary：无 steps、无 trafficRouting——版本内镜像更新 = 一次性整批替换
# （maxUnavailable: 0 保证先起新的再缩旧的），流量分配完全由共享 VS 的权重/header 决定。
# v1 版本行为：不调用 ratings，评论区无星级。
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: reviews-v1
  labels:
    app: reviews                    # 服务标识：共享 Service 靠它聚合三个版本
    version: v1                     # 版本标识：DR subset 与 VS 权重靠它分流
spec:
  replicas: 1
  revisionHistoryLimit: 2           # 保留 2 个历史 ReplicaSet，够一次回滚
  strategy:
    canary:
      maxUnavailable: 0             # 最小 canary：无 steps 无 trafficRouting，语义见头部注释
  selector:
    matchLabels:
      app: reviews
      version: v1
  template:
    metadata:
      labels:
        app: reviews
        version: v1
        sidecar.istio.io/inject: "true"    # 必须注入 sidecar：内部调用要过 VS 才参与 subset 路由
        istio.io/rev: default
      annotations:
        sidecar.istio.io/inject: "true"
        istio.io/rev: default
    spec:
      containers:
        - name: reviews
          image: docker.io/istio/examples-bookinfo-reviews-v1:1.20.3
          ports:
            - containerPort: 9080
