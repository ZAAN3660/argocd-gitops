# v2（重构改名：reviews-monitor → reviews，与应用名一致）
# reviews 应用自己的 PodMonitor：三个版本 Pod 共用 app=reviews 标签，
# selector 按 app=reviews 把 v1/v2/v3 的 envoy 端点（15090）一网打尽。
# 背景：reviews 此前无 PodMonitor，Prometheus 只能从 productpage 的 source
# 视角（调用方上报）看到 reviews 指标；Grafana Istio 面板默认查
# reporter=destination 的服务端指标，所以面板空白。
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: reviews
  labels:
    release: kube-prometheus-stack          # 必须带：stack 的 Prometheus 只认领带此标签的监控资源
spec:
  selector:
    matchLabels:
      app: reviews                           # 三个版本 Pod 共用此标签，一起抓
  podMetricsEndpoints:
    - port: http-envoy-prom                  # sidecar 端口名（Istio 注入时自动创建，15090）
      interval: 3s
      path: /stats/prometheus                # sidecar 暴露指标的路径
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
          targetLabel: rollouts_pod_template_hash   # 把 Pod 的 hash 标签提成指标标签
          regex: (.+)
          replacement: ${1}
