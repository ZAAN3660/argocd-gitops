# v1
# details 服务的东西向 VS（官方 bookinfo 样例同构：hosts 用短名）。
# productpage 内部调用 http://details:9080 时经它路由；
# details 的 Rollout 发布时只改 details-route 的权重（稳定/金丝雀）。
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: details
spec:
  hosts:
    - details
  http:
    - name: details-route
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: details
            port:
              number: 9080
          weight: 100
        - destination:
            host: details-canary
            port:
              number: 9080
          weight: 0
