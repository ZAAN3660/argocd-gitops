# v1
# details 服务的东西向 VS（官方 bookinfo 样例同构：hosts 用短名）。
# productpage 内部调用 http://details:9080 时经它路由；
# details 的 Rollout 发布时只改 details-route 的权重（稳定/金丝雀）。
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: details
spec:
  hosts:
    - details
  http:
    # ============ 练手模板：故障注入（注释保留，不生效） ============
    # 启用：取消下面注释（保持本块位于 details-route 之前——带 match 的
    # route 必须排在无 match route 前面，否则永远匹配不到）。
    # 只有带 x-fault-injection: on 的请求被注入（productpage 调 details 链）。
    # delay 5s > perTryTimeout 2s：触发 productpage 侧重试连锁；
    # abort 503 会被 retries 吃掉一部分。
    # - name: details-fault-route
    #   match:
    #     - headers:
    #         x-fault-injection:
    #           exact: "on"
    #   fault:
    #     delay:
    #       percentage: { value: 50 }
    #       fixedDelay: 5s
    #     abort:
    #       percentage: { value: 10 }
    #       httpStatus: 503
    #   route:
    #     - destination: { host: details, port: { number: 9080 } }
    - name: details-route
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: details
            port:
              number: 9080
          weight: 100
        - destination:
            host: details-canary
            port:
              number: 9080
          weight: 0
