# 故障注入（Fault Injection）练手模板 —— 未启用，教学保留
# 不在 kustomization.yaml 的 resources 里 → 不渲染进集群，即"注释掉"。
#
# 【心智骨架】
# fault 挂在 VS 的 http route 上，两个注入原语：
#   1. delay —— 模拟"服务变慢"：按百分比给匹配流量加固定延迟
#   2. abort —— 模拟"服务故障"：按百分比直接返回 HTTP 状态码
#
# 【运行时因果链】（生效链：productpage 调 details）
# productpage 的 sidecar 调 details → 匹配本 VS 的 fault route
#   → 只有带 x-fault-injection: on 的请求被注入
#   → 50% 延迟 5s（> 正式 VS 的 perTryTimeout 2s → 触发调用方重试，
#      演示"注入 → 超时 → 重试"连锁）
#   → 10% 直接 503（被 retries 吃掉一部分，观察时算账）
#   → 注入目的地是稳定通道 details（当前 weight 100%）
#
# 【练手步骤】
#   1. kubectl apply -f 本文件 -n dev
#   2. 正常浏览 productpage 的详情区：如常
#   3. curl -H 'x-fault-injection: on' http://dev.bookinfo.com/productpage
#      观察详情区变慢/报错
#   4. 练完 kubectl delete -f 本文件 -n dev
#
# 【陷阱】
#   1. 同 host 多 VS 会合并路由：与正式 details VS 同 host，靠 match
#      header 把注入限定在测试流量。
#   2. percentage 是"匹配本 route 的流量"的比例。
#   3. delay 要超过调用方 perTryTimeout 才触发重试（本文件 5s > 2s）。
#   4. abort 会被调用方 retries 吃掉一部分。
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: details-fault-injection
spec:
  hosts:
    - details
  http:
    - name: details-fault-route
      match:
        - headers:
            x-fault-injection:
              exact: "on"
      fault:
        delay:
          percentage:
            value: 50
          fixedDelay: 5s
        abort:
          percentage:
            value: 10
          httpStatus: 503
      route:
        - destination:
            host: details
            port:
              number: 9080
