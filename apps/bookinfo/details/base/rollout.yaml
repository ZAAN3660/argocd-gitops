apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: details
  labels:
    app: details
spec:
  replicas: 1                               # 与 KEDA minReplicaCount 对齐；灰度中 stable+canary 合计不超过它
  revisionHistoryLimit: 2                   # 保留 2 个历史 ReplicaSet，够一次回滚
  selector:
    matchLabels:
      app: details                          # 只认自己的 Pod
  template:
    metadata:
      labels:
        app: details
        version: "1.16.2"                   # 网格指标 destination_version 的数据源；升级镜像时同步改
        sidecar.istio.io/inject: "true"     # 显式声明注入（label + annotation 双保险）
        istio.io/rev: default
      annotations:
        sidecar.istio.io/inject: "true"
        istio.io/rev: default
    spec:
      containers:
        - name: details
          image: docker.io/istio/examples-bookinfo-details-v1:1.16.2
          ports:
            - name: http                    # 端口名：Service targetPort、PodMonitor 的 port 引用都靠它
              containerPort: 9080           # bookinfo 统一端口
          resources:
            requests:                       # KEDA CPU/内存触发器的"使用率"分母，缺了触发器不生效
              cpu: 100m
              memory: 128Mi
            # 2026-08-22 移除 limits：压测期 CPU 节流/组件重启排查中，放开封顶观测真实峰值（requests 保留，KEDA 触发器分母）
          readinessProbe:                   # 就绪探针：Pod 就绪才收流量，灰度切流的前提
            tcpSocket:                      # bookinfo 镜像无统一就绪端点，TCP 探活与镜像解耦
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
  strategy:
    canary:                                 # 发布策略：灰度
      stableService: details                # 稳定通道 = 官方短名
      canaryService: details-canary         # 金丝雀通道
      maxUnavailable: 0                     # 发布全程现有 Pod 不减，服务不中断
      trafficRouting:                       # 流量切分交给 Istio（与 nginx 方案二选一，不能同时配）
        istio:
          virtualService:
            name: details                   # 本应用自己的 VS（与产品服务同名）：Rollout 接管其权重
            routes:
              - details-route               # 只列"权重"那条 route，静态规则 Rollout 不碰
      steps:                                # 发布节奏：逐步放量，每步 pause 等分析通过
        - setWeight: 10                     # 金丝雀 10%
        - pause: {}                         # 无限期暂停：AnalysisRun 达标自动进下一步，失败自动回滚
        - setWeight: 25
        - pause: {}
        - setWeight: 75
        - pause: {}
        - setWeight: 100                    # 全量
      # analysis:                             # 灰度自动分析：三个模板"且"关系，都过才算过
      #   templates:
      #     - templateName: details-traffic-check     # 先确认金丝雀有流量，防"无流量假通过"
      #     - templateName: details-success-rate      # 金丝雀成功率 >= 90%
      #     - templateName: details-p99-latency       # 金丝雀 P99 <= 500ms
      #   args:
      #     - name: stable-hash
      #       valueFrom:
      #         podTemplateHashValue: Stable  # 自动取稳定 ReplicaSet 的 hash
      #     - name: canary-hash
      #       valueFrom:
      #         podTemplateHashValue: Latest  # 自动取金丝雀 ReplicaSet 的 hash
