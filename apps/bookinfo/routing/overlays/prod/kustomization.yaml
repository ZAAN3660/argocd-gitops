# v2
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
labels:
  - pairs:
      app.kubernetes.io/name: bookinfo            # 官方推荐标签：bookinfo 应用的路由治理层
      app.kubernetes.io/managed-by: argocd
    # overlay 的 labels 作用于最终全部资源（含 base 的 Gateway/分析模板/EnvoyFilter）。
    # app.kubernetes.io/instance 不写：Argo CD 自 v2.2 起默认占用该键做追踪标签，避免冲突
resources:
  - ../../base
