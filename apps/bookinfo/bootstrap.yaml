apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-bookinfo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default                          # 根应用只能用内置 default：自定义 project 尚未同步，不能先给自己套约束
  source:
    repoURL: https://github.com/ZAAN3660/argocd-gitops.git
    targetRevision: init
    path: apps/bookinfo
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bookinfo                                             # project = 应用域/团队名；新增应用域/团队，就新增一个 project 文件
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"                       # 同步波最低档：create 时最先建，prune 时最后删（prune 按 wave 逆序）
                                                             # 只能约束 bootstrap 同一次同步内部的相对顺序，管不住 appset 控制器异
                                                             # 步删应用的竞态
spec:
  description: bookinfo 业务域      
  sourceRepos:
    - 'https://github.com/ZAAN3660/argocd-gitops.git'        # Git 仓库列表
  destinations:                                              # (server, namespace) 二元组，不在清单里的组合一律拒绝 sync
    - namespace: dev
      server: https://kubernetes.default.svc
    - namespace: staging
      server: https://kubernetes.default.svc
    - namespace: prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:                                  # 集群级资源白名单：只放行 Namespace（应用要自建环境命名空间）
    - group: ''
      kind: Namespace
    # namespaceResourceWhitelist: []                         # 这一行必须整个不写（nil = 放行所有命名空间级资源）。显式写 [] 会被 Argo 
                                                             # CD 解释为"拒绝一切命名空间级资源"，Service/Rollout 等全会被拦截
  sourceNamespaces: []                                       # 空 = 不限制 Application 来源命名空间
