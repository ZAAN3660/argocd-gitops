apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-bookinfo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default                          # 根应用只能用内置 default：自定义 project 尚未同步，不能先给自己套约束
  source:
    repoURL: https://github.com/ZAAN3660/argocd-gitops.git
    targetRevision: init
    path: apps/bookinfo
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bookinfo                                             # project = 应用域/团队名；新增应用域/团队，就新增一个 project 文件
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"                       # 同步波最低档：create 时最先建，prune 时最后删（prune 按 wave 逆序）
                                                             # 只能约束 bootstrap 同一次同步内部的相对顺序，管不住 appset 控制器异
                                                             # 步删应用的竞态
spec:
  description: bookinfo 业务域      
  sourceRepos:
    - 'https://github.com/ZAAN3660/argocd-gitops.git'        # Git 仓库列表
  destinations:                                              # (server, namespace) 二元组，不在清单里的组合一律拒绝 sync
    - namespace: dev
      server: https://kubernetes.default.svc
    - namespace: staging
      server: https://kubernetes.default.svc
    - namespace: prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:                                  # 集群级资源白名单：只放行 Namespace（应用要自建环境命名空间）
    - group: ''
      kind: Namespace
    # namespaceResourceWhitelist: []                         # 这一行必须整个不写（nil = 放行所有命名空间级资源）。显式写 [] 会被 Argo 
                                                             # CD 解释为"拒绝一切命名空间级资源"，Service/Rollout 等全会被拦截
  sourceNamespaces: []                                       # 空 = 不限制 Application 来源命名空间
---
# 一个应用 + 一套部署环境 = 一个 Application，多个 Application = 一个 ApplicationSet
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: productpage
  namespace: argocd
spec:
  goTemplate: true                                  # 启用 go 模板
  generators:
    - list:
        elements:                                   # 环境列表
          - environment: dev
            server: https://kubernetes.default.svc
            namespace: dev
          - environment: staging
            server: https://kubernetes.default.svc
            namespace: staging
          - environment: prod
            server: https://kubernetes.default.svc
            namespace: prod
  template:                                         # 每个环境套这份模板，就产出 1 个 Application
    metadata:
      name: 'bookinfo-productpage-{{.environment}}' # Argo CD 中应用的名字，不会传播到应用的 Pod
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bookinfo                             # 挂到 Argo CD project 下，部署目标受 project 的 destinations 白名单约束
      ignoreDifferences:                            # 预置豁免清单：灰度发布时 Rollout 控制器会动态改写下述字段，
        - group: argoproj.io                        # Argo CD 检测漂移（OutOfSync）时跳过它们，不把这些运行时的改动当漂移回滚
          kind: Rollout
          jsonPointers:
            - /spec/template/metadata/labels/rollouts-pod-template-hash
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            - .spec.http[].route[].weight
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/selector
      source:                                       # 当前应用的部署清单仓库
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: apps/bookinfo/productpage/overlays/{{.environment}}
      destination:                                  # 当前应用部署到哪里
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: details
  namespace: argocd
spec:
  goTemplate: true                                  # 启用 Go 模板
  generators:
    - list:
        elements:                                   # 环境名：同时用作 overlay 路径段和应用名后缀
          - environment: dev
            server: https://kubernetes.default.svc
            namespace: dev
          - environment: staging
            server: https://kubernetes.default.svc
            namespace: staging
          - environment: prod
            server: https://kubernetes.default.svc
            namespace: prod
  template:                                         # 每个环境套这份模板，就产出 1 个 Application
    metadata:
      name: 'bookinfo-details-{{.environment}}'     # Argo CD 中应用的名字，不会传播到应用的 Pod
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bookinfo
      ignoreDifferences:
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/template/metadata/labels/rollouts-pod-template-hash
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            - .spec.http[].route[].weight
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/selector
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: apps/bookinfo/details/overlays/{{.environment}}
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
