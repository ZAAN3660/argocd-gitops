# 故障注入（Fault Injection）练手模板 —— 未启用，教学保留
# 不在 kustomization.yaml 的 resources 里 → 不渲染进集群，即"注释掉"。
#
# 【心智骨架】
# fault 挂在 VS 的 http route 上，两个注入原语：
#   1. delay —— 模拟"服务变慢"
#   2. abort —— 模拟"服务故障"
#
# 【运行时因果链】（生效链：reviews v2/v3 调 ratings）
# reviews 的 sidecar 调 ratings → 匹配本 VS 的 fault route
#   → 只有带 x-fault-injection: on 的请求被注入
#   → 50% 延迟 5s、10% 直接 503
#   → 观察链路下游：productpage 页面星级区（调 reviews 的 v2/v3 时）
#      变慢或显示无评级——故障会沿调用链向上传播。
#
# 【练手步骤】
#   1. kubectl apply -f 本文件 -n dev
#   2. 带 header 访问 productpage 数次，观察星级区变慢/无评级
#   3. 练完 kubectl delete -f 本文件 -n dev
#
# 【陷阱】
#   1. 同 host 多 VS 会合并路由：与正式 ratings VS 同 host，靠 match
#      header 把注入限定在测试流量。
#   2. 故障沿调用链传播：ratings 的 503 会让 reviews 拿不到评级数据，
#      productpage 显示"无评级"——但 productpage 页面本身不报 503，
#      这是 Istio 故障注入与"服务真挂"在观察上的差异。
#   3. abort 会被 reviews 侧的 retries 吃掉一部分。
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ratings-fault-injection
spec:
  hosts:
    - ratings
  http:
    - name: ratings-fault-route
      match:
        - headers:
            x-fault-injection:
              exact: "on"
      fault:
        delay:
          percentage:
            value: 50
          fixedDelay: 5s
        abort:
          percentage:
            value: 10
          httpStatus: 503
      route:
        - destination:
            host: ratings
            port:
              number: 9080
