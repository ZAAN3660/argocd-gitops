# ============================================================
# 熔断（Circuit Breaking）练手示例 —— 未启用，教学保留
# ============================================================
# 本文件是完整合法的 YAML，但【未加入 kustomization.yaml】，
# Kustomize 只渲染 resources 列出的文件，因此它不会被 ArgoCD 带进集群
# —— 这本身就是"注释掉"。启用方式二选一：
#   A. 把本文件加进 kustomization.yaml 的 resources（三环境全部渲染）
#   B. 手动 kubectl apply -f 本文件（仅当前集群，配合 -n dev 使用）
#
# 【心智骨架】
# Istio 的"熔断" = DestinationRule 里 trafficPolicy 的两个部件：
#   1. connectionPool   —— 容量保护："堵"。连接/请求数超限就拒绝新连接
#   2. outlierDetection —— 质量踢出："踢"。实例连续出错就踢出负载均衡池
# 两者都写在【调用方访问目标服务时读取的那份 DR】上。
#
# 【运行时因果链】（本示例生效链：reviews v2/v3 调 ratings）
# reviews 的 sidecar 出站调 ratings
#   → 读取 host: ratings 的 DR（本文件）
#   → 并发连接数超过 maxConnections → 新连接被拒绝（connectionPool 生效）
#   → ratings 某实例连续 5 次 5xx → 该实例被踢出负载均衡池 60s
#   → 60s 熔断窗口内 reviews 不再给它发流量，请求转到健康实例
#
# 【练手步骤】
#   1. 启用本文件（方式 A 或 B）。
#   2. 制造压力：fortio 高并发打 reviews（-c 200 并发）让它转发 ratings，
#      观察 connectionPool 拒连；或制造 ratings 连续 5xx 看 outlierDetection 踢出。
#   3. 观察：
#      - kubectl -n dev logs deploy/reviews-v2 -c istio-proxy | grep -i 'reset\|eject'
#      - Prometheus: istio_destination_rule_outlier_detection_ejections_total
#   4. 收尾：删除本文件引用 / kubectl delete，恢复原状。
#
# 【陷阱】
#   1. DR 是【客户端侧】配置：改的是调用方 sidecar 的出站行为，不是被调方自身。
#   2. 熔断 + 重试互相放大：调用方若配了 retry，踢出后的重试可能打爆其他实例。
#   3. subset 级 trafficPolicy 优先级高于 DR 顶层：若 subsets 也定义了
#      trafficPolicy，本文件的部分字段会被覆盖。
#   4. 熔断只对走 mesh 的流量生效：无 sidecar 的调用方不受这份 DR 约束。
#   5. 阈值是示例值（100 连接等）：真实值要按服务容量压测后定，别照抄。
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: ratings-circuit-breaker-example    # 注意：与正式 ratings DR 同名会冲突，
spec:                                      # 手动 apply 前若已存在同名请改名
  host: ratings
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100                # 并发 TCP 连接上限（示例值）
      http:
        http1MaxPendingRequests: 10        # HTTP/1.1 排队等待上限
        http2MaxRequests: 100              # HTTP/2 并发请求上限
    outlierDetection:
      consecutive5xxErrors: 5              # 连续 5 次 5xx 判定异常
      interval: 30s                        # 评估窗口
      baseEjectionTime: 60s                # 熔断窗口：踢出 60 秒
      maxEjectionPercent: 100              # 允许同时踢出的实例百分比上限
