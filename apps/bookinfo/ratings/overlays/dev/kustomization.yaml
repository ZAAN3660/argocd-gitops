apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - virtual-service.yaml
images:
  - name: docker.io/istio/examples-bookinfo-ratings-v1
    newTag: 1.20.0
patches:
  - target:
      kind: ScaledObject
      name: ratings
    patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/query
        value: |
          sum(rate(istio_requests_total{destination_service=~"ratings.*", destination_service_namespace="dev", response_code=~"2..|3.."}[2m]))
  - target:
      kind: DestinationRule
      name: ratings
    patch: |-
      - op: replace
        path: /spec/host
        value: ratings.dev.svc.cluster.local
