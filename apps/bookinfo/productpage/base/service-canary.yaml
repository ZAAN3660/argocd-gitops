# v5（写实化：Service 名保持不变，<短名>-canary 是金丝雀通道约定名）
apiVersion: v1
kind: Service
metadata:
  name: productpage-canary
  labels:
    app: productpage
spec:
  type: ClusterIP
  selector:
    app: productpage                        # 与稳定 Service 同值：发布时控制器注入 hash 标签，把金丝雀 Pod 单独选出来
  ports:
    - name: http
      port: 9080
      targetPort: 9080
      protocol: TCP
