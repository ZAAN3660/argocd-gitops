apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: productpage       # 官方推荐标签：应用名
      app.kubernetes.io/part-of: bookinfo       # 官方推荐标签：所属应用
      app.kubernetes.io/managed-by: argocd      # 官方推荐标签：管理工具
resources:
  - rollout.yaml                                # 发布总指挥
  - service.yaml                                # 稳定通道（官方短名，镜像硬编码）
  - service-preview.yaml                        # 绿色通道（<短名>-preview，蓝绿发布）
  - scaledobject.yaml                           # KEDA 自动扩缩容
  - destination-rule.yaml                       # 熔断保护
  - envoyfilter-ratelimit.yaml                  # 本地限流
  - analysistemplates.yaml                      # 灰度分析模板
