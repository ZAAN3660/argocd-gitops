apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: productpage
  labels:
    release: kube-prometheus-stack         # 必须带：stack 的 Prometheus 只认领带此标签的监控资源
spec:
  selector:
    matchLabels:
      app: productpage
  podMetricsEndpoints:
    - port: http-envoy-prom                 # sidecar 端口名（Istio 注入时自动创建，15090）
      interval: 3s
      path: /stats/prometheus               # sidecar 暴露指标的路径
      relabelings:                          # 把 Pod 的 hash 标签提成指标标签，效果：网格指标多出 rollouts_pod_template_hash 标签，分析模板靠它区分 stable/canary 两批 Pod 的数据 
        - sourceLabels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
          targetLabel: rollouts_pod_template_hash
          regex: (.+)
          replacement: ${1}
    # 业务应用指标端点 - 应用需暴露 /metrics 才能抓到
    # - port: http
    #   interval: 3s
    #   path: /metrics
