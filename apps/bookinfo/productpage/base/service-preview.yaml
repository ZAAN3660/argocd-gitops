# v1（蓝绿化：原 <短名>-canary 金丝雀通道退役，替换为 <短名>-preview 绿色通道）
apiVersion: v1
kind: Service
metadata:
  name: productpage-preview
  labels:
    app: productpage
spec:
  type: ClusterIP
  selector:
    app: productpage                        # 与 active Service 同值：蓝绿部署时控制器注入 hash 标签，把绿 Pod 单独选出来
  ports:
    - name: http
      port: 9080
      targetPort: 9080
      protocol: TCP
