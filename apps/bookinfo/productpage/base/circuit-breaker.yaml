# 熔断（Circuit Breaking）练手模板 —— 未启用，教学保留
# 不在 kustomization.yaml 的 resources 里 → 不渲染进集群，即"注释掉"。
#
# 【本文件的定位：反例教学】
# productpage 是入口服务：外部流量经 Gateway 进入，网格内没有任何
# 服务调 productpage。因此这份 DR【没有调用方 sidecar 会读它】——
# 熔断无处生效。这是刻意保留的反例：熔断必须配在"有网格内调用方的
# 目标"上才有意义。想练熔断请用 details/ratings（host 写 -canary，
# 零冲突）或 reviews（改档位走 GitOps）的模板。
# productpage 的保护应该做在入口层：它的盾是 envoyfilter-ratelimit.yaml
# （限流），不是熔断。
#
# 【心智骨架】（同上，见 ratings/base/circuit-breaker.yaml）
#   1. connectionPool   —— "堵"
#   2. outlierDetection —— "踢"
#
# 【如果想验证"反例"】
# 把 host 的 <namespace> 替换成 dev 后 apply 本文件，然后高并发打
# productpage 入口——观察：没有任何拒连/驱逐发生（无 sidecar 读取）。
#
# 【陷阱】
#   1. Gateway 是入口代理，不是"调用 productpage 的 sidecar"：入口流量
#      不经过任何网格内调用方的 DR 读取路径。
#   2. 入口层防护 = 限流（EnvoyFilter）+ Gateway 层配置，熔断管不到这。
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: productpage-circuit-breaker
spec:
  host: productpage.<namespace>.svc.cluster.local   # 手动 apply 前替换 <namespace>
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1                # 官方演示档：1 条连接即打穿
      http:
        http1MaxPendingRequests: 1
        maxRequestsPerConnection: 0
    outlierDetection:
      consecutive5xxErrors: 1            # 官方演示档：1 次 5xx 即驱逐
      interval: 10s
      baseEjectionTime: 3m               # 官方演示档：驱逐 3 分钟
      maxEjectionPercent: 100
