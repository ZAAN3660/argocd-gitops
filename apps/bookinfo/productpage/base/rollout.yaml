# v6（发布策略切换：金丝雀 canary → 蓝绿 blueGreen）
# 蓝绿发布总指挥：新版本以 preview（绿）整批部署，验证通过后一步 promote 切流。
# 与金丝雀的本质差异：
#   金丝雀：新旧并存、按比例渐变，Rollout 改 VS 权重；
#   蓝绿：新旧整批切换，Rollout 改 Service selector，VS 全程静态指向 active Service。
# 因此本文件不再有 steps/trafficRouting（蓝绿策略的 API 里没有这些字段，
# 它们都是 canary 专属——蓝绿的切流根本不经过 Istio，selector 一换即全局生效）。
# Service 名保持不变（官方短名 productpage，镜像硬编码的 DNS 名不能变）。
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: productpage
  labels:
    app: productpage
spec:
  replicas: 1                               # 与 KEDA minReplicaCount 对齐；蓝绿切换窗口内 蓝+绿 合计会短暂翻倍
  revisionHistoryLimit: 2                   # 保留 2 个历史 ReplicaSet，够一次回滚
  selector:
    matchLabels:
      app: productpage                      # 只认自己的 Pod
  template:
    metadata:
      labels:
        app: productpage
        version: "1.16.2"                   # 网格指标 destination_version 的数据源；升级镜像时同步改
        sidecar.istio.io/inject: "true"     # 显式声明注入（label + annotation 双保险）
        istio.io/rev: default
      annotations:
        sidecar.istio.io/inject: "true"
        istio.io/rev: default
    spec:
      containers:
        - name: productpage
          image: docker.io/istio/examples-bookinfo-productpage-v1:1.16.2
          ports:
            - name: http                    # 端口名：Service targetPort、PodMonitor 的 port 引用都靠它
              containerPort: 9080           # bookinfo 统一端口
          resources:
            requests:                       # KEDA CPU/内存触发器的"使用率"分母，缺了触发器不生效
              cpu: 100m
              memory: 128Mi
            limits:                          # 封顶：防止异常流量打爆节点，也是 CPU 节流/OOM 观测的前提
              cpu: 500m
              memory: 256Mi
          readinessProbe:                   # 就绪探针：Pod 就绪才收流量，promote 切流的前提
            tcpSocket:                      # bookinfo 镜像无统一就绪端点，TCP 探活与镜像解耦
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
  strategy:
    blueGreen:                              # 发布策略：蓝绿
      activeService: productpage            # 蓝：对外流量入口（官方短名），promote 时控制器切它的 selector
      previewService: productpage-preview   # 绿：新版预发布，promote 前集群内直连验证
      autoPromotionEnabled: false           # 手动 promote：kubectl argo rollouts promote productpage
      scaleDownDelaySeconds: 30             # promote 后旧版保留 30s 再缩，留快速回退窗口
      # prePromotionAnalysis:               # 可选：promote 前自动分析（模板需另建，routing 应用已删除）
      #   templates:
      #     - templateName: productpage-success-rate    # 绿 Pod 成功率 >= 90%
      #   args:
      #     - name: preview-hash
      #       valueFrom:
      #         podTemplateHashValue: Latest
