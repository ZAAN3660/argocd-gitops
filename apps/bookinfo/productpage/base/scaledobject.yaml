# 实际扩缩由 KEDA 创建的 HPA 执行，副本数取各指标建议值的最大值。
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: productpage
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: productpage
  minReplicaCount: 2                        # 最少副本
  maxReplicaCount: 4                        # 扩容上限
  pollingInterval: 5                        # 每 N 秒查一次触发器指标
  cooldownPeriod: 120                       # 指标降下来后等 N 秒才缩容，防抖动
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:                            # 扩容要快：立即响应突发
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100                    # 一次最多翻倍
              periodSeconds: 15
        scaleDown:                          # 缩容要慢：防止来回抖动
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 20                     # 一次最多缩 20%
              periodSeconds: 60
  triggers:
    # - type: cpu                             # 触发器 1：CPU 使用率超 resources.requests.cpu 的 80%
    #   metricType: Utilization
    #   metadata:
    #     value: "80"
    # - type: memory                          # 触发器 2：内存使用率超 resources.requests.memory 的 75%
    #   metricType: Utilization
    #   metadata:
    #     value: "75"
    - type: prometheus                      # 触发器 3：QPS 超阈值（网格指标，stable+canary 合计）
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: |
          sum(rate(istio_requests_total{destination_service=~"productpage.*", response_code=~"2..|3.."}[2m]))
        threshold: "100000"                     # 每秒成功请求超 10 扩容；演示值，生产按容量评估
