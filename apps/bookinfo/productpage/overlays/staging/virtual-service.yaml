# v5（蓝绿化：canary destination 退役，VS 静态指向 active Service）
# 一个 VS 同时管两路流量：
# 南北向：hosts=staging.bookinfo.com + gateways=productpage（外部入口）
# 东西向：hosts=productpage + gateways=mesh（网格内短名调用）
# 注意：gateways 里 mesh 必须保留——列表里没有 mesh 时，VS 只对列出的
# Gateway 生效，网格内调用将绕过 VS 直连 Service。
# 蓝绿模式下本 VS 是静态的：流量始终指向 productpage（active Service），
# promote 的切换发生在 Service selector 层，Rollout 不再改 VS 权重。
# 绿色版本验证：promote 前集群内直连 productpage-preview:9080（网格内短名）。
# 历史：v1 东西向 VS → v2 合并 → v3 改名统一 → v4 域名分环境 → v5 蓝绿化
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: productpage
spec:
  hosts:
    - staging.bookinfo.com                # 外部入口域名（staging 环境专属）
    - productpage                         # 网格内短名
  gateways:
    - productpage                         # 外部入口 Gateway（南北向）
    - mesh                                # 网格内 sidecar（东西向），必须保留
  http:
    # ============ 练手模板：入口故障注入（注释保留，不生效） ============
    # 启用：取消下面注释（保持本块位于 productpage-route 之前——带 match
    # 的 route 必须排在无 match route 前面，否则永远匹配不到）。
    # 只有带 x-fault-injection: on 的入口请求被注入：50% 延迟 5s、10% 直接 503。
    # 这是四个应用里唯一挂在【入口】的注入（官方故障注入任务标准位置）：
    # 故障在最上游注入，所有下游都会感受到，reviews 侧重试（attempts: 3）会放大。
    # 练手：取消注释 → 提交 sync → 带 header 访问本环境域名（staging.bookinfo.com）观察。
    # - name: productpage-fault-route
    #   match:
    #     - headers:
    #         x-fault-injection:
    #           exact: "on"
    #   fault:
    #     delay:
    #       percentage: { value: 50 }
    #       fixedDelay: 5s        # 5s > 调用方 perTryTimeout 2s：触发重试连锁
    #     abort:
    #       percentage: { value: 10 }
    #       httpStatus: 503
    #   route:
    #     - destination: { host: productpage, port: { number: 9080 } }
    - name: productpage-route
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: productpage              # 只指 active Service：蓝绿切换对 VS 完全透明
            port:
              number: 9080
          weight: 100
