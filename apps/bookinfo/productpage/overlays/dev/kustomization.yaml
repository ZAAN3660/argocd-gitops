apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - virtual-service.yaml                    # 合并后的 VS：同时管外部入口与网格内调用，Rollout 接管其权重
  - gateway.yaml                            # 南北流量的统一入口
images:
  - name: docker.io/istio/examples-bookinfo-productpage-v1
    newTag: 1.20.0                          # 可用 TAG：1.20.0 、1.20.1 、1.20.2 、1.20.3
patches:
  - target:
      kind: ScaledObject
      name: productpage
    patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/query
        value: |
          sum(rate(istio_requests_total{destination_service=~"productpage.*", destination_service_namespace="dev", response_code=~"2..|3.."}[2m]))
  - target:
      kind: DestinationRule
      name: productpage
    patch: |-
      - op: replace
        path: /spec/host
        value: productpage.dev.svc.cluster.local
