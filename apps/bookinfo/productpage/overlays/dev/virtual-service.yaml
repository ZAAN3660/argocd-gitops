# v4（三环境域名独立：dev 环境 hosts 换成 dev.bookinfo.com）
# 一个 VS 同时管两路流量：
# 南北向：hosts=dev.bookinfo.com + gateways=productpage（外部入口）
# 东西向：hosts=productpage + gateways=mesh（网格内短名调用）
# 注意：gateways 里 mesh 必须保留——列表里没有 mesh 时，VS 只对列出的
# Gateway 生效，网格内调用将绕过 VS 直连 Service（灰度期间会打到金丝雀 Pod）。
# Rollout.trafficRouting 引用本 VS 的 productpage-route 权重。
# 历史：v1 东西向 VS（productpage-v1）与 v6 网关 VS（routing-v1）→ v2 合并 → v3 改名统一
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: productpage
spec:
  hosts:
    - dev.bookinfo.com                    # 外部入口域名（dev 环境专属）
    - productpage                         # 网格内短名
  gateways:
    - productpage                         # 外部入口 Gateway（南北向）
    - mesh                                # 网格内 sidecar（东西向），必须保留
  http:
    - name: productpage-route
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: productpage
            port:
              number: 9080
          weight: 100
        - destination:
            host: productpage-canary
            port:
              number: 9080
          weight: 0
