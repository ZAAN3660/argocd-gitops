# v8.1（骨架环境：放开 prod 但副本数 0）
# Rollout replicas=0：环境骨架先就位，不起 Pod；
# ScaledObject minReplicaCount 同步设为 0：否则 KEDA 会把副本拉回 1。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  - virtual-service.yaml                    # 合并后的 VS：同时管外部入口与网格内调用，Rollout 接管其权重
  - gateway.yaml                            # 南北流量的统一入口
images:
  - name: docker.io/istio/examples-bookinfo-productpage-v1
    newTag: 1.16.2
patches:
  - target:
      kind: Rollout
      name: productpage
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: ScaledObject
      name: productpage
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 0
  - target:
      kind: DestinationRule
      name: productpage
    patch: |-
      - op: replace
        path: /spec/host
        value: productpage.prod.svc.cluster.local
