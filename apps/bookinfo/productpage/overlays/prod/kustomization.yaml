apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  - virtual-service.yaml                    # 合并后的 VS：同时管外部入口与网格内调用，Rollout 接管其权重
  - gateway.yaml                            # 南北流量的统一入口
images:
  - name: docker.io/istio/examples-bookinfo-productpage-v1
    newTag: 1.16.2
patches:
  - target:
      kind: Rollout
      name: productpage
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: ScaledObject
      name: productpage
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 0
      - op: replace
        path: /spec/triggers/0/metadata/query
        value: |
          sum(rate(istio_requests_total{destination_service=~"productpage.*", destination_service_namespace="prod", response_code=~"2..|3.."}[2m]))
  - target:
      kind: DestinationRule
      name: productpage
    patch: |-
      - op: replace
        path: /spec/host
        value: productpage.prod.svc.cluster.local
