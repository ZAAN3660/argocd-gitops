# 一个应用 + 一套部署环境 = 一个 Application，多个 Application = 一个 ApplicationSet
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: productpage
  namespace: argocd
spec:
  goTemplate: true                                  # 启用 go 模板
  generators:
    - list:
        elements:                                   # 环境列表
          - environment: dev
            server: https://kubernetes.default.svc
            namespace: dev
          - environment: staging
            server: https://kubernetes.default.svc
            namespace: staging
          - environment: prod
            server: https://kubernetes.default.svc
            namespace: prod
  template:                                         # 每个环境套这份模板，就产出 1 个 Application
    metadata:
      name: 'bookinfo-productpage-{{.environment}}' # Argo CD 中应用的名字，不会传播到应用的 Pod
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bookinfo                             # 挂到 Argo CD project 下，部署目标受 project 的 destinations 白名单约束
      ignoreDifferences:                            # 预置豁免清单：灰度发布时 Rollout 控制器会动态改写下述字段，
        - group: argoproj.io                        # Argo CD 检测漂移（OutOfSync）时跳过它们，不把这些运行时的改动当漂移回滚
          kind: Rollout
          jsonPointers:
            - /spec/template/metadata/labels/rollouts-pod-template-hash
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            - .spec.http[].route[].weight
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/selector
      source:                                       # 当前应用的部署清单仓库
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: apps/bookinfo/productpage/overlays/{{.environment}}
      destination:                                  # 当前应用部署到哪里
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
