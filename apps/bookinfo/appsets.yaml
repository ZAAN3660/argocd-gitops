        elements:                                   # 环境名：同时用作 overlay 路径段和应用名后缀
          - environment: dev
            server: https://kubernetes.default.svc
            namespace: dev
          - environment: staging
            server: https://kubernetes.default.svc
            namespace: staging
          - environment: prod
            server: https://kubernetes.default.svc
            namespace: prod
  template:                                         # 每个环境套这份模板，就产出 1 个 Application
    metadata:
      name: 'bookinfo-details-{{.environment}}'     # Argo CD 中应用的名字，不会传播到应用的 Pod
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bookinfo
      ignoreDifferences:
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/template/metadata/labels/rollouts-pod-template-hash
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            - .spec.http[].route[].weight
        - group: ""
