# collector 的 OTLP 入口 Service —— 镜像对象：OpenTelemetryCollector CR 落地出的 agent DaemonSet。
# 为什么需要：应用 SDK 无法用 localhost 打到独立 Pod 里的 agent（localhost 是应用自己的网络命名空间），
# 需要集群内寻址入口。两个端口与 CR 的 otlp receiver 对应：4317=grpc, 4318=http。
# selector 依赖 operator 给 agent Pod 打的固定 label（<CR name>-collector = opentelemetry-collector-collector）。
# 边界：daemonset 多节点时，ClusterIP 轮询可能把请求发给非本节点 agent（跨节点转发）；
# 单节点（当前 Docker Desktop）无影响。多节点要本地化可将 internalTrafficPolicy 设为 Local。
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: opentelemetry-collector
spec:
  selector:
    app.kubernetes.io/name: opentelemetry-collector-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
