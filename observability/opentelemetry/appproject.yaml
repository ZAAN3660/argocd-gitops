# observability AppProject：可观测性数据面域的权限边界，根应用 bootstrap-otel 的同步清单之一。
# sync-wave -999 = 同一次同步内的最低波：create 时最先建。
# 删除顺序不由 wave 保证，由 finalizer 保证（官方 declarative-setup 语义：
# 项目在没有任何 Application 引用它之前不会被删除）。
# ── 删除顺序根因复盘（2026-08-25 bootstrap-bookinfo 误删事故）────────────
# 现象：删域根应用时 AppProject 瞬间消失，AppSet/Application 磨蹭很久才删完。
# 根因链（按因果序）：
# 1) sync-wave 只定义 sync 的 apply 顺序（lowest→highest），删除路径无等价物；
# 2) 删除顺序的真相是 finalizer 差异：AppProject 当时没挂 finalizer → 秒删；
#    AppSet/Application 挂 resources-finalizer → 须先级联删净各自管理的对象
#    （AppSet→Application→集群资源）才删自己；
# 3) delete 默认 foreground 传播：先删完依赖再删自身（19:16 日志铁证）；
# 4) 陷阱：删除期间根应用 selfHeal 仍在自愈，把 AppProject 秒重建为无主孤儿。
# 对策：AppProject 挂 resources-finalizer（本文件已挂）——官方语义：
#     "项目在没有任何 Application 引用它之前不会被删除"。
# ── 故障复盘（2026-08-24）──
# 现象：Application opentelemetry-collector 永久 OutOfSync/Missing，monitoring 里没有任何
#       collector 资源，operator 无从渲染 DaemonSet。
# 根因链：本项目 clusterResourceWhitelist 最初只放行 Namespace；而 collector/rbac.yaml
#       的 ClusterRole/ClusterRoleBinding 是集群级资源，Argo CD 校验时报
#       SyncFailed: not permitted in project observability；sync 是原子操作，一条被拒 →
#       同目录的 Service/SA/OTelCollector CR 全部不落地。
# 修复：白名单补 rbac.authorization.k8s.io 的 ClusterRole/ClusterRoleBinding（见下）。
# 排查口诀：App 显示 OutOfSync/Missing，先看 kubectl get app <名> -o yaml 的
#       status.operationState.syncResult —— 每条资源都写着被拒原因，别先去 namespace 找 Pod。
# 门禁模型：AppProject = destinations（目的地二元组）+ 资源类型白名单 双层门禁；
#       集群级资源只看 clusterResourceWhitelist，命名空间级看 namespaceResourceWhitelist。
# 注意：Service/OTelCollector CR 为命名空间级资源；collector/rbac.yaml 的 ClusterRole/
#       ClusterRoleBinding 为集群级资源；CRD 由 infra 域 opentelemetry-operator
#       Application 安装，不属本域。
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-999"
  finalizers:
    - resources-finalizer.argocd.argoproj.io                # 删除 AppProject 前先删净引用它的全部 Application，
                                                            # 保证 project 最后消失
spec:
  description: 可观测性数据面（OTel collector、istio telemetry 出口）
  sourceRepos:
    - 'https://github.com/ZAAN3660/argocd-gitops.git'
  destinations:                                              # (server, namespace) 二元组，不在清单里的组合一律拒绝 sync
    - namespace: monitoring                                  # OTelCollector CR（otel-collector daemonset 形态）
      server: https://kubernetes.default.svc
    - namespace: istio-system                                # istio Telemetry CR（tracing + accesslog）
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:                                  # 集群级资源白名单：CreateNamespace 的 Namespace +
    - group: ''
      kind: Namespace                                        #   collector/rbac.yaml 里 k8sattributes 的查询身份
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    # namespaceResourceWhitelist: []                         # 这一行必须整个不写（nil = 放行所有命名空间级资源）。显式写 [] 会被 Argo
                                                             # CD 解释为"拒绝一切命名空间级资源"，Telemetry/Collector 等全会被拦截
  sourceNamespaces: []                                       # 空 = 不限制 Application 来源命名空间
