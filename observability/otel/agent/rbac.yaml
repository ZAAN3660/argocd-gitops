# agent 的 RBAC 三件套 —— 镜像对象：CR otel-agent 的 spec.serviceAccount 引用的身份
# （otel-agent）。
# 因果链：agent 日志 pipeline 里 k8sattributes 拿 pod 名去问 K8s API 要 label/annotation，
# API 门禁（RBAC）只认 ServiceAccount，故 SA + ClusterRole + ClusterRoleBinding 缺一不可；
# 缺了它 processor 查询被拒（403），日志标签静默缺失甚至日志被丢。
# 权限按 k8sattributes 官方最小集：
#   pods/namespaces：查 Pod 元数据本身；nodes：k8s.node.name 元数据（get 即可，一并给上）；
#   replicasets：从 Pod owner 链解析 Deployment 名（k8s.deployment.name 查询维度依赖它）。
#
# 与旧 collector/rbac.yaml 的差异（2026-08-25 拆分）：nonResourceURLs /metrics 一段已移除——
# opentelemetry-operator 8443 secure metrics 的抓取随 prometheus receiver 移交给 gateway
# （其授权链在 observability/otel/gateway/rbac.yaml）。
#
# 集群级资源：所在 Application（otel-agent）的 AppProject 是 observability，依赖
# appproject.yaml 的 clusterResourceWhitelist 放行 rbac.authorization.k8s.io。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent-k8sattributes
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent-k8sattributes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent-k8sattributes
subjects:
  - kind: ServiceAccount
    name: otel-agent
    namespace: monitoring
