# otel-agent OpenTelemetryCollector CR —— 镜像对象：monitoring 命名空间、otel-agent-collector
# daemonset 形态的 per-node 采集层（agent）。
# 命名规则：CR 名 otel-agent → operator 自动拼出 DaemonSet/Pod（otel-agent-collector /
# otel-agent-collector-<node>）。
#
# 架构分工（2026-08-25 拆分，旧 CR otel "一体三职" daemonset 退役）：
#   - otel-agent（本目录）：只做一件事——每节点读本节点 /var/log/containers 的容器日志，
#     transform/resource/k8sattributes 富化后 OTLP 发给 gateway；
#   - otel-gateway（observability/otel/gateway）：metrics 抓取（TA 分片）+ OTLP 接收 + 集中导出。
# 乱序根因（旧架构）与修复：旧 daemonset 每 worker 一个实例且每个实例都跑 prometheus
# receiver 全量抓同一批 targets → 双写交错 → 宿主 Prometheus out of order 拒收。
# 本层不再包含 prometheus receiver，daemonset 多实例只产生"日志"这种无乱序问题的数据，
# 双写根因被架构性消除（抓取移交给 gateway 的 TA 分片）。
#
# 应用流程：observability/otel/appsets.yaml → Application otel-agent（wave 1，
# 依赖 gateway Service 就绪；OTLP exporter 自带重试队列，先起后起均无数据丢失）。
# RBAC（k8sattributes 查询身份）见同目录 rbac.yaml。

apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: monitoring
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.158.0   # 与 operator 版本一致，显式 pin 防漂移
  # k8sattributes 的查询身份：rbac.yaml 中创建并授权的 SA。
  # 不指定时 operator 用默认 SA（<CR名>-collector，无 K8s 读权限），标签贴不上
  serviceAccount: otel-agent
  # 日志采集挂载：只读挂宿主机 /var/log（filelog receiver 读 /var/log/containers/*.log）。
  # 仅对 daemonset 模式有意义（每节点 agent 读本节点日志）
  volumes:
    - name: varlog
      hostPath:
        path: /var/log
  volumeMounts:
    - name: varlog
      mountPath: /var/log
      readOnly: true
  config:
    receivers:
      # 容器 stdout/stderr 日志采集：只读挂宿主机 /var/log（见 spec.volumes），
      # 读 /var/log/containers/*.log（CRI 格式）。两个 regex_parser：
      #   1) 拆 CRI 行（时间/stream/正文）  2) 从文件路径拆 pod/namespace/container 元数据
      # 元数据链：本 receiver 只拿得到路径里的三样；Pod label 等 K8s 元数据由下游
      # resource + k8sattributes processor 补全（见 processors 段，权限见 rbac.yaml）
      filelog:
        include: [/var/log/containers/*.log]
        start_at: end                  # 只采新日志，agent 重启不重放历史
        include_file_name: true
        include_file_path: true
        operators:
          - type: regex_parser
            regex: '^(?P<log_time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[FP]) (?P<message>.*)$'
            timestamp:
              parse_from: attributes.log_time
              # containerd 时间戳小数秒不定宽（尾部 0 会被剪掉，实测常见 8 位），
              # gotime 的 .000000000 要求恰 9 位，不匹配整行被丢（failed to emit token）；
              # strptime 的 %f 兼容 1~9 位变宽小数秒
              layout_type: strptime
              layout: '%Y-%m-%dT%H:%M:%S.%fZ'
          - type: regex_parser
            regex: '^.*/(?P<pod_name>[^_]+)_(?P<namespace_name>[^_]+)_(?P<container_name>[^_]+)-[0-9a-f]+\.log$'
            parse_from: attributes["log.file.path"]

    processors:
      # 日志元数据链（顺序即因果链，不可调换）：
      #   1) transform：把 filelog 拆出的 LogRecord attributes（pod_name 等）set 进
      #      resource attributes 标准键（k8s.pod.name 等），并删除旧键。不用 filelog
      #      的 move 操作符：实测其 to: resource.attributes["x"] 在该版本被解析成字面
      #      键名 attributes.k8s.pod.name，导致 Loki 3.x 默认提升名单匹配不上
      #      （2026-08-25，collector 0.158.0）；resource processor 的 from_attribute
      #      又只读 resource 内部键，跨域搬不动——OTTL set 是标准跨域写法；
      #   2) resource：补 service.name 标识本 collector 来源；
      #   3) k8sattributes：按 resource 里的 k8s.pod.name 查 K8s API，把 Pod 基础
      #      metadata 贴回 resource（查询身份是 spec.serviceAccount，权限由
      #      rbac.yaml 授予）——标准键会被 Loki 3.x 默认提升名单
      #      自动提为流标签（k8s_pod_name / k8s_namespace_name / k8s_container_name）
      transform:
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["k8s.pod.name"], attributes["pod_name"]) where attributes["pod_name"] != nil
              - set(resource.attributes["k8s.namespace.name"], attributes["namespace_name"]) where attributes["namespace_name"] != nil
              - set(resource.attributes["k8s.container.name"], attributes["container_name"]) where attributes["container_name"] != nil
              - delete_key(attributes, "pod_name")
              - delete_key(attributes, "namespace_name")
              - delete_key(attributes, "container_name")
      resource:
        attributes:
          - key: service.name
            value: otel-agent
            action: upsert
      k8sattributes:
        auth_type: serviceAccount
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      batch: {}

    exporters:
      # 富化后的日志 OTLP/gRPC 发给集中层 gateway（Service 由 operator 为 CR otel-gateway 生成）。
      # exporterhelper 默认自带 sending_queue + retry：gateway 短暂不可用不丢数据
      otlp:
        endpoint: otel-gateway-collector.monitoring.svc.cluster.local:4317

    service:
      pipelines:
        # agent 只有一条 pipeline：日志。metrics/traces 不经 agent（SDK 与 istio 直发 gateway）
        logs:
          receivers: [filelog]
          processors: [transform, resource, k8sattributes, memory_limiter, batch]
          exporters: [otlp]
