apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: monitoring
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.158.0
  serviceAccount: otel-agent
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  volumes:
    - name: varlog
      hostPath:
        path: /var/log
  volumeMounts:
    - name: varlog
      mountPath: /var/log
      readOnly: true
  config:
    receivers:
      file_log:
        include: [/var/log/pods/*/*/*.log]
        exclude:
          - /var/log/pods/*_otel-agent-collector-*_*/*.log
          - /var/log/pods/*_otel-gateway-collector-*_*/*.log
        start_at: end   # 无 storage 持久化：重启从文件末尾续读，重启窗口内的日志不采集（已接受的取舍）
        include_file_name: false
        include_file_path: true
        operators:
          - type: router
            id: get-format
            routes:
              - output: parser-docker
                expr: 'body matches "^\\{"'
              - output: parser-crio
                expr: 'body matches "^[^ Z]+ "'
              - output: parser-containerd
                expr: 'body matches "^[^ Z]+Z"'
          - type: regex_parser
            id: parser-crio
            regex: '^(?P<time>[^ Z]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract_metadata_from_filepath
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'
          - type: regex_parser
            id: parser-containerd
            regex: '^(?P<time>[^ ^Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract_metadata_from_filepath
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z'
          - type: json_parser
            id: parser-docker
            output: extract_metadata_from_filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          - type: regex_parser
            id: extract_metadata_from_filepath
            regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]{36})\/(?P<container_name>[^\._]+)\/(?P<restart_count>\d+)\.log$'
            parse_from: attributes["log.file.path"]
            cache:
              size: 128
          - type: move
            id: clean-up-log-record
            from: attributes["log"]
            to: body
          - type: move
            id: extract-metadata
            from: attributes["stream"]
            to: attributes["log.iostream"]
          - type: move
            id: move-pod-name
            from: attributes["pod_name"]
            to: resource["k8s.pod.name"]
          - type: move
            id: move-namespace
            from: attributes["namespace"]
            to: resource["k8s.namespace.name"]
          - type: move
            id: move-container-name
            from: attributes["container_name"]
            to: resource["k8s.container.name"]
          - type: move
            id: move-containerd
            from: attributes["logtag"]
            to: resource["conmon-containerd"]
          - type: move
            id: move-pod-uid
            from: attributes["uid"]
            to: resource["k8s.pod.uid"]
          - type: move
            id: move-restart-count
            from: attributes["restart_count"]
            to: resource["k8s.container.restart_count"]

    processors:
      k8s_attributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.ip
            - k8s.pod.start_time
            - k8s.namespace.name
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
            - k8s.deployment.uid
            - k8s.statefulset.name
            - k8s.daemonset.name
          # 提取 Pod label 进资源属性：transform/svc 的 service.name 兜底链依赖 app。
          # 2026-08-27 修复：bookinfo 全部为 Argo Rollout，owner 链 Pod→RS→Rollout 无
          # Deployment，k8s.deployment/statefulset/daemonset.name 提取全落空，service.name
          # 掉到 pod-name 兜底（Loki 里 service_name 变成 Pod 名）。app label 与 Service 同名，
          # 作为工作负载身份的首选兜底。
          # 2026-08-27 二次修复：k8sattributes 提取 label 时不给 tag_name，属性名默认是
          # k8s.pod.labels.<key>（官方 README），transform/svc 引用 attributes["app"] 永远
          # 取不到值，兜底链落空。必须用 tag_name 显式命名，提取结果才叫 app。
          labels:
            - from: pod
              key: app
              tag_name: app
            # 标准化 label：当前集群组件未使用，预留给未来组件
            - from: pod
              key: app.kubernetes.io/name
              tag_name: app.kubernetes.io/name
          annotations: []
        filter:
          node_from_env_var: K8S_NODE_NAME
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
      transform/svc:
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["service.name"] == nil and attributes["k8s.statefulset.name"] != nil
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["service.name"] == nil and attributes["k8s.daemonset.name"] != nil
              # 2026-08-27 修复：Rollout 类工作负载（bookinfo 全部组件）无 Deployment 链，
              # 上面三条全不命中。用 Pod 的 app label 兜底（与 Service 同名），
              # 最后才是 pod name（原始行为保留）。
              # 注意：app 属性依赖 k8s_attributes.labels 的 tag_name: app 显式命名，
              # 否则提取结果叫 k8s.pod.labels.app，本条永远不命中。
              - set(attributes["service.name"], attributes["app"]) where attributes["service.name"] == nil and attributes["app"] != nil
              - set(attributes["service.name"], attributes["app.kubernetes.io/name"]) where attributes["service.name"] == nil and attributes["app.kubernetes.io/name"] != nil
              - set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["service.name"] == nil and attributes["k8s.pod.name"] != nil
      transform/cleanup:
        log_statements:
          - context: log
            statements:
              - delete_key(attributes, "time")
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        send_batch_size: 8192
        timeout: 1s

    exporters:
      otlp_grpc:
        endpoint: otel-gateway-collector.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      # telemetry 段不写：metrics 暴露由 operator 注入（enableMetrics 默认 true，新 readers 格式，端口 8888）。
      # 手写旧格式 address 在 collector 0.116+ 已废弃，0.158 解码直接报 invalid keys: address；与 gateway 对齐。
      pipelines:
        logs:
          receivers: [file_log]
          processors: [k8s_attributes, transform/svc, transform/cleanup, memory_limiter, batch]
          exporters: [otlp_grpc]
