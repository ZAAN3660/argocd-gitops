apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: monitoring
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.158.0
  serviceAccount: otel-agent
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  volumes:
    - name: varlog
      hostPath:
        path: /var/log
    - name: otel-agent-storage
      hostPath:
        path: /var/lib/otel-agent
        type: DirectoryOrCreate
  volumeMounts:
    - name: varlog
      mountPath: /var/log
      readOnly: true
    - name: otel-agent-storage
      mountPath: /var/lib/otel-agent
  config:
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude:
          - /var/log/pods/*_otel-agent-collector-*_*/*.log
          - /var/log/pods/*_otel-gateway-collector-*_*/*.log
        start_at: end
        include_file_name: false
        include_file_path: true
        storage: file_storage/filelogreceiver
        operators:
          - type: router
            id: get-format
            routes:
              - output: parser-docker
                expr: 'body matches "^\\{"'
              - output: parser-crio
                expr: 'body matches "^[^ Z]+ "'
              - output: parser-containerd
                expr: 'body matches "^[^ Z]+Z"'
          - type: regex_parser
            id: parser-crio
            regex: '^(?P<time>[^ Z]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract_metadata_from_filepath
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'
          - type: regex_parser
            id: parser-containerd
            regex: '^(?P<time>[^ ^Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract_metadata_from_filepath
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z'
          - type: json_parser
            id: parser-docker
            output: extract_metadata_from_filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          - type: regex_parser
            id: extract_metadata_from_filepath
            regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]{36})\/(?P<container_name>[^\._]+)\/(?P<restart_count>\d+)\.log$'
            parse_from: attributes["log.file.path"]
            cache:
              size: 128
          - type: move
            id: clean-up-log-record
            from: attributes["log"]
            to: body
          - type: move
            id: extract-metadata
            from: attributes["stream"]
            to: attributes["log.iostream"]
          - type: move
            id: move-pod-name
            from: attributes["pod_name"]
            to: resource["k8s.pod.name"]
          - type: move
            id: move-namespace
            from: attributes["namespace"]
            to: resource["k8s.namespace.name"]
          - type: move
            id: move-container-name
            from: attributes["container_name"]
            to: resource["k8s.container.name"]
          - type: move
            id: move-containerd
            from: attributes["logtag"]
            to: resource["conmon-containerd"]
          - type: move
            id: move-pod-uid
            from: attributes["uid"]
            to: resource["k8s.pod.uid"]
          - type: move
            id: move-restart-count
            from: attributes["restart_count"]
            to: resource["k8s.container.restart_count"]

    processors:
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.ip
            - k8s.pod.start_time
            - k8s.namespace.name
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
            - k8s.deployment.uid
            - k8s.statefulset.name
            - k8s.daemonset.name
          labels: []
          annotations: []
        filter:
          node_from_env_var: K8S_NODE_NAME
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
      transform/svc:
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["service.name"] == nil and attributes["k8s.statefulset.name"] != nil
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["service.name"] == nil and attributes["k8s.daemonset.name"] != nil
              - set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["service.name"] == nil and attributes["k8s.pod.name"] != nil
      transform/cleanup:
        log_statements:
          - context: log
            statements:
              - delete_key(attributes, "time")
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        send_batch_size: 8192
        timeout: 1s

    exporters:
      otlp:
        endpoint: otel-gateway-collector.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

    extensions:
      file_storage/filelogreceiver:
        directory: /var/lib/otel-agent/file_storage/receiver

    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      extensions: [file_storage/filelogreceiver]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, transform/svc, transform/cleanup, memory_limiter, batch]
          exporters: [otlp]
