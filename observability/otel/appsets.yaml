# observability/otel 组件 AppSet：单集群无环境发散，list generator 枚举（与 infra-components 同构）
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-999"
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - component: otel-gateway
            enabled: "true"
            path: observability/otel/gateway
            namespace: monitoring
            wave: 0
          - component: otel-agent
            enabled: "true"
            path: observability/otel/agent
            namespace: monitoring
            wave: 1                                      # 依赖 gateway Service；OTLP exporter 自带重试，顺序不硬依赖
          - component: otel-istio
            enabled: "true"
            path: observability/otel/istio
            namespace: istio-system
            wave: 1                                      # 依赖 gateway Service（istiod 不校验可达性，语义上先建）
  template:
    metadata:
      name: '{{.component}}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: observability
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
