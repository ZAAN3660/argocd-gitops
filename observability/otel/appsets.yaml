# observability/otel 组件 AppSet：单集群无环境发散，list generator 枚举（与 infra-components 同构）。
# 依赖链：collector(0) → telemetry(1)——meshConfig 引用的 collector Service 语义上先建。
# 无版本 label（宿主/配置类组件，无独立版本语义）；组件辨识靠 App 名本身。
# 本文件位于根应用 path（observability/otel）目录顶层，由 directory 模式直接同步。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-999"                     # 与 project 同波：先于它生成的组件 Application 建立
spec:
  goTemplate: true
  generators:
    - list:
        # v3.4.7 AppSet CRD 已移除 list generator 的 selector 过滤字段：写入会被 API server 静默丢弃，
        # 造成本对象永久 OutOfSync + 自愈反复重试。enabled 仅为说明性标记；停用组件 = 删除对应 element。
        elements:
          - component: otel-collector                      # 同步 observability/otel/collector：OTelCollector CR otel（镜像 infra 宿主 operator）
            enabled: "true"
            path: observability/otel/collector
            namespace: monitoring
            wave: 0                                          # 依赖链起点：先于 telemetry 同步
          - component: otel-istio                        # 同步 observability/otel/istio：istio-cm（meshConfig 权威）+ tracing + accesslog
            enabled: "true"
            path: observability/otel/istio
            namespace: istio-system
            wave: 1                                          # 依赖 collector 就绪（istiod 不校验可达性，语义上先建）
  template:
    metadata:
      name: '{{.component}}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: observability
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
