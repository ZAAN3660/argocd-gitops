apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-999"
  finalizers:
    - resources-finalizer.argocd.argoproj.io                # 删除 AppProject 前先删净引用它的全部 Application，
                                                            # 保证 project 最后消失
spec:
  description: 可观测性数据面（OTel collector、istio telemetry）
  sourceRepos:
    - 'https://github.com/ZAAN3660/argocd-gitops.git'
  destinations:                                              # (server, namespace) 二元组，不在清单里的组合一律拒绝 sync
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: istio-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:                                  # 集群级资源白名单
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    # namespaceResourceWhitelist: []                         # 这一行必须整个不写（nil = 放行所有命名空间级资源）。显式写 [] 会被 Argo
                                                             # CD 解释为"拒绝一切命名空间级资源"，Telemetry/Collector 等全会被拦截
  sourceNamespaces: []                                       # 空 = 不限制 Application 来源命名空间
