# otel-gateway OpenTelemetryCollector CR —— 镜像对象：monitoring 命名空间、otel-gateway-collector
# statefulset 形态的集中处理层（gateway）。
# 命名规则：CR 名 otel-gateway → operator 自动拼出 Service/Pod（otel-gateway-collector /
# otel-gateway-collector-0/-1，另有 -headless 与 -monitoring）。istio meshConfig 的
# extensionProviders.otel 指向 otel-gateway-collector.monitoring.svc.cluster.local:4317。
#
# 架构分工（2026-08-25 拆分，旧 CR otel "一体三职" daemonset 退役）：
#   - otel-agent（observability/otel/agent）：daemonset，per-node 日志采集（filelog+富化）→ OTLP 发本层；
#   - otel-gateway（本目录）：statefulset + target_allocator，职责二合一——
#     1) metrics 抓取（prometheus receiver，TA 按 target 哈希分片给 2 副本，无重复抓取）；
#     2) OTLP 集中接收（istio tracing/accesslog、业务 SDK）→ 集中导出宿主 Prometheus/Tempo/Loki。
#
# 乱序根因修复（2026-08-25 实验证实）：旧 daemonset 每 worker 一个实例、各全量抓同一批
# targets，毫秒级时间戳交错 → 宿主 Prometheus 以 out of order 拒收。TA 分片后每个 target
# 恰由一个副本抓取 → 单写者，无交错。replicas:2 的 HA 与"无重复抓取"在此模式下同时成立。
#
# 应用流程：observability/otel/appsets.yaml → Application otel-gateway（wave 0，
# 先于 otel-agent / otel-istio 建立）。RBAC 见同目录 rbac.yaml。

apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: monitoring
spec:
  mode: statefulset            # TA 分片需要稳定身份（target→副本的哈希映射随副本身份稳定）；
                               # 无需持久卷：未配置 volumeClaimTemplates，Pod 无 PVC
  replicas: 2                  # 集中层 HA：抓取/导出均可横向；TA 保证两副本不抓同一 target
  image: otel/opentelemetry-collector-contrib:0.158.0   # 与 operator 版本一致，显式 pin 防漂移
  # 身份：rbac.yaml 中授予 /metrics nonResourceURL get——opentelemetry-operator job 的
  # secure metrics（8443, TLS+TokenReview+SAR）授权链依赖此 SA（否则 403）
  serviceAccount: otel-gateway-collector
  # 关键开关：prometheus 抓取由 Target Allocator 托管。operator 自动创建 TA 的
  # Deployment/SA/RBAC（含 kubernetes_sd 所需 pods 权限），并把本 CR 的 scrape_configs
  # 交给 TA；TA 完成服务发现 + 分片，各 collector 副本只抓分给自己的 targets。
  # 因此 collector 自身不再需要任何 K8s API 权限（旧 otel-agent-pod-reader 补权已随安装层退役）。
  targetAllocator:
    enabled: true
  config:
    receivers:
      # ── 抓取集群内 exporter 的指标（job 定义原样迁移自旧 collector.yaml，语义与注释一致）──
      prometheus:
        config:
          scrape_configs:
            - job_name: node-exporter
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                # 只保留 app.kubernetes.io/name=prometheus-node-exporter 的 Pod
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: prometheus-node-exporter
                # 只抓端口名为 metrics 的容器端口
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics

            - job_name: kube-state-metrics
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: kube-state-metrics
                # 只抓 8080 (name: http) —— 集群资源指标；
                # 8081 (name: metrics) 是 ksm 自身进程指标，不要抓错
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: http

            - job_name: istio-proxy
              # istio sidecar 指标：istio-agent 把 envoy stats 转发到 15020
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                # 只保留注入过 sidecar 的 Pod（网格内 Pod 都有该 label）
                - source_labels: [__meta_kubernetes_pod_label_security_istio_io_tlsMode]
                  action: keep
                  regex: istio
                # 只抓 istio-proxy 容器声明的 15020 端口（name: http-envoy-prom），
                # 避免为每个容器端口各生成一份 target
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: http-envoy-prom
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                # Argo Rollouts 给 Pod 打的 hash label：分析模板（AnalysisTemplate）靠它区分
                # stable/canary 两批 Pod。原由 PodMonitor relabel 生成，PodMonitor 移除后
                # 由此处补齐，否则 canary-hash 查询无数据、灰度分析空跑误判
                - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
                  target_label: rollouts_pod_template_hash
              metrics_path: /stats/prometheus

            # --- infra 组件指标（一组件一 job：label name 白名单 + 容器端口号白名单）---
            # 为什么用端口号不用端口名：实测 ArgoCD 多数 metrics 端口未声明 name（无名端口
            # 无法被 __meta_kubernetes_pod_container_port_name 匹配），故统一按端口号过滤。
            # ArgoCD 未采：redis（镜像无 exporter）、notifications-controller（未声明 metrics 端口）。

            - job_name: argocd-application-controller
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: argocd-application-controller
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "8082"

            - job_name: argocd-server
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: argocd-server
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "8083"

            - job_name: argocd-repo-server
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: argocd-repo-server
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "8084"

            - job_name: argocd-applicationset-controller
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: argocd-applicationset-controller
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "8080"

            # argocd-dex-server job 已移除（2026-08-25）：dex 默认不启 telemetry——argocd-cm 的
            # dex.config 无 telemetry 段，5558 无监听（实测 connection refused）。
            # 恢复条件：dex.config 加 telemetry: http: 127.0.0.1:5558 后，按 5558 加回。
            - job_name: argo-rollouts
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: argo-rollouts
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "8090"

            # keda-operator job 已移除（2026-08-25）：keda 默认 --enable-prometheus-metrics=false，
            # 不暴露 HTTP metrics；9666 是 metricsservice（gRPC，给 metrics-apiserver 用），8081
            # 是 health 探测，均无 Prometheus 指标可采。留 job 只会常年 up=0 红灯。
            - job_name: cert-manager
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: cert-manager
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "9402"

            # 已装：端口实测 8443（--metrics-addr=0.0.0.0:8443 --metrics-secure=true，TLS+TokenReview
            # 认证）。https + 自签证书跳验 + 用本 SA token 过认证；credential 路径为 K8s 自动挂载。
            # 授权链：TokenReview 只验证 token 合法；是否放行由 SubjectAccessReview 判
            # /metrics 的 nonResourceURL get —— 权限在 rbac.yaml 绑给本 CR 的 SA。
            - job_name: opentelemetry-operator
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: opentelemetry-operator
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "8443"
              scheme: https
              tls_config:
                insecure_skip_verify: true
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

            # istiod 15014 默认可能要求 mTLS（取决于 meshConfig.enablePrometheusMerge）：
            # 装上后若该 job 恒 up=0，需开启 enablePrometheusMerge 并给采集侧配 TLS 证书，
            # 否则放弃此 job（网格流量指标已由 istio-proxy job 覆盖）
            - job_name: istiod
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app]
                  action: keep
                  regex: istiod
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "15014"

      # 应用 SDK 与 istio（tracing/accesslog）发 OTLP 数据（traces/metrics/logs）从这里进：
      # 4317=grpc, 4318=http。istio 的 meshConfig.extensionProviders.otel 指向本层 Service。
      otlp:
        protocols:
          grpc: {}
          http: {}

    processors:
      # 集中层只做资源限制与批处理；日志富化（transform/k8sattributes）在 agent 侧完成。
      # service.name 用 upsert：filelog 日志已带 otel-agent，不会被覆盖；
      # istio accesslog 无该属性，插入 otel-gateway 标识来源。
      resource:
        attributes:
          - key: service.name
            value: otel-gateway
            action: upsert
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      batch: {}

    exporters:
      prometheusremotewrite:
        endpoint: http://host.docker.internal:9090/api/v1/write   # 宿主机 Prometheus remote-write 端点
      # traces 发往宿主机 Tempo（OTLP/HTTP）
      otlphttp/tempo:
        endpoint: http://host.docker.internal:4318                # 宿主机 Tempo OTLP/HTTP 接收端口（3200 仅查询，不收 OTLP）
      # access log 发往宿主机 Loki（Loki 3.0+ 原生 OTLP，路径 /otlp/v1/logs）
      otlphttp/loki:
        endpoint: http://host.docker.internal:3100/otlp           # 宿主机 Loki 3.x OTLP 接收

    service:
      pipelines:
        metrics:
          receivers: [prometheus, otlp]    # prometheus 抓取（TA 分片）+ SDK OTLP 直发
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/tempo]
        logs:
          receivers: [otlp]               # otel-agent 的容器日志 + istio accesslog
          processors: [resource, memory_limiter, batch]
          exporters: [otlphttp/loki]
