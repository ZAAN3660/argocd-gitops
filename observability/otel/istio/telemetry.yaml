# ================================================================================================================
# 用途: 全 mesh 开启 tracing + accesslog，统一经 otel provider（OTLP/gRPC 4317）发往 gateway（otel-gateway-collector）
# 前置: 1) meshConfig.extensionProviders 已定义 name: otel（tracing，opentelemetry 类型）与 name: otel-als（accesslog，
#         envoyOtelAls 类型），均指向 otel-gateway-collector.monitoring.svc.cluster.local:4317
#       2) Istio >= 1.18（accessLogging 支持 envoyOtelAls provider）
# 生效范围: istio-system 命名空间 + 无 selector = 全 mesh 生效
# 注意: randomSamplingPercentage: 100 是【验证期】配置，生产应降到 1~10
# 注意: tracing/accesslog 均经 xDS 动态下发，无需重启业务 Pod
# ================================================================================================================
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: otel
  namespace: istio-system
spec:
  accessLogging:
    - providers:
        - name: otel-als
  tracing:
    - providers:
        - name: otel
      randomSamplingPercentage: 100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio
  namespace: istio-system
data:
  mesh: |
    defaultConfig:
      discoveryAddress: istiod.istio-system.svc:15012
      proxyStatsMatcher:
        inclusionPrefixes:
        - "istio"
        - "envoy"
        - "cluster.outbound"
        - "cluster.inbound"
        - "http_local_rate_limiter"
        - "cluster_manager"
        - "listener_manager"
        - "server"
        - "wasm"
    defaultProviders:
      metrics:
      - prometheus
    enablePrometheusMerge: true
    rootNamespace: istio-system
    trustDomain: cluster.local
    extensionProviders:
    - name: otel
      opentelemetry:
        port: 4317
        service: otel-gateway-collector.monitoring.svc.cluster.local
    - name: otel-als
      envoyOtelAls:
        logName: istio-envoy-als
        port: 4317
        service: otel-gateway-collector.monitoring.svc.cluster.local
  meshNetworks: |
    networks: {}