apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default            # 根应用只能用内置 default，因为自定义 project 尚未同步
  source:
    repoURL: https://github.com/ZAAN3660/argocd-gitops.git
    targetRevision: init
    path: observability/otel
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
