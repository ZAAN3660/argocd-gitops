# istiod 控制面监控抓取
# 为什么需要：此前 Prometheus 只抓 dev 命名空间的 sidecar，istiod 自己的指标（xDS 推送、代理收敛、注入成功率等）
# 没人抓 → 官方 Istio Control Plane Dashboard 装上也是 "No data"
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod
  namespace: istio-system
  labels:
    release: kube-prometheus-stack         # 必须带：stack 的 Prometheus 只认领带此标签的监控资源
spec:
  selector:
    matchLabels:
      istio: pilot                          # istiod Service 的标签（istioctl 安装时自带）
  endpoints:
    - port: http-monitoring                 # istiod Service 里 15014 端口的名字（自带，无需新开端口）
      interval: 15s                         # 控制面指标基数小、变化慢，15s 足够；3s 只留给高频实验指标
      path: /metrics
