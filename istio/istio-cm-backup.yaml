# =============================================================================
# 文件: istio/istio-cm-backup.yaml
# 用途: istio-system/istio ConfigMap 的【修改前原样备份】+ 一键回滚件
# 注意: 本文件是"回滚/文档"用途，不挂载进 Argo CD（istio-system 不在任何
#       AppSet 管理范围内），需要时手动 kubectl apply。
# =============================================================================
#
# ── 背景: 改了什么 ─────────────────────────────────────────────────────────
# 2026-08-21 为了给《故障监控 - Bookinfo Fault & Resilience》Grafana 大盘
# （grafana/bookinfo-fault-dashboard.yaml）提供连接池/熔断器/Pending 队列/
# 重试等面板数据，对 meshConfig 做了一处修改：在 defaultConfig 下追加了
# proxyStatsMatcher.inclusionPrefixes。
#
# 修改前（即本文件保存的内容）:
#   defaultConfig:
#     discoveryAddress: istiod.istio-system.svc:15012
#
# 修改后（当前集群运行中的内容）:
#   defaultConfig:
#     discoveryAddress: istiod.istio-system.svc:15012
#     proxyStatsMatcher:
#       inclusionPrefixes:
#       - "istio"
#       - "envoy"
#       - "cluster.outbound"
#       - "cluster.inbound"
#       - "http_local_rate_limiter"
#       - "cluster_manager"
#       - "listener_manager"
#       - "server"
#       - "wasm"
#
# ── 为什么必须改 ───────────────────────────────────────────────────────────
# Istio 默认的 stats matcher 出于指标基数控制，只暴露少量 Envoy 统计
# （xds-grpc、cluster_manager、server 等），各服务自己的
# "cluster.outbound|9080||<service>.*" 和 "cluster.inbound|9080||" 统计
# 在 sidecar 端就不会生成，因此 Prometheus 里查不到：
#   envoy_cluster_upstream_cx_active     （连接池活跃连接）
#   envoy_cluster_circuit_breakers_*     （熔断器状态）
#   envoy_cluster_upstream_rq_pending_*  （Pending 队列）
#   envoy_cluster_upstream_rq_retry      （重试）
#   envoy_cluster_outlier_detection_*    （异常驱逐）
#   envoy_http_local_rate_limiter_*      （本地限流 EnvoyFilter）
# 不加前缀，故障大盘的"连接池与排队""熔断与弹性"两行面板就永远没数据。
#
# ── 成本与风险（改之前要想清楚） ─────────────────────────────────────────
# 1. 指标基数上升：每服务×每集群多出数百个序列（dev 只有 Bookinfo 无所谓，
#    生产环境需评估 Prometheus 存储与查询压力）。
# 2. sidecar 内存略增（统计对象变多）。
# 3. 全 mesh 生效：本配置影响所有命名空间的所有 sidecar，不是只影响 Bookinfo。
#    生产环境更推荐按工作负载局部开启，用 Pod 注解：
#      sidecar.istio.io/statsInclusionPrefixes: cluster.outbound,cluster.inbound,http_local_rate_limiter
#    或正则版（Istio 1.30 支持）:
#      sidecar.istio.io/statsInclusionRegexps: 'cluster\.outbound.*ratings.*'
#    （注意：改注解同样需要重启 Pod 才生效，因为 stats matcher 是 bootstrap
#     静态配置，只有新建的 Pod 才会带上。）
#
# ── 回滚步骤 ──────────────────────────────────────────────────────────────
# 1) 应用本文件:
#      kubectl apply -f istio/istio-cm-backup.yaml
# 2) 重启受影响命名空间的业务 Pod，让 sidecar 以旧 bootstrap 重建:
#      kubectl delete pod -n dev -l app        # 以 dev 为例
# 3) 验证回滚成功（统计应消失）:
#      转发任一 sidecar: kubectl port-forward -n dev <pod> 15091:15090
#      curl -s localhost:15091/stats/prometheus | grep -c 'cluster_name="outbound'
#      → 回滚后该行数应回到个位数（只剩 xds-grpc 等少量统计）
#
# ⚠️ 关键警告：Istio 是 Helm 安装的（istiod release，1.30.3）
#  本 ConfigMap 由 Helm 管理（见下方 meta.helm.sh 注解）。将来一旦执行
#  helm upgrade istiod ...，Helm 会用 values 里的 meshConfig 重新渲染并
#  覆盖本 ConfigMap —— 无论你手动改了什么。
#  所以"放开 stats matcher"的持久化正解是写进 Helm values，而不是改
#  ConfigMap。values 片段如下：
#
#    meshConfig:
#      enablePrometheusMerge: true
#      defaultConfig:
#        proxyStatsMatcher:
#          inclusionPrefixes:
#            - "istio"
#            - "envoy"
#            - "cluster.outbound"
#            - "cluster.inbound"
#            - "http_local_rate_limiter"
#            - "cluster_manager"
#            - "listener_manager"
#            - "server"
#            - "wasm"
#
#  升级后同样需要重启业务 Pod 生效。
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio
  namespace: istio-system
  # 以下 label/annotation 取自修改前的原对象，保留它们可维持 Helm ownership
  # 一致，避免 kubectl apply 时被误判为孤儿资源。
  labels:
    app.kubernetes.io/instance: istiod
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: istiod
    app.kubernetes.io/part-of: istio
    app.kubernetes.io/version: 1.30.3
    helm.sh/chart: istiod-1.30.3
    install.operator.istio.io/owning-resource: unknown
    istio.io/rev: default
    operator.istio.io/component: Pilot
    release: istiod
  annotations:
    meta.helm.sh/release-name: istiod
    meta.helm.sh/release-namespace: istio-system
# data.mesh 是【修改前】的完整内容；下面不要加注释——块标量内的 # 会成为
# 配置内容的一部分，而非 YAML 注释。
data:
  mesh: |-
    defaultConfig:
      discoveryAddress: istiod.istio-system.svc:15012
    defaultProviders:
      metrics:
      - prometheus
    enablePrometheusMerge: true
    rootNamespace: istio-system
    trustDomain: cluster.local
  # meshNetworks 未做任何修改，原样保留（'networks: {}' 是 Helm 渲染的默认空值）
  meshNetworks: 'networks: {}'
