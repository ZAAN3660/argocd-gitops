# =============================================================================
# 文件: istio/telemetry-tracing.yaml
# 用途: 全 mesh 开启 tracing，envoy 生成的 span 上报到 otel-agent-collector
# 前置: meshConfig.extensionProviders 中已定义 name: otel（指向
#       otel-agent-collector.monitoring.svc.cluster.local:4317）
# 生效范围: istio-system 命名空间 + 无 selector = 全 mesh 生效
# 注意: randomSamplingPercentage: 100 是【验证期】配置，生产应降到 1~10
# =============================================================================
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-tracing
  namespace: istio-system
spec:
  tracing:
    - providers:
        - name: otel
      randomSamplingPercentage: 100
