# infra 应用域：平台基础组件都是集群级资源，整个集群只装一次，不按环境发散。
# 一个 AppSet 按组件枚举生成 10 个 Application，Application 名 = 官方 chart 名，
# 例外按 README 命名规则：泛化词加域前缀（istio-base / istio-gateway），官方名自含词根的不加（istiod）。
# 与各组件 helm release 的 app.kubernetes.io/instance 标签天然对齐，接管认领零摩擦。
# 每个 Application 带 component label（值取 group 字段，istio 三个 App 归一为 istio），
# 与 config 层 AppSet 的 label 同词根同值，UI 按 component=<词根> 过滤得跨层完整视图。
# 本文件位于根应用 path（infra/components）目录顶层，由 directory 模式直接同步。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-components
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-999"
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - component: cert-manager          # 接管前 v1.21.1，releaseName 对齐现有标签 instance=cert-manager
            enabled: "true"               # 不装改 false：AppSet 移除对应 Application（cascade 卸载），改回 true 自动恢复
            group: cert-manager
            path: infra/cert-manager
            namespace: cert-manager
            wave: 0
          - component: metrics-server        # 接管前集群里不存在（kube-system 只有 coredns），GitOps 新装
            enabled: "true"
            group: metrics-server
            path: infra/metrics-server
            namespace: kube-system
            wave: 0
          - component: keda                  # 接管前 2.20.2
            enabled: "true"
            group: keda
            path: infra/keda
            namespace: keda
            wave: 0
          - component: argo-rollouts         # 无官方 helm chart，静态落仓 install.yaml v1.9.1
            enabled: "true"
            group: argo-rollouts
            path: infra/argo-rollouts
            namespace: argo-rollouts
            wave: 0
          - component: istio-base            # CRD 必须先于 istiod 就绪
            enabled: "true"
            group: istio
            path: infra/istio/base
            namespace: istio-system
            wave: 0
          - component: istiod                # 接管前 istioctl 1.30.3 安装；meshConfig 权威在 observability/opentelemetry/istio/telemetry-istio.yaml，infra 只装不配
            enabled: "true"
            group: istio
            path: infra/istio/istiod
            namespace: istio-system
            wave: 1
          - component: istio-gateway         # gateway Pod 注入依赖 istiod 的 sidecar-injector
            enabled: "true"
            group: istio
            path: infra/istio/gateway
            namespace: istio-system
            wave: 2
          - component: opentelemetry-operator  # 依赖 cert-manager（wave -99）签发 webhook 证书
            enabled: "true"
            group: opentelemetry-operator
            path: infra/opentelemetry-operator
            namespace: opentelemetry-operator
            wave: 1
          - component: node-exporter        # 接管前集群里不存在（otel-agent 空抓），GitOps 新装；抓取契约见 infra/node-exporter 注释
            enabled: "true"
            group: monitoring               # 与 kube-state-metrics 归一为 monitoring，UI 按 component=monitoring 过滤
            path: infra/node-exporter
            namespace: monitoring
            wave: 0
          - component: kube-state-metrics   # 同上；otel-agent 按 label + 端口名 http(8080) 抓取，chart 默认值不得改
            enabled: "true"
            group: monitoring
            path: infra/kube-state-metrics
            namespace: monitoring
            wave: 0
        selector: "{{.enabled}} != 'false'"   # 不装改 false：移除对应 Application（cascade 卸载），改回 true 自动恢复
  template:
    metadata:
      name: '{{.component}}'
      namespace: argocd
      labels:
        component: '{{.group}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: infra
      # caBundle 由 cert-manager / istiod / keda 等运行时回填，统一豁免避免"sync 清掉→控制器重写→漂移"死循环。
      # 对无 webhook 的组件（metrics-server / argo-rollouts / istio-gateway）此豁免为空操作，换来模板零分支。
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
