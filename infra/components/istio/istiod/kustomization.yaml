# istiod 1.30.3：控制面。
# mesh 运行时配置权威在 config/istio/istio-cm.yaml（配置层）：infra 层只装不配，
# values 只含安装形态参数（profile / revisionTags），不写 meshConfig。
# 下方 patches 显式删除 chart 渲染的 istio-system/istio ConfigMap：让出单一归属，
# 该资源由 config AppSet 生成的 istio-config App 管理，防双主（tracking label 覆盖/prune 归属混乱）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: istiod
    repo: https://istio-release.storage.googleapis.com/charts
    version: 1.30.3
    releaseName: istio
    namespace: istio-system
    valuesFile: values.yaml
patches:
  - target:
      kind: ConfigMap
      name: istio
      namespace: istio-system
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: istio
        namespace: istio-system
