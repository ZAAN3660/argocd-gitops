# istio gateway 1.29.6 values
profile: stable              # 1.29/1.30 均用 stable（default→stable 改名发生在 1.29，不是 1.30；写 default 会报 unknown profile）
# chart 1.29.6 默认 containerSecurityContext 带 runAsNonRoot: true，但 proxyv2 镜像（gateway 模式）
# 无 USER 指令=以 root 运行，kubelet 校验拒绝 → CreateContainerConfigError。
# 显式配全套（默认块 + runAsUser:1337，对齐接管前 istioctl 原装），覆盖 chart 默认。
containerSecurityContext:
  capabilities:
    drop:
      - ALL
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1337
name: istio-ingressgateway   # 关键：chart 的 Deployment 名默认取 releaseName（=istio），
                             # 接管前名字是 istio-ingressgateway，必须显式写死才能对齐
service:
  type: LoadBalancer         # Service 交还 chart 渲染：nodePort 自动分配，
                             # kind 宿主机固定端口映射（30672/30474/30670）不再对齐；
                             # 外部访问改走 kubectl port-forward
# autoscaling.enabled 保持 chart 默认 true：接管前已有 HPA（min1/max5/80%），一致。
