# 归属声明：安装层资源，与宿主组件 opentelemetry-operator 同目录、同 App（infra-components）管理。
# 镜像对象：operator 默认为 otel-agent 生成的权限之外，本 ClusterRole + ClusterRoleBinding
# 归安装层的原因：agent CR 所在 config 层（observability/otel）App 的 project 为
# default，无集群级资源白名单，集群级补权只能跟宿主安装层走。
# 2026-08-25 改名：CR opentelemetry-collector → otel，显式 SA 同步 otel-collector，subject 跟随。
# 注意：pods get/list/watch 与 config 层 rbac.yaml（otel-collector-k8sattributes）重叠——历史冗余无害；
# 是否合并清理为独立决定，本次改名不动权限模型。
# 应用流程：由 infra/opentelemetry-operator/kustomization.yaml 与 operator chart 一同打包应用。
# prometheus receiver 用 kubernetes_sd_configs (role: pod) 做服务发现，
# 需要 list/watch Pods。operator 默认不为自定义镜像生成此权限（k8s
# 发行版不含 prometheus receiver，所以默认 RBAC 没有 pods 权限）。
# 最小权限：只给 pods 的 get/list/watch（cluster scope，因为 SD 未限制命名空间）。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent-pod-reader
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: monitoring
