apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra                                              # 平台基础组件域：metrics-server、KEDA、cert-manager、istio、opentelemetry-operator、argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"                     # 与 bookinfo project 同规则：应用时最先建，prune 时最后删
spec:
  description: 平台基础组件（服务网格、证书、弹性伸缩、可观测性采集、指标服务器）
  sourceRepos:
    - 'https://github.com/ZAAN3660/argocd-gitops.git'
  destinations:                                            # (server, namespace) 白名单：本域组件各自的命名空间
    - namespace: kube-system                                # metrics-server
      server: https://kubernetes.default.svc
    - namespace: keda                                       # KEDA
      server: https://kubernetes.default.svc
    - namespace: cert-manager                               # cert-manager
      server: https://kubernetes.default.svc
    - namespace: istio-system                               # istio base/istiod/gateway
      server: https://kubernetes.default.svc
    - namespace: argo-rollouts                              # argo-rollouts
      server: https://kubernetes.default.svc
    - namespace: opentelemetry-operator                     # opentelemetry-operator
      server: https://kubernetes.default.svc
    - namespace: monitoring                                 # node exporter/ kube-state-metrics
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:                                # X 方案下 CRD 由组件 Application 直接部署，集群级白名单必须覆盖完整：
    - group: ''                                             # 否则 sync 会被 AppProject 权限直接拒绝
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io                   # istio 1.30 引入的稳定校验策略（base/istiod chart 均会渲染）
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiregistration.k8s.io                         # KEDA metrics-apiserver / metrics-server 都要注册聚合 API
      kind: APIService
  sourceNamespaces: []                                     # 空 = 不限制 Application 来源命名空间
