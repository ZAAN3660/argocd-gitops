apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: cert-manager
    # chart 已 vendor 至 charts/cert-manager（v1.21.1）。不写 repo/version：
    # 仓库内已有本地 chart 时 kustomize 跳过 helm pull，规避 repo-server helm4
    # pull --untar 遇已存在目录报错的问题（ComparisonError）。
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml
