# infra 域根应用：infra/ 目录的唯一起点，手工 apply 一次。
# path 指向 infra/components/，该目录顶层只有两个文件：
#   appproject.yaml + appsets.yaml
# 组件子目录（cert-manager/ 等）被 directory 模式忽略（不递归）。
# 本文件位于 infra/，不在 path 之内 —— 根应用的管理清单永远不包含它自己，杜绝自我同步/自我 prune。
# 它部署的不是组件，是 infra 域自身的 Argo CD 配置（project 权限边界 + AppSet 发散规则）。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-infra
  namespace: argocd
  finalizers:                              # 删除本应用前先级联清理它创建的资源，防止仓库移除后集群残留孤儿对象
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default                          # 根应用只能用内置 default：自定义 project 尚未同步，不能先给自己套约束
  source:
    repoURL: https://github.com/ZAAN3660/argocd-gitops.git
    targetRevision: init                    # hub 跟随 init 分支；组件发布靠 overlay 改动，不靠分支
    path: infra/components
  destination:
    server: https://kubernetes.default.svc  # 目标 = hub 集群自身，根应用不跨集群
    namespace: argocd
  syncPolicy:
    automated:
      prune: true                           # 仓库里删除的清单同步时从集群删除，集群严格等于仓库
      selfHeal: true                        # 集群侧手动改动视为漂移，自动恢复成仓库定义的状态
    syncOptions:
      - CreateNamespace=true
