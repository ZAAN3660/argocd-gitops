# istio gateway 1.30.3：ingressgateway（kind 集群的网格入口）。
# Service 由 chart 渲染（values service.type: LoadBalancer），nodePort 自动分配；
# kind 宿主机固定端口映射（30672/30474/30670）随之失效，外部访问改走 kubectl port-forward。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: gateway
    # chart 已 vendor 至 charts/gateway（v1.30.3）。不写 repo/version：
    # 仓库内已有本地 chart 时 kustomize 跳过 helm pull，规避 repo-server helm4
    # pull --untar 遇已存在目录报错的问题（ComparisonError）。
    releaseName: istio
    namespace: istio-system
    valuesFile: values.yaml
