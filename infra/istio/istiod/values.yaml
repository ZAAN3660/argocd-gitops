# istiod 1.30.3 values
profile: stable        # 1.30 起 helm chart 的 profile 命名改为 stable（对等 istioctl 的 default），
                       # chart files/ 目录没有 profile-default.yaml，写 default 会报 unknown profile
revisionTags:
  - default            # 字符串列表（不是对象）：保留接管前的 istiod-revision-tag-default Service/webhook，防被 prune
meshConfig:
  defaultConfig:
    # 接管前 istio/istio-cm.yaml 的 proxyStatsMatcher 配置（8-23 恢复版），原样平移
    proxyStatsMatcher:
      inclusionPrefixes:
        - istio
        - envoy
        - cluster.outbound
        - cluster.inbound
        - http_local_rate_limiter
        - cluster_manager
        - listener_manager
        - server
        - wasm
  enablePrometheusMerge: true
  # 8-23 加入：tracing 出口指向 otel-agent-collector（供 istio/telemetry-tracing.yaml 的 provider 引用）
  extensionProviders:
    - name: otel
      opentelemetry:
        port: 4317
        service: otel-agent-collector.monitoring.svc.cluster.local
# trustDomain/rootNamespace/defaultProviders 由 chart 默认提供（cluster.local / istio-system / prometheus），
# 与接管前一致，不重复声明。
