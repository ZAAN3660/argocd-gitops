# istiod 1.30.3：控制面。
# 接管说明：meshConfig 权威从 istio/istio-cm.yaml（手工备份）转移到本目录 values.yaml。
# 接管后 istio ConfigMap 会按官方 chart 默认补全其余字段（defaultConfig 默认值等），属预期收敛。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: istiod
    repo: https://istio-release.storage.googleapis.com/charts
    version: 1.30.3
    releaseName: istio
    namespace: istio-system
    valuesFile: values.yaml
