# istio base 1.30.3：全部 CRD + 集群级资源（webhook、VAP、RBAC）。
# X 方案对 istio 的落法：沿用官方三步结构（base/istiod/gateway 三 chart 三应用），CRD 留在 base chart。
# values 只含两处安装形态声明：webhook failurePolicy 对齐运行时终态（见 values.yaml 注释）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: base
    repo: https://istio-release.storage.googleapis.com/charts
    version: 1.30.3                    # 对齐接管前版本（operator.istio.io/version: 1.30.3）
    releaseName: istio                 # 对齐接管前标签 app.kubernetes.io/instance=istio
    namespace: istio-system
    valuesFile: values.yaml
# istio-system 命名空间的 istio.io/rev=default 标签不在这里打：
# base chart 不渲染 Namespace 资源，针对 Namespace 的 patch 永远匹配不到目标（静默无效）。
# ns 由 Argo CD CreateNamespace 创建，rev 标签由 AppSet 的 syncPolicy.managedNamespaceMetadata
# 统一打上（config/argocd/appsets/infra-components.yaml）。
# 因果链：gateway chart 的 Pod 模板 image 为字面量 auto，依赖 istiod 的 mutating webhook
# 在 Pod 创建时替换成真实 proxyv2 镜像；webhook 的 namespaceSelector 要求
# istio.io/rev in [default]，缺标签则注入被跳过、kubelet 直接拉 docker.io/library/auto。
