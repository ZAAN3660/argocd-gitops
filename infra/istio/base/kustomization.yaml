# istio base 1.30.3：全部 CRD + 集群级资源（webhook、VAP、RBAC）。
# X 方案对 istio 的落法：沿用官方三步结构（base/istiod/gateway 三 chart 三应用），CRD 留在 base chart。
# values 只含两处安装形态声明：webhook failurePolicy 对齐运行时终态（见 values.yaml 注释）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: base
    # chart 已 vendor 至 charts/base（v1.30.3，对齐接管前 operator.istio.io/version）。
    # 不写 repo/version：本地 chart 存在时 kustomize 跳过 helm pull，规避 repo-server
    # helm4 pull --untar 遇已存在目录报错的问题（ComparisonError）。
    releaseName: istio                 # 对齐接管前标签 app.kubernetes.io/instance=istio
    namespace: istio-system
    valuesFile: values.yaml
# base chart 创建的 istio-system 命名空间必须带 istio.io/rev=default 标签：
# gateway chart 的 Pod 模板 image 为字面量 auto，依赖 istiod 的 mutating webhook
# 在 Pod 创建时替换成真实 proxyv2 镜像；webhook 的 namespaceSelector 要求
# istio.io/rev in [default]，缺标签则注入被跳过、kubelet 直接拉 docker.io/library/auto。
patches:
  - target:
      kind: Namespace
      name: istio-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: istio-system
        labels:
          istio.io/rev: default
