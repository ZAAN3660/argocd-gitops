# istio base 1.30.3：全部 CRD + 集群级资源（webhook、VAP、RBAC）。
# X 方案对 istio 的落法：沿用官方三步结构（base/istiod/gateway 三 chart 三应用），CRD 留在 base chart。
# 无 values 文件：base 只装 CRD 与集群级资源，chart 默认即可。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: base
    repo: https://istio-release.storage.googleapis.com/charts
    version: 1.30.3                    # 对齐接管前版本（operator.istio.io/version: 1.30.3）
    releaseName: istio                 # 对齐接管前标签 app.kubernetes.io/instance=istio
    namespace: istio-system
