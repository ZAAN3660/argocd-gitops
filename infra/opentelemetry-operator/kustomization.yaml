apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: opentelemetry-operator
    # chart 已 vendor 至 charts/opentelemetry-operator（v0.122.0）。不写 repo/version：
    # 仓库内已有本地 chart 时 kustomize 跳过 helm pull，规避 repo-server helm4
    # pull --untar 遇已存在目录报错的问题（ComparisonError）。
    releaseName: opentelemetry-operator
    namespace: opentelemetry-operator
    valuesFile: values.yaml
resources:
  # otel-agent 补权 RBAC（集群级）：agent CR 在 config/opentelemetry-operator，但其 App 的
  # project 为 default（无集群级白名单），集群级资源只能归安装层本 App 管理。
  - otel-agent-rbac.yaml
