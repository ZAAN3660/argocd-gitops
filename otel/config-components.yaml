# config 应用域：config/ 目录清单的镜像，一层一 AppSet（与 infra-components 同构）。
# 四个目录的归属：
#  - config/istio                  → 本 AppSet（生成 istio-config）
#  - config/opentelemetry-operator → 本 AppSet（生成 opentelemetry-operator-config；集群级补权 RBAC 归安装层 infra）
#  - config/grafana                → 待 kustomization 化（dashboard 源文件非 k8s 资源），暂缓
# 本 AppSet 归 infra 域：平台"怎么行为"的配置跟着平台走，由 bootstrap-infra 根应用同步，业务不碰。
# 命名：App 名 = <组件词根>-config（config 层特化规则，区别于 infra 的"官方 chart 名"）。
# label：component = 词根，与 infra 层同值（istio-config 与 istiod 等都是 component=istio），
#        UI 按 component=<词根> 过滤即得该组件跨层完整视图。
# project 统一 infra（AppProject 白名单已覆盖 istio-system / monitoring 两个目标命名空间），不做 per-element 发散。
# sync 策略：automated prune selfHeal——config 层无 caBundle 回填类豁免需求，直接自愈。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: config-components
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - component: istio-config   # 同步 config/istio：istio-cm（meshConfig 权威）+ telemetry-tracing
            group: istio              # label 值：与 infra 的 istio-base/istiod/istio-gateway 归一为 istio
            path: config/istio
            namespace: istio-system
          - component: opentelemetry-operator-config   # 同步 config/opentelemetry-operator：otel-agent CR（镜像 infra 宿主）
            group: opentelemetry-operator              # label 值：与 infra 层同值，UI 过滤得跨层视图
            path: config/opentelemetry-operator
            namespace: monitoring
  template:
    metadata:
      name: '{{.component}}'
      namespace: argocd
      labels:
        component: '{{.group}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: infra
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
