apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: monitoring
spec:
  env:
    - name: OTEL_RW_ENDPOINT
      value: http://host.docker.internal:9090/api/v1/write
    # kustomize 对 CRD 的 env 列表是整体替换语义，
    # 覆盖时 base 里的所有 env 条目必须在此完整列出
    - name: OTEL_TEMPO_ENDPOINT
      value: http://host.docker.internal:4318