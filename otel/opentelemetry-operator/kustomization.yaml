# 配置层目录：目录名镜像 infra/opentelemetry-operator（agent 的宿主组件）。
# 内容 = OpenTelemetry 的运行时行为配置：agent Collector CR，期望状态由本仓库定义；
# 补权 RBAC 归安装层（infra/opentelemetry-operator/otel-agent-rbac.yaml，因 config 层 App
# 的 project 为 default，无集群级资源白名单）；operator 本体装在 infra/opentelemetry-operator。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - otel-agent.yaml