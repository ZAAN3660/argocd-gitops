# otel-agent OpenTelemetryCollector —— 镜像对象：monitoring 命名空间的 CR（daemonset 形态采集器）。
# 与安装层的关系：本 CR 由 infra/opentelemetry-operator/ 安装的 operator controller 读取并落地为
# DaemonSet；镜像与 operator 默认一致（contrib，含 prometheus* 组件）。
# 应用流程：infra/appsets/config-components.yaml 指向本目录（Application：
# opentelemetry-operator-config），Argo CD 应用 CR 后 operator 才渲染出 agent Pod。本文件是运行时行为定义（抓谁、发给谁），故属配置层而非安装层。
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: monitoring
spec:
  mode: daemonset
  # 与 operator 默认镜像一致（contrib 含 prometheus* 组件），显式 pin 防 chart 升级时 tag 漂移
  image: otel/opentelemetry-collector-contrib:0.158.0
  config:
    receivers:
      # 抓取集群内 exporter 的指标
      prometheus:
        config:
          scrape_configs:
            - job_name: node-exporter
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                # 只保留 app.kubernetes.io/name=prometheus-node-exporter 的 Pod
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: prometheus-node-exporter
                # 只抓端口名为 metrics 的容器端口
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics

            - job_name: kube-state-metrics
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: kube-state-metrics
                # 只抓 8080 (name: http) —— 集群资源指标；
                # 8081 (name: metrics) 是 ksm 自身进程指标，不要抓错
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: http

            - job_name: istio-proxy
              # istio sidecar 指标：istio-agent 把 envoy stats 转发到 15020
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                # 只保留注入过 sidecar 的 Pod（网格内 Pod 都有该 label）
                - source_labels: [__meta_kubernetes_pod_label_security_istio_io_tlsMode]
                  action: keep
                  regex: istio
                # 只抓 istio-proxy 容器声明的 15020 端口（name: http-envoy-prom），
                # 避免为每个容器端口各生成一份 target
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: http-envoy-prom
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                # Argo Rollouts 给 Pod 打的 hash label：分析模板（AnalysisTemplate）靠它区分
                # stable/canary 两批 Pod。原由 PodMonitor relabel 生成，PodMonitor 移除后
                # 由此处补齐，否则 canary-hash 查询无数据、灰度分析空跑误判
                - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
                  target_label: rollouts_pod_template_hash
              metrics_path: /stats/prometheus

      # 预留：以后应用 SDK 发 OTLP 数据（traces/metrics/logs）从这里进
      otlp:
        protocols:
          grpc: {}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      batch: {}

    exporters:
      prometheusremotewrite:
        endpoint: ${env:OTEL_RW_ENDPOINT}
      # traces 落盘到宿主机 Tempo（OTLP/HTTP，端口 4318 已映射）
      otlphttp/tempo:
        endpoint: ${env:OTEL_TEMPO_ENDPOINT}
      debug:
        verbosity: basic

    service:
      pipelines:
        metrics:
          receivers: [prometheus, otlp]
          processors: [memory_limiter, batch]
          exporters: [debug, prometheusremotewrite]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug, otlphttp/tempo]
  env:
    - name: OTEL_RW_ENDPOINT
      value: "http://host.docker.internal:9090/api/v1/write"   # 宿主机 Prometheus remote-write 端点
    - name: OTEL_TEMPO_ENDPOINT
      value: "http://host.docker.internal:4318"                 # 宿主机 Tempo（OTLP/HTTP）