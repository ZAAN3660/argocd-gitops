# istio-ingressgateway Service —— 恢复备份
# 来源：从集群内 Helm release secret（sh.helm.release.v1.istio-ingressgateway.v1）解码还原，2026-08-18
# 该 Service 由 Helm chart gateway-1.30.3 管理，不在 GitOps 仓库中。
# ⚠️ 注意：此 Helm 版网关容器直连 80/443（非 istioctl 默认安装的 8080/8443），手写标准 YAML 会配错 targetPort。
# 恢复方法：kubectl apply -f docs/istio-ingressgateway-svc.yaml
apiVersion: v1
kind: Service
metadata:
  name: istio-ingressgateway
  namespace: istio-system
  labels:
    app.kubernetes.io/name: istio-ingressgateway
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/instance: "istio-ingressgateway"
    app.kubernetes.io/part-of: "istio"
    app.kubernetes.io/version: "1.30.3"
    helm.sh/chart: gateway-1.30.3
    app: istio-ingressgateway
    istio: ingressgateway
    "istio.io/dataplane-mode": "none"
  annotations: {}
spec:
  type: LoadBalancer
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
  selector:
    app: istio-ingressgateway
    istio: ingressgateway
