            "content": "本大盘用于观察持续负载（压测）下 Istio 主要组件的资源成本。\n\n- **每千次请求的 vCPU 成本**：主组件每处理 1000 rps 所消耗的 vCPU。空闲或低流量时该图为空。istio-proxy 曲线只统计业务服务的 sidecar（不含网关）。\n- **vCPU 总量**：各组件的 vCPU 使用（未归一化）。\n- **内存**：各组件内存占用。遥测与策略组件按每千次请求归一化，无流量时无数据；ingress 与 istio-proxy 为单实例数据。\n- **每秒传输字节**：流经每个 Istio 组件的字节数。\n\n提示：网关（ingressgateway）指标需要 istio-system 的抓取配置，尚未开启时网关行为空。",
            "mode": "markdown"
          },
          "pluginVersion": "10.1.5",
          "title": "压测说明",
          "transparent": true,
          "type": "text"
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 7
