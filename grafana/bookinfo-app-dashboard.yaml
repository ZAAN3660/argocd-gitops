        "orientation": "auto",
        "reduceOptions": {
          "calcs": [
            "lastNotNull"
          ],
          "fields": "",
          "values": false
        },
        "textMode": "auto"
      },
      "targets": [
        {
          "expr": "(sum(rate(istio_requests_total{reporter=\"$reporter\", destination_workload_namespace=\"$namespace\", destination_canonical_service=~\"$service\"}[$__rate_interval]))) or vector(0)",
          "legendFormat": "QPS",
          "refId": "A"
        }
      ],
      "title": "QPS（当前）",
      "type": "stat",
      "description": "- **是什么**：所选服务的当前请求速率（每秒）。\n- **怎么读**：口径随 $reporter 切换——source=调用方的体验，destination=服务的真实处理量。\n- **异常特征**：注入故障后骤降=故障生效；无操作地归零=流量源中断。"
    },
    {
      "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
      },
      "fieldConfig": {
        "defaults": {
          "color": {
            "mode": "thresholds"
          },
          "mappings": [],
          "max": 100,
          "min": 0,
          "thresholds": {
            "mode": "absolute",
            "steps": [
              {
                "color": "red",
                "value": null
              },
              {
                "color": "yellow",
                "value": 99
              },
              {
                "color": "green",
                "value": 99.9
              }
            ]
          },
          "unit": "percent"
        },
        "overrides": []
      },
      "gridPos": {
        "h": 4,
        "w": 6,
        "x": 6,
        "y": 1
      },
      "id": 2,
      "options": {
        "colorMode": "background",
        "graphMode": "none",
        "justifyMode": "auto",
        "orientation": "auto",
        "reduceOptions": {
          "calcs": [
            "lastNotNull"
          ],
          "fields": "",
          "values": false
        },
        "textMode": "auto"
      },
      "targets": [
        {
          "expr": "(100 * sum(rate(istio_requests_total{reporter=\"$reporter\", destination_workload_namespace=\"$namespace\", destination_canonical_service=~\"$service\", response_code=~\"2..\"}[$__rate_interval])) / clamp_min(sum(rate(istio_requests_total{reporter=\"$reporter\", destination_workload_namespace=\"$namespace\", destination_canonical_service=~\"$service\"}[$__rate_interval])), 0.001)) or vector(0)",
          "legendFormat": "2xx%",
          "refId": "A"
        }
      ],
      "title": "成功率（2xx）",
      "type": "stat",
      "description": "- **是什么**：2xx 响应占比（%）。\n- **怎么读**：与故障大盘的「5xx 双视角」互补；source 视角包含调用方侧失败（熔断/注入）。\n- **异常特征**：低于 100% 即有非 2xx 响应，下钻 id32（响应码）与 id33（原因标志）定位。"
    },
    {
      "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
      },
      "fieldConfig": {
        "defaults": {
          "color": {
            "mode": "palette-classic"
          },
          "mappings": [],
          "thresholds": {
            "mode": "absolute",
            "steps": [
              {
                "color": "blue",
                "value": null
              }
            ]
          },
          "unit": "ms"
        },
        "overrides": []
      },
      "gridPos": {
        "h": 4,
        "w": 6,
        "x": 12,
        "y": 1
      },
      "id": 3,
      "options": {
        "colorMode": "value",
        "graphMode": "area",
        "justifyMode": "auto",
        "orientation": "auto",
        "reduceOptions": {
          "calcs": [
            "lastNotNull"
          ],
          "fields": "",
          "values": false
        },
        "textMode": "auto"
      },
      "targets": [
        {
          "expr": "(histogram_quantile(0.99, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"$reporter\", destination_workload_namespace=\"$namespace\", destination_canonical_service=~\"$service\"}[$__rate_interval])))) or vector(0)",
          "legendFormat": "P99",
          "refId": "A"
        }
      ],
      "title": "P99 延迟",
      "type": "stat",
      "description": "- **是什么**：P99 延迟（毫秒），最慢 1% 请求的耗时。\n- **怎么读**：尾部延迟，比平均值对长尾问题敏感得多。\n- **异常特征**：与 QPS 无关地持续升高=依赖变慢或资源瓶颈。"
    },
    {
