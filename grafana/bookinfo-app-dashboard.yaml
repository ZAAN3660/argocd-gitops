        {
          "expr": "(sum by (destination_workload) (rate(istio_requests_total{reporter=\"$reporter\", destination_workload_namespace=\"$namespace\", destination_canonical_service=~\"$service\"}[$__rate_interval]))) or on() label_replace(vector(0), \"destination_workload\", \"无数据\", \"__name__\", \".*\")",
          "legendFormat": "{{destination_workload}} (workload)",
          "refId": "B"
        }
