      "title": "QPS by Service（source 视角最准；workload 为真相兜底）",
      "type": "timeseries",
      "description": "- **是什么**：所选服务的 QPS，两条口径——按服务名与按工作负载名。\n- **怎么读**：source 视角最准（能看见全部调用）；destination 为真相兜底（服务实际处理量）。\n- **异常特征**：两条线明显分叉=有请求死在半路（熔断/注入/超时）。"
    },
