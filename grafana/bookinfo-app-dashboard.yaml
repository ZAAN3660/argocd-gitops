      "title": "5xx 错误率",
      "type": "stat",
      "description": "- **是什么**：5xx 响应占比（%）。\n- **怎么读**：服务层错误的最直接信号。\n- **异常特征**：>0 即异常——先看 id32 定位 5xx 响应码，再看 id33 定位根因（超时/熔断/断连）。"
    },
