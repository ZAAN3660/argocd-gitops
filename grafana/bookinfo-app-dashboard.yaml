      "targets": [
        {
          "expr": "(sum by (destination_service) (rate(istio_requests_total{reporter=\"source\", destination_workload_namespace=\"$namespace\", destination_canonical_service=~\"$service\"}[$__rate_interval]))) or on() label_replace(vector(0), \"destination_service\", \"无数据\", \"__name__\", \".*\")",
          "legendFormat": "{{destination_service}} (source)",
          "refId": "A"
