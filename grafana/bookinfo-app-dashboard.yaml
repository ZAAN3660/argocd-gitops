      "title": "QPS by Pod（灰度期间看新旧 Pod 流量切分）",
      "type": "timeseries",
      "description": "- **是什么**：每个 Pod 收到的 QPS。\n- **怎么读**：灰度发布期间看新旧 Pod 的流量切分进度，核对是否符合预期权重。\n- **异常特征**：个别 Pod 流量恒为 0=端点异常或权重配置错误。\n- **视角说明**：固定被调方视角（不受 $reporter 下拉影响）——裸 pod 标签由发出指标的那一侧 sidecar 贴上：source 账上的 pod=调用方 Pod（你会在面板里看到 productpage 等上游），只有 destination 账上的 pod 才指向被选服务自己的 Pod。"
    },
