apiVersion: v1
kind: ConfigMap
data:
  istio-control-plane-dashboard.json: |
    {
       "graphTooltip": 1,
       "panels": [
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
             },
             "id": 1,
             "panels": [],
             "title": "部署版本",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：集群中 istiod 的构建版本。\n- **怎么读**：正常只有一个版本；升级期间新旧短暂并存，升级完成后消失。",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "hue",
                      "showPoints": "never"
                   }
                }
             },
             "gridPos": {
                "h": 5,
                "w": 24,
                "x": 0,
                "y": 1
             },
             "id": 2,
             "interval": "5s",
             "options": {
                "legend": {
                   "calcs": [],
                   "displayMode": "list"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (tag) (istio_build{component=\"pilot\"})",
                   "legendFormat": "Version ({{tag}})"
                }
             ],
             "title": "istiod 版本",
             "type": "timeseries"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 1
             },
             "id": 3,
             "panels": [],
             "title": "资源占用",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：istiod 进程内存（容器工作集 + Go 堆/栈）。\n- **怎么读**：工作集长期逼近 limit 有 OOM 风险；堆缓慢上涨常见于高频配置变更。\n- **异常特征**：曲线阶梯式上涨不回落。",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "hue",
                      "showPoints": "never"
                   },
                   "unit": "bytes"
                }
             },
             "gridPos": {
                "h": 10,
                "w": 6,
                "x": 0,
                "y": 2
             },
             "id": 4,
             "interval": "5s",
             "options": {
                "legend": {
                   "calcs": [
                      "last",
                      "max"
                   ],
                   "displayMode": "table"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (pod) (container_memory_working_set_bytes{container=\"discovery\",pod=~\"istiod-.*\"})",
                   "legendFormat": "Container ({{pod}})"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (pod) (go_memstats_stack_inuse_bytes{app=\"istiod\"})",
                   "legendFormat": "Stack ({{pod}})"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (pod) (go_memstats_heap_inuse_bytes{app=\"istiod\"})",
                   "legendFormat": "Heap (In Use) ({{pod}})"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (pod) (go_memstats_heap_alloc_bytes{app=\"istiod\"})",
                   "legendFormat": "Heap (Allocated) ({{pod}})"
                }
             ],
             "title": "内存占用",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：Go 运行时的内存分配速率。\n- **怎么读**：突增伴随推送耗时升高，通常是配置变更或连接风暴；长期上升不回落疑似泄漏。",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "hue",
                      "showPoints": "never"
                   },
                   "unit": "Bps"
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byFrameRefID",
                         "options": "B"
                      },
                      "properties": [
                         {
                            "id": "custom.axisPlacement",
                            "value": "right"
                         },
                         {
                            "id": "unit",
                            "value": "c/s"
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 10,
                "w": 6,
                "x": 6,
                "y": 2
             },
             "id": 5,
             "interval": "5s",
             "options": {
                "legend": {
                   "calcs": [
                      "last",
                      "max"
                   ],
                   "displayMode": "table"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (pod) (rate(go_memstats_alloc_bytes_total{app=\"istiod\"}[$__rate_interval]))",
                   "legendFormat": "Bytes ({{pod}})"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (pod) (rate(go_memstats_mallocs_total{app=\"istiod\"}[$__rate_interval]))",
                   "legendFormat": "Objects ({{pod}})"
                }
             ],
             "title": "内存分配速率",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：istiod 容器 CPU 消耗（核）。\n- **怎么读**：常态远低于 1 核；持续高且推送变慢时考虑增加 istiod 副本。\n- **异常特征**：与推送耗时同步恶化。",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "hue",
                      "showPoints": "never"
                   }
                }
             },
             "gridPos": {
                "h": 10,
                "w": 6,
                "x": 12,
                "y": 2
             },
             "id": 6,
             "interval": "5s",
             "options": {
                "legend": {
                   "calcs": [
                      "last",
                      "max"
                   ],
                   "displayMode": "table"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (pod) (irate(container_cpu_usage_seconds_total{container=\"discovery\",pod=~\"istiod-.*\"}[$__rate_interval]))",
                   "legendFormat": "Container ({{pod}})"
                }
             ],
             "title": "CPU 使用",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：istiod 的 Go 协程数量。\n- **怎么读**：随负载波动正常；只涨不落是协程泄漏的典型信号。",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "hue",
                      "showPoints": "never"
                   }
                }
             },
             "gridPos": {
                "h": 10,
                "w": 6,
                "x": 18,
                "y": 2
             },
             "id": 7,
             "interval": "5s",
             "options": {
                "legend": {
                   "calcs": [
                      "last",
                      "max"
                   ],
                   "displayMode": "table"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (pod) (go_goroutines{app=\"istiod\"})",
                   "legendFormat": "Goroutines ({{pod}})"
                }
             ],
             "title": "Goroutine 数量",
             "type": "timeseries"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 3
             },
             "id": 8,
             "panels": [],
             "title": "配置下发（xDS 推送）",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 100,
                      "gradientMode": "none",
                      "showPoints": "never",
                      "stacking": {
                         "mode": "normal"
                      }
                   },
                   "unit": "ops"
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "cds"
                      },
                      "properties": [
                         {
                            "id": "displayName",
                            "value": "Clusters"
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "eds"
                      },
                      "properties": [
                         {
                            "id": "displayName",
                            "value": "Endpoints"
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "lds"
                      },
                      "properties": [
                         {
                            "id": "displayName",
                            "value": "Listeners"
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "rds"
                      },
                      "properties": [
                         {
                            "id": "displayName",
                            "value": "Routes"
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "nds"
                      },
                      "properties": [
                         {
                            "id": "displayName",
                            "value": "DNS Tables"
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "istio.io/debug"
                      },
                      "properties": [
                         {
                            "id": "displayName",
                            "value": "Debug"
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "istio.io/debug/syncz"
                      },
                      "properties": [
                         {
                            "id": "displayName",
                            "value": "Debug"
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "wads"
                      },
                      "properties": [
                         {
                            "id": "displayName",
                            "value": "Authorization"
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "wds"
                      },
                      "properties": [
                         {
                            "id": "displayName",
                            "value": "Workloads"
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "type.googleapis.com/istio.security.Authorization"
                      },
                      "properties": [
                         {
                            "id": "displayName",
                            "value": "Authorizations"
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "type.googleapis.com/istio.workload.Address"
                      },
                      "properties": [
                         {
                            "id": "displayName",
                            "value": "Addresses"
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 10,
                "w": 8,
                "x": 0,
                "y": 4
             },
             "id": 9,
             "interval": "15s",
             "options": {
                "legend": {
                   "calcs": [],
                   "displayMode": "list"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (type) (irate(pilot_xds_pushes[$__rate_interval]))",
                   "legendFormat": "{{type}}"
                }
             ],
             "title": "xDS 推送速率（按类型）",
             "type": "timeseries",
             "description": "- **是什么**：CDS/EDS/LDS/RDS/SDS 各类 xDS 的推送速率。\n- **怎么读**：改路由/规则触发 CDS/LDS/RDS，Pod 扩缩触发 EDS，证书轮换触发 SDS；改完配置看这里确认推送发生。"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：istiod 观察到的 K8s 事件、配置事件与推送触发源。\n- **怎么读**：平静期接近 0；风暴说明集群或配置在大幅变化。",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "hue",
                      "showPoints": "never"
                   }
                }
             },
             "gridPos": {
                "h": 10,
                "w": 8,
                "x": 8,
                "y": 4
             },
             "id": 10,
             "interval": "5s",
             "options": {
                "legend": {
                   "calcs": [
                      "last",
                      "max"
                   ],
                   "displayMode": "table"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (type,event) (rate(pilot_k8s_reg_events[$__rate_interval]))",
                   "legendFormat": "{{event}} {{type}}"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (type,event) (rate(pilot_k8s_cfg_events[$__rate_interval]))",
                   "legendFormat": "{{event}} {{type}}"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (type) (rate(pilot_push_triggers[$__rate_interval]))",
                   "legendFormat": "Push {{type}}"
                }
             ],
             "title": "事件与推送触发源",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：与 istiod 保持 gRPC 长连接的代理（sidecar/网关）数量。\n- **怎么读**：应≈网格内代理总数（当前 11）；骤降=代理大面积断开，常与证书或网络问题有关。",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "hue",
                      "showPoints": "never"
                   }
                }
             },
             "gridPos": {
                "h": 10,
                "w": 8,
                "x": 16,
                "y": 4
             },
             "id": 11,
             "interval": "5s",
             "options": {
                "legend": {
                   "calcs": [
                      "last",
                      "max"
                   ],
                   "displayMode": "table"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum(envoy_cluster_upstream_cx_active{cluster_name=\"xds-grpc\"})",
                   "legendFormat": "Connections (client reported)"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum (pilot_xds)",
                   "legendFormat": "Connections (server reported)"
                }
             ],
             "title": "在线代理连接数",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：xDS 被代理拒绝的次数与 istiod 内部错误。\n- **怎么读**：正常为 0；rejects>0 常见于 EnvoyFilter 写错或配置冲突，需结合 istiod 日志定位是哪个代理拒绝。",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "hue",
                      "showPoints": "never"
                   }
                }
             },
             "gridPos": {
                "h": 10,
                "w": 8,
                "x": 0,
                "y": 14
             },
             "id": 12,
             "interval": "5s",
             "options": {
                "legend": {
                   "calcs": [
                      "last",
                      "max"
                   ],
                   "displayMode": "table"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum by (type) (pilot_total_xds_rejects)",
                   "legendFormat": "Rejected Config ({{type}})"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "pilot_total_xds_internal_errors",
                   "legendFormat": "Internal Errors"
                }
             ],
             "title": "推送错误",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：一次 xDS 推送从开始到完成的耗时分布（热力图，单位秒）。\n- **怎么读**：反映配置多快送达代理；P99 进入秒级就偏慢，会拖慢故障恢复（如扩缩容后的流量切换）。\n- **异常特征**：整体色带向上漂移。",
             "gridPos": {
                "h": 10,
                "w": 8,
                "x": 8,
                "y": 14
             },
             "id": 13,
             "interval": "1m",
             "options": {
                "calculation": {
                   "xBuckets": {
                      "mode": "size",
                      "value": "1min"
                   }
                },
                "cellGap": 0,
                "color": {
                   "mode": "scheme",
                   "scheme": "Spectral",
                   "steps": 128
                },
                "yAxis": {
                   "decimals": 0,
                   "unit": "s"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum(rate(pilot_xds_push_time_bucket{}[$__rate_interval])) by (le)",
                   "format": "heatmap",
                   "legendFormat": "{{le}}"
                }
             ],
             "title": "推送耗时分布",
             "type": "heatmap"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：单次推送的配置体量分布（热力图）。\n- **怎么读**：剧增说明个别代理被下发海量配置，典型场景是某服务 Endpoint 爆炸。",
             "gridPos": {
                "h": 10,
                "w": 8,
                "x": 16,
                "y": 14
             },
             "id": 14,
             "interval": "1m",
             "options": {
                "calculation": {
                   "xBuckets": {
                      "mode": "size",
                      "value": "1min"
                   }
                },
                "cellGap": 0,
                "color": {
                   "mode": "scheme",
                   "scheme": "Spectral",
                   "steps": 128
                },
                "yAxis": {
                   "decimals": 0,
                   "unit": "bytes"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum(rate(pilot_xds_config_size_bytes_bucket{}[$__rate_interval])) by (le)",
                   "format": "heatmap",
                   "legendFormat": "{{le}}"
                }
             ],
             "title": "推送配置大小",
             "type": "heatmap"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 100
             },
             "id": 15,
             "panels": [],
             "title": "校验与注入",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：istiod 对下发配置的校验通过/失败速率。\n- **怎么读**：failed>0 说明有配置被拒收（如无效 EnvoyFilter）；改完配置看这里确认是否被接受。",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "hue",
                      "showPoints": "never"
                   }
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 101
             },
             "id": 16,
             "interval": "5s",
             "options": {
                "legend": {
                   "calcs": [],
                   "displayMode": "list"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum (rate(galley_validation_passed[$__rate_interval]))",
                   "legendFormat": "Success"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$datasource"
                   },
                   "expr": "sum (rate(galley_validation_failed[$__rate_interval]))",
                   "legendFormat": "Failure"
                }
             ],
             "title": "配置校验",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "- **是什么**：sidecar 注入成功/失败速率。\n- **怎么读**：failure>0 时新 Pod 起不来；常见原因：命名空间未打注入标签、Pod 注解与注入策略冲突。",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "hue",
                      "showPoints": "never"
                   }
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 101
             },
             "id": 17,
             "interval": "5s",
             "options": {
                "legend": {
                   "calcs": [],
                   "displayMode": "list"
                }
             },
