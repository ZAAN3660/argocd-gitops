# native prometheus rule file, converted from grafana/rule/k8s.rules.container-memory-cache.yaml (PrometheusRule CR)
groups:
- name: k8s.rules.container_memory_cache
  rules:
  - expr: "container_memory_cache{job=\"kubelet\", metrics_path=\"/metrics/cadvisor\", image!=\"\"}\n* on (cluster, namespace,\
      \ pod) group_left(node) topk by (cluster, namespace, pod) (1,\n  max by (cluster, namespace, pod, node) (kube_pod_info{node!=\"\
      \"})\n)"
    record: node_namespace_pod_container:container_memory_cache
