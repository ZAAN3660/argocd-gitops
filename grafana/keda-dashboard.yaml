      },
      "targets": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "expr": "max(keda_internal_scale_loop_latency_seconds) or vector(0)",
          "refId": "A"
        }
      ],
      "description": "- **是什么**：一次完整扩缩循环的耗时上限。\n- **怎么读**：正常亚秒级；含 Prometheus 查询时间。\n- **异常特征**：进入秒级=查询变慢或 scaler 卡顿，扩缩响应会滞后。"
    },
