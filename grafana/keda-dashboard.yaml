      },
      "targets": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "expr": "sum(keda_scaler_active) or vector(0)",
          "refId": "A"
        }
      ],
      "description": "- **是什么**：当前处于活跃状态的 scaler 数量（0/1 计）。\n- **怎么读**：0=全部触发条件未满足（如无流量）；压测时应随流量变化。\n- **异常特征**：有流量却恒 0=扩缩链路断裂。"
    },
    {
      "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
      },
      "fieldConfig": {
        "defaults": {
          "color": {
            "mode": "thresholds"
          },
          "unit": "none",
          "thresholds": {
            "mode": "absolute",
            "steps": [
              {
                "color": "green"
              },
              {
                "color": "red",
                "value": 80
              }
