      ],
      "description": "- **是什么**：KEDA 正在管理的 ScaledObject 数量。\n- **怎么读**：你们当前 dev/prod/staging 各 3 个，共 9。\n- **异常特征**：突然变少=ScaledObject 被删除或 operator 丢失缓存。"
