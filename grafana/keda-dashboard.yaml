      "id": 3,
      "title": "Scaler错误(近1h)",
      "type": "stat",
      "options": {
        "colorMode": "value",
        "graphMode": "area",
        "reduceOptions": {
          "calcs": [
            "lastNotNull"
          ],
          "fields": "",
          "values": false
        }
      },
      "targets": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "expr": "sum(increase(keda_scaler_detail_errors_total[1h])) or vector(0)",
          "refId": "A"
        }
      ],
      "description": "- **是什么**：最近 1 小时 scaler（触发器查询）失败次数。\n- **怎么读**：正常为 0。\n- **异常特征**：>0=operator 连不上 Prometheus 或触发器配置错误，此时扩缩决策会失真。"
    },
    {
      "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
      },
      "fieldConfig": {
        "defaults": {
          "color": {
            "mode": "thresholds"
          },
          "unit": "s",
          "thresholds": {
            "mode": "absolute",
            "steps": [
              {
                "color": "green"
              },
              {
                "color": "red",
                "value": 80
              }
            ]
          }
        },
        "overrides": []
      },
      "gridPos": {
        "h": 4,
        "w": 6,
        "x": 18,
        "y": 1
