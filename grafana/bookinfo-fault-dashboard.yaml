      "description": "- **是什么**：最慢 1% 请求的延迟，两侧账本各一条线。\n- **怎么读**：调用方线明显高于被调方 = 延迟发生在调用方侧（delay 注入或重试开销），差值≈注入的延迟量；两条线接近 = 服务本身真的慢。\n- **异常特征**：做 delay 注入实验时，你会看到调用方 P99 突然抬升而被调方 P99 基本不动。",
