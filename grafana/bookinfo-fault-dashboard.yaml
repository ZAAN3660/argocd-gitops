      "description": "- **是什么**：调用方自己记录的 5xx 比例。\n- **怎么读**：>0 = 调用方发出的请求有失败。\n- **异常特征**：熔断、故障注入 abort、超时发生时升高。\n- **为什么**：这些错误发生在调用方 sidecar，只记在调用方账上——若本面板高而右侧「被调方视角」低，说明大量请求在半路死亡。",
      "fieldConfig": {
        "defaults": {
          "color": {
            "mode": "thresholds"
          },
          "mappings": [],
          "thresholds": {
            "mode": "absolute",
            "steps": [
              {
                "color": "green",
                "value": null
              },
              {
                "color": "yellow",
                "value": 1
              },
              {
                "color": "red",
                "value": 5
              }
            ]
          },
          "unit": "percent"
        },
        "overrides": []
      },
      "gridPos": {
        "h": 4,
        "w": 6,
        "x": 0,
        "y": 2
