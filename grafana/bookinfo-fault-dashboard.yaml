          "id": 90,
          "options": {
            "content": "**这个大盘是干什么的**：故障注入 / 熔断 / 限流实验期间，观察「故障信号出现在哪里」以及「防御机制是否按预期工作」。它和《监控大盘 - Bookinfo》互补：那个看正常流量，这个看异常与弹性。\n\n### 核心概念：两本账（先理解再看图）\n\n一次 A→B 的调用会产生**两份互相独立的记录**，各自由对应的 sidecar 记账：\n\n| 账本 | 谁记 | 记了什么 |\n|---|---|---|\n| 调用方账 `reporter=\"source\"` | A 的 sidecar | A 发出的**全部**请求，包括半路失败、被熔断拒绝、被注入故障的 |\n| 被调方账 `reporter=\"destination\"` | B 的 sidecar | 只有**真正到达 B** 的请求 |\n\n> 故障注入不是让监控失灵，而是让信号「搬家」：abort / 熔断 / 超时都发生在调用方侧，只进调用方账。**两个视角的数据对不齐，本身就是故障证据。**\n\n### response_flags 速查表（本大盘最常用的故障原因码）\n\n| 标志 | 含义 | 常见触发场景 |\n|---|---|---|\n| `FI` | 故障注入 abort 命中 | 你正在做的注入实验生效了 |\n| `DI` | 延迟注入命中 | delay 实验生效 |\n| `RL` | 被本地限流拦截 | 压测超过 EnvoyFilter 阈值，返回 429 |\n| `UO` | 熔断/队列溢出拒绝 | 连接池满、熔断器打开 |\n| `UH` | 无健康上游 | 服务全挂、被驱逐、KEDA 缩容未就绪 |\n| `UT` | 上游超时 | VirtualService 的 timeout 触发 |\n| `URX` | 重试耗尽 | 重试次数用光仍失败 |\n| `NC`/`UC` | 建连失败 / 上游断开 | 网络或上游崩溃 |\n| `DC` | 下游连接中断 | 客户端提前断开 |\n\n### 指标的三个来源\n\n1. **`istio_requests_total`** —— 请求账本，来自两侧 sidecar（Istio 标准指标，永远有）；\n2. **`envoy_cluster_*`** —— Envoy 运行态：连接池、熔断器、Pending 队列、重试、驱逐。**已通过 meshConfig 的 proxyStatsMatcher 放开**（详见 `istio/istio-cm-backup.yaml`）；\n3. **`container_*`** —— CPU/内存，来自 kubelet，与 Istio 无关，任何情况下都有数据。\n\n### 做注入实验时的推荐观察顺序\n\n📊故障总览 → 🚨故障信号（确认注入命中）→ ⛓连接池与排队（看堆积）→ 🛡熔断与弹性（看防御触发）→ 🖥资源（看对应用的冲击）→ 🩺Pod 健康 → 📐延迟异常（看注入延迟效应）。\n\n### 新人常见困惑\n\n- **面板没数据 ≠ 监控坏了**：abort 注入时被调方本来就该无感；熔断未触发时各种计数为 0 是健康的。\n- **5xx 双视角对比**：两条线分开 = 请求死在半路；两条线重合 = 被调方自己真的在报错。\n- **没有「空闲连接」直接指标**：用「活跃连接 − 活跃请求」近似，HTTP/2 多路复用下不准确。\n- 每个面板右上角 ⓘ 图标里还有该面板的「是什么 / 怎么读 / 异常长什么样」三要素说明。",
            "mode": "markdown"
          },
          "type": "text"
        }
      ]
    },
