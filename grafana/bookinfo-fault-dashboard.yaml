      "description": "- **是什么**：各容器累计重启次数（来自 kube-state-metrics）。\n- **怎么读**：曲线爬升 = 崩溃循环，是全大盘最高优先级的故障信号。\n- **异常特征**：重启的是应用容器 = 应用故障；重启的是 istio-proxy = 网格故障。\n- **为什么**：这是唯一能反映「崩溃类故障」的指标，其他面板只能看到请求层结果。",
