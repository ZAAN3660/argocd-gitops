        },
        {
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true,
          "tags": [
            "fe06a478395b51cc61c8d7d7e83e2f22"
          ],
          "title": "Workload Dashboard",
          "type": "dashboards"
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "全网流量",
          "type": "row"
        },
        {
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "description": "- **是什么**：全网格 HTTP/gRPC+TCP 的总流量速率。\n- **正常**：随实验活动起伏——网格级全景视图，实验时先看整体是否受影响。\n- **异常**：骤变=某大规模变更或故障（下钻 Service/Workload 盘定位）。",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
              },
              "custom": {
                "fillOpacity": 10,
                "gradientMode": "hue",
                "showPoints": "never"
              },
              "unit": "reqps"
            }
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "interval": "5s",
          "options": {
            "legend": {
              "calcs": [
                "last",
                "max"
              ],
              "displayMode": "table"
            }
          },
          "pluginVersion": "v11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "round(sum (rate(istio_requests_total{reporter=~\"source|waypoint\"}[$__rate_interval])), 0.01)"
            }
          ],
          "title": "全网流量速率",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "description": "- **是什么**：全网格非 5xx 请求占比。\n- **正常**：接近 100%。\n- **异常**：下降=有服务在失败，下钻定位。",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
              },
              "custom": {
                "fillOpacity": 10,
                "gradientMode": "hue",
                "showPoints": "never"
              },
              "unit": "percentunit"
            }
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 3,
          "interval": "5s",
          "options": {
            "legend": {
              "calcs": [
                "last",
                "max"
              ],
              "displayMode": "table"
            }
          },
          "pluginVersion": "v11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum (rate(istio_requests_total{reporter=~\"source|waypoint\",response_code!~\"5..\"}[$__rate_interval])) / sum (rate(istio_requests_total{reporter=~\"source|waypoint\"}[$__rate_interval]))"
            }
          ],
          "title": "全网成功率",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "description": "- **是什么**：全网格 4xx 速率（客户端错误）。\n- **正常**：接近 0。\n- **异常**：上升=有调用方在发错误请求（错误 URL、无权限）。",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
              },
              "custom": {
                "fillOpacity": 10,
                "gradientMode": "hue",
                "showPoints": "never"
              },
              "unit": "reqps"
            }
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 4,
          "interval": "5s",
          "options": {
            "legend": {
              "calcs": [
                "last",
                "max"
              ],
              "displayMode": "table"
            }
          },
          "pluginVersion": "v11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "round(sum (rate(istio_requests_total{reporter=~\"source|waypoint\",response_code=~\"4..\"}[$__rate_interval])), 0.01)or vector(0)"
            }
          ],
          "title": "4xx 速率",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "description": "- **是什么**：全网格 5xx 速率（服务端错误）。\n- **正常**：接近 0。\n- **异常**：上升=有服务在失败，配合故障大盘定位。",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
              },
              "custom": {
                "fillOpacity": 10,
                "gradientMode": "hue",
                "showPoints": "never"
              },
              "unit": "reqps"
            }
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 5,
          "interval": "5s",
          "options": {
            "legend": {
              "calcs": [
                "last",
                "max"
              ],
              "displayMode": "table"
            }
          },
          "pluginVersion": "v11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "round(sum (rate(istio_requests_total{reporter=~\"source|waypoint\",response_code=~\"5..\"}[$__rate_interval])), 0.01)or vector(0)"
            }
          ],
          "title": "5xx 速率",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "description": "- **是什么**：每个工作负载的流量、成功率、延迟一览表。\n- **正常**：各项指标均衡。\n- **异常**：按成功率或延迟排序，快速找出最差的工作负载。",
          "fieldConfig": {
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #requests"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Requests"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "unit",
                    "value": "reqps"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #p50"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "P50 Latency"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "unit",
                    "value": "ms"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #p90"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "P90 Latency"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "unit",
                    "value": "ms"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #p99"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "P99 Latency"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "unit",
                    "value": "ms"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #success"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Success Rate"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": "0.95"
                        },
                        {
                          "color": "green",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "destination_workload_var"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Workload"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "destination_service"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Service"
                  },
                  {
                    "id": "custom.minWidth",
                    "value": 400
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "destination_workload_namespace"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "destination_workload"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Time"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 16,
            "w": 24,
            "y": 10
          },
          "id": 6,
          "interval": "5s",
          "pluginVersion": "v11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "label_join(sum by (destination_workload,destination_workload_namespace,destination_service) (rate(istio_requests_total{reporter=~\"source|waypoint\"}[$__rate_interval])), \"destination_workload_var\", \".\", \"destination_workload\", \"destination_workload_namespace\")",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ destination_workload}}.{{ destination_workload_namespace }}",
              "refId": "requests"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "label_join(histogram_quantile(0.5, sum by (le,destination_workload,destination_workload_namespace) (rate(istio_request_duration_milliseconds_bucket{reporter=~\"source|waypoint\"}[$__rate_interval]))), \"destination_workload_var\", \".\", \"destination_workload\", \"destination_workload_namespace\")",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ destination_workload}}.{{ destination_workload_namespace }}",
              "refId": "p50"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "label_join(histogram_quantile(0.9, sum by (le,destination_workload,destination_workload_namespace) (rate(istio_request_duration_milliseconds_bucket{reporter=~\"source|waypoint\"}[$__rate_interval]))), \"destination_workload_var\", \".\", \"destination_workload\", \"destination_workload_namespace\")",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ destination_workload}}.{{ destination_workload_namespace }}",
              "refId": "p90"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "label_join(histogram_quantile(0.99, sum by (le,destination_workload,destination_workload_namespace) (rate(istio_request_duration_milliseconds_bucket{reporter=~\"source|waypoint\"}[$__rate_interval]))), \"destination_workload_var\", \".\", \"destination_workload\", \"destination_workload_namespace\")",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ destination_workload}}.{{ destination_workload_namespace }}",
              "refId": "p99"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "label_join(sum by (destination_workload,destination_workload_namespace) (rate(istio_requests_total{reporter=~\"source|waypoint\",response_code!~\"5..\"}[$__rate_interval]))/sum by (destination_workload,destination_workload_namespace) (rate(istio_requests_total{reporter=~\"source|waypoint\"}[$__rate_interval])), \"destination_workload_var\", \".\", \"destination_workload\", \"destination_workload_namespace\")",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ destination_workload}}.{{ destination_workload_namespace }}",
              "refId": "success"
            }
          ],
          "title": "HTTP/gRPC 工作负载明细表",
          "transformations": [
            {
              "id": "merge"
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "description": "- **是什么**：TCP 工作负载的收发字节一览表。\n- **正常**：TCP 型服务（数据库等）的全景；HTTP 服务不出现。\n- **异常**：某工作负载收发失衡=异常行为。",
          "fieldConfig": {
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #recv"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Bytes Received"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "unit",
                    "value": "bps"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value #sent"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Bytes Sent"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "unit",
                    "value": "bps"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "destination_workload_var"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Workload"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "destination_service"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Service"
                  },
                  {
                    "id": "custom.minWidth",
                    "value": 400
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "destination_workload_namespace"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "destination_workload"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Time"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 16,
            "w": 24,
            "y": 26
          },
          "id": 7,
          "interval": "5s",
          "pluginVersion": "v11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "label_join(sum by (destination_workload,destination_workload_namespace,destination_service) (rate(istio_tcp_received_bytes_total{reporter=~\"source|waypoint\"}[$__rate_interval])), \"destination_workload_var\", \".\", \"destination_workload\", \"destination_workload_namespace\")",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ destination_workload}}.{{ destination_workload_namespace }}",
              "refId": "recv"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "label_join(sum by (destination_workload,destination_workload_namespace,destination_service) (rate(istio_tcp_sent_bytes_total{reporter=~\"source|waypoint\"}[$__rate_interval])), \"destination_workload_var\", \".\", \"destination_workload\", \"destination_workload_namespace\")",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ destination_workload}}.{{ destination_workload_namespace }}",
              "refId": "sent"
            }
          ],
          "title": "TCP 工作负载明细表",
          "transformations": [
            {
              "id": "merge"
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 42
          },
          "id": 8,
          "panels": [],
          "title": "Istio 组件版本",
          "type": "row"
        },
        {
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "description": "- **是什么**：网格内各 Istio 组件（istiod/proxy）的版本分布。\n- **正常**：单一版本；升级期间新旧并存属正常。\n- **异常**：长期多版本混杂=升级流程未完成。",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "gradientMode": "hue",
                "showPoints": "never"
              }
            }
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 43
          },
          "id": 9,
          "interval": "5s",
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list"
            }
          },
          "pluginVersion": "v11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum by (component,tag) (istio_build)",
              "legendFormat": "{{component}} ({{tag}})"
            }
          ],
          "title": "各组件版本分布",
          "type": "timeseries"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "query": "prometheus",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "utc",
      "title": "Istio / 网格",
      "uid": "1a9a8ea49444aae205c7737573e894f9",
      "version": 1
    }
metadata:
