          "id": 90,
          "options": {
            "content": "**这个大盘是干什么的**：故障注入 / 熔断 / 限流实验期间，观察「故障信号出现在哪里」以及「防御机制是否按预期工作」。它和《应用 / 流量总览》互补：那个看正常流量，这个看异常与弹性。\n\n### 核心概念：一次调用，两份上报\n\n一次 A→B 的调用会产生**两份互相独立的记录**（Istio 标准指标，用 reporter 维度区分）：\n\n| 上报视角 | 谁记 | 记了什么 |\n|---|---|---|\n| 调用方（客户端）上报 reporter=\"source\" | A 的 sidecar | A 发出的**全部**请求，包括半路失败、被熔断拒绝、被注入故障的 |\n| 服务方（服务端）上报 reporter=\"destination\" | B 的 sidecar | 只有**真正到达 B** 的请求 |\n\n> 故障注入不是让监控失灵，而是让信号「搬家」：abort / 熔断 / 超时都发生在调用方侧，只进调用方上报。**两个视角的数据对不齐，本身就是故障证据。**\n\n### response_flags 速查表（故障原因码：全称 + 含义）\n\n| 标志 | 英文全称 | 含义 | 常见触发场景 |\n|---|---|---|---|\n| FI | Fault Injected | 故障注入 abort 命中 | 注入实验生效 |\n| DI | Delay Injected | 延迟注入命中 | delay 实验生效 |\n| RL | Rate Limited | 被本地限流拦截 | 压测超过 EnvoyFilter 阈值，返回 429 |\n| UO | Upstream Overflow | 熔断/连接池溢出拒绝 | 连接池满、熔断器打开 |\n| UH | No Healthy Upstream | 无健康上游 | 服务全挂、被驱逐、缩容未就绪 |\n| UI | Upstream Connection Failure | 上游建连失败 | 上游崩溃或网络故障 |\n| UT | Upstream Timeout | 上游超时 | VirtualService 的 timeout 触发 |\n| URX | Upstream Retry Limit Exceeded | 重试耗尽 | 重试次数用光仍失败 |\n| UR | Upstream Remote Reset | 上游重置连接 | 上游异常断开 |\n| UC | Upstream Connection Termination | 上游连接中断 | 网络或上游崩溃 |\n| NR | No Route | 找不到路由 | 目标服务不存在/未注册 |\n| DC | Downstream Connection Termination | 下游连接中断 | 客户端提前断开 |\n| SI | Stream Idle Timeout | 流空闲超时 | 长时间无活动被断开 |\n| DF | Deadline Exceeded | 超过截止时间 | 请求超时上限 |\n\n### 指标的三个来源\n\n1. **istio_requests_total** —— 请求指标，来自两侧 sidecar（Istio 标准指标，永远有）；\n2. **envoy_cluster_*** —— Envoy 运行态：连接池、熔断器、Pending 队列、重试、驱逐。**已通过 meshConfig 的 proxyStatsMatcher 放开**（详见 istio/istio-cm-backup.yaml）；\n3. **container_*** —— CPU/内存，来自 kubelet，与 Istio 无关，任何情况下都有数据。\n\n### 做注入实验时的推荐观察顺序\n\n📊故障总览 → 🚨故障信号（确认注入命中）→ 🎯定位元凶（按服务5xx）→ 📐延迟异常（定位在哪一侧）→ ⛓连接池与排队（看堆积）→ 🛡熔断与弹性（看防御触发）→ 🖥资源（看对应用的冲击）→ 🩺Pod 健康 → 🚪网关 → 🔄扩缩容（KEDA）→ 🧠控制面（istiod）。\n\n### 新人常见困惑\n\n- **面板没数据 ≠ 监控坏了**：abort 注入时服务方本来就该无感；熔断未触发时各种计数为 0 是健康的。\n- **5xx 双视角对比**：两条线分开 = 请求死在半路；两条线重合 = 服务方自己真的在报错。\n- **没有「空闲连接」直接指标**：用「活跃连接 − 活跃请求」近似，HTTP/2 多路复用下不准确。\n- 每个面板右上角 ⓘ 图标里还有该面板的「是什么 / 正常 / 异常」三要素说明。",
            "mode": "markdown"
          },
          "type": "text"
        }
      ],
      "title": "📖 使用说明",
      "type": "row"
    },
