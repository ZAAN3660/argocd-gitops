    {
      "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
      },
      "description": "- **是什么**：入口请求按响应码堆叠（含网关自生成响应，如无路由 404、上游不可用 503）。\n- **正常**：2xx 主体；\"无响应(0)\"=未收到响应的请求（客户端断连/超时），少量属正常。\n- **异常**：503+UH=上游无健康端点；429=触发限流；5xx 占比突升时先看后端面板是哪个服务，再看响应标志区分注入（FI）与真实故障。",
      "fieldConfig": {
        "defaults": {
          "color": {
            "mode": "palette-classic"
          },
          "custom": {
            "drawStyle": "bars",
            "fillOpacity": 100,
            "lineInterpolation": "linear",
            "lineWidth": 1,
            "showPoints": "never",
            "stacking": {
              "group": "A",
              "mode": "normal"
            }
          },
          "unit": "reqps"
        },
        "overrides": []
      },
      "gridPos": {
        "h": 8,
        "w": 12,
        "x": 0,
        "y": 6
      },
