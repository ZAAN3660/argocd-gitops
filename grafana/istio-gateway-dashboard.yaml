          "mode": "multi",
          "sort": "desc"
        }
      },
      "targets": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "expr": "label_replace(sum by (response_code) (rate(istio_requests_total{reporter=\"source\", source_workload=\"istio-ingressgateway\", source_workload_namespace=\"istio-system\"}[$__rate_interval])) or on() label_replace(vector(0), \"response_code\", \"无流量\", \"__name__\", \".*\"), \"response_code\", \"无响应(0)\", \"response_code\", \"^0$\")",
          "legendFormat": "{{response_code}}",
          "refId": "A"
        }
      ],
      "title": "入口请求按响应码",
      "type": "timeseries"
