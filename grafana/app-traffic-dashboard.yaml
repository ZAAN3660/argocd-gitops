      "description": "- **是什么**：所选服务的当前请求速率（每秒）。\n- **正常**：跟随压测/流量负载起伏；口径随 $reporter 切换——source=调用方的体验，destination=服务的真实处理量。\n- **异常**：注入故障后骤降=故障生效；无操作地归零=流量源中断。",
      "fieldConfig": {
        "defaults": {
          "color": {
            "mode": "thresholds"
          },
          "mappings": [],
          "thresholds": {
            "mode": "absolute",
            "steps": [
              {
                "color": "blue",
                "value": null
              }
            ]
          },
          "unit": "reqps"
        },
        "overrides": []
      },
      "gridPos": {
        "h": 4,
        "w": 6,
        "x": 0,
        "y": 1
      },
      "id": 1,
      "options": {
        "colorMode": "value",
        "graphMode": "area",
        "justifyMode": "auto",
        "orientation": "auto",
        "reduceOptions": {
          "calcs": [
            "lastNotNull"
          ],
          "fields": "",
          "values": false
        },
        "textMode": "auto"
      },
      "targets": [
        {
          "expr": "(sum(rate(istio_requests_total{reporter=\"$reporter\", destination_workload_namespace=\"$namespace\", destination_service_name=~\"$service\"}[$__rate_interval]))) or vector(0)",
          "legendFormat": "QPS",
          "refId": "A"
        }
      ],
      "title": "QPS（当前）",
      "type": "stat"
    },
    {
      "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
      },
      "description": "- **是什么**：2xx 响应占比（%）。\n- **正常**：稳定接近 100%（3xx 不算成功也不算失败）。\n- **异常**：低于 100% 即有非 2xx 响应——下钻 id32（响应码）与 id33（原因标志）定位；source 视角额外包含调用方侧失败（熔断/注入）。",
      "fieldConfig": {
        "defaults": {
          "color": {
            "mode": "thresholds"
          },
          "mappings": [],
          "max": 100,
          "min": 0,
          "thresholds": {
            "mode": "absolute",
            "steps": [
              {
                "color": "red",
                "value": null
              },
              {
                "color": "yellow",
                "value": 99
              },
              {
                "color": "green",
                "value": 99.9
              }
            ]
          },
          "unit": "percent"
        },
        "overrides": []
      },
      "gridPos": {
        "h": 4,
        "w": 6,
        "x": 6,
        "y": 1
      },
      "id": 2,
      "options": {
        "colorMode": "background",
        "graphMode": "none",
        "justifyMode": "auto",
        "orientation": "auto",
        "reduceOptions": {
          "calcs": [
            "lastNotNull"
          ],
          "fields": "",
          "values": false
        },
        "textMode": "auto"
      },
      "targets": [
        {
          "expr": "(100 * sum(rate(istio_requests_total{reporter=\"$reporter\", destination_workload_namespace=\"$namespace\", destination_service_name=~\"$service\", response_code=~\"2..\"}[$__rate_interval])) / clamp_min(sum(rate(istio_requests_total{reporter=\"$reporter\", destination_workload_namespace=\"$namespace\", destination_service_name=~\"$service\"}[$__rate_interval])), 0.001)) or vector(0)",
          "legendFormat": "2xx%",
          "refId": "A"
        }
      ],
      "title": "成功率（2xx）",
      "type": "stat"
    },
