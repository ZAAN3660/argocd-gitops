      "title": "mTLS 覆盖率（加密 vs 明文）",
      "type": "timeseries",
      "description": "- **是什么**：请求的连接安全策略（mTLS 状态）分布。\n- **怎么读**：mutual_tls=sidecar 间双向 TLS 加密生效；none=明文；unknown=安全信息未记录。\n- **异常特征**：对某服务做完 mTLS 策略实验后仍只有 none/unknown=策略未覆盖到该链路。\n- **背景**：Istio 默认自动 mTLS——即使没有 PeerAuthentication，sidecar 间也是 mutual_tls；明文只出现在对端无 sidecar 的链路上。\n- **视角说明**：固定被调方视角——安全策略标签只在 destination 账上被可靠填充（实测：source 账全是 unknown）。"
