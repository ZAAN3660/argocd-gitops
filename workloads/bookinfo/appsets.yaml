---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: productpage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-999"
spec:
  goTemplate: true
  generators:
    - list:
        elements:                                   # 环境列表
          - environment: dev
            enabled: "true"
            server: https://kubernetes.default.svc
            namespace: dev
          - environment: staging
            enabled: "true"
            server: https://kubernetes.default.svc
            namespace: staging
          - environment: prod
            enabled: "true"
            server: https://kubernetes.default.svc
            namespace: prod
  template:                                         # 每个环境套这份模板，就产出 1 个 Application
    metadata:
      name: 'bookinfo-productpage-{{.environment}}' # Argo CD 中应用的名字，不会传播到应用的 Pod
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '0'           # 依赖链末端：依赖 reviews/details，最后同步
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bookinfo                             # 挂到 Argo CD project 下，部署目标受 project 的 destinations 白名单约束
      source:                                       # 当前应用的部署清单仓库
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: workloads/bookinfo/productpage/overlays/{{.environment}}
      destination:                                  # 当前应用部署到哪里
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
