# bookinfo 组件 AppSet：一个文件装 4 个 AppSet 对象（--- 分隔），一个组件一个，各自按 3 个环境发散出 3 个 Application。
# 注：v3.4.7 AppSet CRD 已移除 list generator 的 selector 过滤字段（写入会被 API server 静默丢弃，
#     造成永久 OutOfSync + 自愈反复重试）。各 generator 的 enabled 仅为说明性标记；停用组件 = 删除对应 element。
# 文件内顺序即依赖链顺序。sync-wave 按依赖链分层（全部 > project 的 -1，保证 project 先建、组件应用后建）：
#   ratings/details = 0（依赖链起点）→ reviews = 1 → productpage = 2（末端，最后同步）
# prune 按 wave 逆序：productpage 先删、ratings/details 后删、project(-1) 最后删。
# 本文件位于根应用 path（workloads/bookinfo）目录顶层，由 directory 模式直接同步。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ratings
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-999"
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - environment: dev
            enabled: "true"
            server: https://kubernetes.default.svc
            namespace: dev
          - environment: staging
            enabled: "true"
            server: https://kubernetes.default.svc
            namespace: staging
          - environment: prod
            enabled: "true"
            server: https://kubernetes.default.svc
            namespace: prod
  template:
    metadata:
      name: 'bookinfo-ratings-{{.environment}}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '0'           # 依赖链起点：无下游依赖，先同步
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bookinfo
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: workloads/bookinfo/ratings/overlays/{{.environment}}
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
