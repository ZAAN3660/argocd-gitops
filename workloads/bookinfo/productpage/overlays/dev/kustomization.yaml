apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - virtual-service.yaml                    # 合并后的 VS：同时管外部入口与网格内调用，Rollout 接管其权重
  - gateway.yaml                            # 南北流量的统一入口
images:
  - name: docker.io/zaan3660/bookinfo-productpage
    newTag: 1.29.6
patches:
  # --- 灰度分析模板：宿主机 Prometheus 查询地址 ---
  - target:
      kind: AnalysisTemplate
      name: productpage-success-rate
    patch: |-
      - op: replace
        path: /spec/metrics/0/provider/prometheus/address
        value: http://host.docker.internal:9090
  - target:
      kind: AnalysisTemplate
      name: productpage-p99-latency
    patch: |-
      - op: replace
        path: /spec/metrics/0/provider/prometheus/address
        value: http://host.docker.internal:9090
  - target:
      kind: AnalysisTemplate
      name: productpage-traffic-check
    patch: |-
      - op: replace
        path: /spec/metrics/0/provider/prometheus/address
        value: http://host.docker.internal:9090
  # --- KEDA ScaledObject：扩缩容查询 + Prometheus 地址 ---
  - target:
      kind: ScaledObject
      name: productpage
    patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/query
        value: |
          sum(rate(istio_requests_total{destination_service=~"productpage.*", destination_service_namespace="dev", response_code=~"2..|3.."}[2m]))
      - op: replace
        path: /spec/triggers/0/metadata/serverAddress
        value: http://host.docker.internal:9090
  # --- DestinationRule：网格内服务名 ---
  - target:
      kind: DestinationRule
      name: productpage
    patch: |-
      - op: replace
        path: /spec/host
        value: productpage.dev.svc.cluster.local
