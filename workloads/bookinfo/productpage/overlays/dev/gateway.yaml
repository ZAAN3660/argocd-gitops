apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: productpage
spec:
  selector:
    istio: ingressgateway                 # 选中 istio ingress gateway 这个实际转发代理
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - 'dev.bookinfo.com'              # 入口域名：dev 环境专属，只受理本应用的入口流量，不写 * 避免抢其他入口
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - 'dev.bookinfo.com'              # 443 TLS 监听：productpage v1.16+ 会强制跳 HTTPS，必须有
      tls:
        mode: SIMPLE                       # 单向 TLS：客户端验证服务端证书
        credentialName: bookinfo-gateway-certs  # 引用 ingressgateway Pod 所在命名空间(istio-system)里的 TLS Secret。
                                               # 注意：该证书是旧域名 bookinfo.example.com 签的，与新域名不匹配，
                                               # 学习环境用 HTTP/自签可接受；生产需按新域名重签。
