apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: reviews-v2
  labels:
    app: reviews
    version: v2
spec:
  replicas: 1
  revisionHistoryLimit: 2           # 保留 2 个历史 ReplicaSet，够一次回滚
  strategy:
    canary:
      maxUnavailable: 0             # 最小 canary：无 steps 无 trafficRouting，语义见 v1 头部注释
  selector:
    matchLabels:
      app: reviews
      version: v2
  template:
    metadata:
      labels:
        app: reviews
        version: v2
        sidecar.istio.io/inject: "true"    # 必须注入 sidecar：内部调用要过 VS 才参与 subset 路由
        istio.io/rev: default
      annotations:
        sidecar.istio.io/inject: "true"
        istio.io/rev: default
    spec:
      containers:
        - name: reviews
          image: docker.io/istio/examples-bookinfo-reviews-v2:1.20.3
          ports:
            - containerPort: 9080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            # 2026-08-22 移除 limits：压测期 CPU 节流/组件重启排查中，放开封顶观测真实峰值（requests 保留，KEDA 触发器分母）
