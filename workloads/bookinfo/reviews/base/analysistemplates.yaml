# ⚠ 本文件的宿主机 Prometheus 地址是默认值，真实值由各环境 overlay 的 kustomization patches 覆盖注入（path: /spec/metrics/0/provider/prometheus/address）。
# v5（routing 应用拆分：分析模板每应用自持一份，就近管理）
# 三个通用灰度分析模板 + 一个 A/B 实验专用模板：
# 通用模板查询基于网格指标（sidecar 抓取），hash 标签由 PodMonitor relabel
# 生成，用于区分 stable/canary 两批 Pod；实验模板见文末说明。
# 前提：模板与 Rollout 同命名空间（base 渲染进每个环境命名空间，天然满足）。
# 阈值可按本服务 SLO 定制（当前为通用值）。
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: reviews-success-rate
spec:
  args:
    - name: stable-hash                     # 保留便于扩展 stable/canary 对比，当前查询只用 canary-hash
    - name: canary-hash
  metrics:
    - name: success-rate
      initialDelay: 30s                     # 等 N 秒再查，避开流量爬坡期
      interval: 30s
      successCondition: result[0] >= 0.90   # 达标条件：金丝雀成功率 >= 90%
      failureLimit: 3                       # 连续失败 3 次回滚，容忍短暂抖动
      provider:
        prometheus:
          address: http://host.docker.internal:9090
          query: |
            sum(rate(istio_requests_total{rollouts_pod_template_hash="{{args.canary-hash}}", response_code=~"2..|3.."}[3m]))
            /
            sum(rate(istio_requests_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[3m]))
            or on() vector(0)
          # 分子：金丝雀 Pod 的 2xx/3xx 请求速率；分母：全部请求速率
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: reviews-p99-latency
spec:
  args:
    - name: stable-hash
    - name: canary-hash
  metrics:
    - name: p99-latency
      initialDelay: 30s
      interval: 30s
      successCondition: result[0] <= 500    # 网格直方图单位是毫秒：P99 <= 500ms（podinfo 模板是秒，勿照抄）
      failureLimit: 3
      provider:
        prometheus:
          address: http://host.docker.internal:9090
          query: |
            histogram_quantile(0.99,
              sum(rate(istio_request_duration_milliseconds_bucket{rollouts_pod_template_hash="{{args.canary-hash}}"}[3m])) by (le)
            )
            or on() vector(0)
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: reviews-traffic-check
spec:
  args:
    - name: canary-hash
  metrics:
    - name: canary-traffic
      initialDelay: 30s
      interval: 30s
      successCondition: result[0] > 0       # 金丝雀必须有流量：防"没流量时分析空跑误判通过"
      failureLimit: 3
      provider:
        prometheus:
          address: http://host.docker.internal:9090
          query: |
            sum(rate(istio_requests_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[3m]))
            or on() vector(0)
          # or on() vector(0)：查询为空时补 0，"没流量"与"没数据"都能明确判失败
---
# A/B 对比实验专用模板（Experiment 的 analyses 引用）：
# 实验 pod 不带 rollouts_pod_template_hash（金丝雀模板的过滤键），且
# destination_pod 标签在本 Istio 版本不可用；改用 destination_workload
# 过滤——实验 ReplicaSet 名 = <实验名>-<组名>，无 hash 后缀，可正则预测。
# 实验命名约定：generateName 固定 reviews-ab- 前缀（本正则依赖此约定）。
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: reviews-exp-p99-latency
spec:
  args:
    - name: group                            # 实验组名：v2 / v3
  metrics:
    - name: p99-latency
      initialDelay: 30s
      interval: 30s
      successCondition: result[0] <= 500
      failureLimit: 3
      provider:
        prometheus:
          address: http://host.docker.internal:9090
          query: |
            histogram_quantile(0.99,
              sum(rate(istio_request_duration_milliseconds_bucket{
                destination_workload=~"reviews-ab-.+-{{args.group}}$"}[3m])) by (le)
            )
            or on() vector(0)
