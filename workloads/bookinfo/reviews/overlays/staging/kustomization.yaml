apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - virtual-service.yaml
patches:
  # --- Rollout：环境不自动扩缩，静态副本 ---
  - target:
      kind: Rollout
      name: reviews-v1
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Rollout
      name: reviews-v2
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Rollout
      name: reviews-v3
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # --- 灰度分析模板：宿主机 Prometheus 查询地址 ---
  - target:
      kind: AnalysisTemplate
      name: reviews-success-rate
    patch: |-
      - op: replace
        path: /spec/metrics/0/provider/prometheus/address
        value: http://host.docker.internal:9090
  - target:
      kind: AnalysisTemplate
      name: reviews-p99-latency
    patch: |-
      - op: replace
        path: /spec/metrics/0/provider/prometheus/address
        value: http://host.docker.internal:9090
  - target:
      kind: AnalysisTemplate
      name: reviews-traffic-check
    patch: |-
      - op: replace
        path: /spec/metrics/0/provider/prometheus/address
        value: http://host.docker.internal:9090
  - target:
      kind: AnalysisTemplate
      name: reviews-exp-p99-latency
    patch: |-
      - op: replace
        path: /spec/metrics/0/provider/prometheus/address
        value: http://host.docker.internal:9090
  # --- DestinationRule：网格内服务名 ---
  - target:
      kind: DestinationRule
      name: reviews
    patch: |-
      - op: replace
        path: /spec/host
        value: reviews.staging.svc.cluster.local
