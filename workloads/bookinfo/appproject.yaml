# bookinfo AppProject：业务域的权限边界，根应用 bootstrap-bookinfo 的同步清单之一。
# sync-wave -999 = 同一次同步内的最低波：create 最先建。
# 删除顺序不由 wave 保证，由 finalizer 保证（官方 declarative-setup 语义：
# 项目在没有任何 Application 引用它之前不会被删除）。
# ── 删除顺序根因复盘（2026-08-25 bootstrap-bookinfo 误删事故）────────────
# 现象：删域根应用时 AppProject 瞬间消失，AppSet/Application 磨蹭很久才删完。
# 根因链（按因果序）：
# 1) sync-wave 只定义 sync 的 apply 顺序（lowest→highest），删除路径无等价物；
# 2) 删除顺序的真相是 finalizer 差异：AppProject 当时没挂 finalizer → 秒删；
#    AppSet/Application 挂 resources-finalizer → 须先级联删净各自管理的对象
#    （AppSet→Application→集群资源）才删自己；
# 3) delete 默认 foreground 传播：先删完依赖再删自身（19:16 日志铁证）；
# 4) 陷阱：删除期间根应用 selfHeal 仍在自愈，把 AppProject 秒重建为无主孤儿。
# 对策：AppProject 挂 resources-finalizer（本文件已挂）——官方语义：
#     "项目在没有任何 Application 引用它之前不会被删除"。
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bookinfo                                             # project = 应用域/团队名；新增应用域/团队，就新增一个 project 文件
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-999"                     # 同步波最低档：create 时最先建；删除顺序由 finalizer 保证，
                                                             # 不依赖 wave
  finalizers:
    - resources-finalizer.argocd.argoproj.io                 # 删除 AppProject 前先删净引用它的全部 Application，
                                                             # 保证 project 最后消失
spec:
  description: bookinfo 业务域
  sourceRepos:
    - 'https://github.com/ZAAN3660/argocd-gitops.git'        # Git 仓库列表
  destinations:                                              # (server, namespace) 二元组，不在清单里的组合一律拒绝 sync
    - namespace: dev
      server: https://kubernetes.default.svc
    - namespace: staging
      server: https://kubernetes.default.svc
    - namespace: prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:                                  # 集群级资源白名单：只放行 Namespace（应用要自建环境命名空间）
    - group: ''
      kind: Namespace
    # namespaceResourceWhitelist: []                         # 这一行必须整个不写（nil = 放行所有命名空间级资源）。显式写 [] 会被 Argo
                                                             # CD 解释为"拒绝一切命名空间级资源"，Service/Rollout 等全会被拦截
  sourceNamespaces: []                                       # 空 = 不限制 Application 来源命名空间
