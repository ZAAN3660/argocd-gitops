# v2
# 根应用：整个 hub 体系的唯一起点，只 apply 到 hub 集群一次。
# 它部署的不是业务，是 argocd-settings/ 里的 Argo CD 自身配置：
# project 定义权限边界，appset 定义发散规则，团队代码由后者再生成。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap                          # 根应用名：hub 上只有一个，不带环境后缀
  namespace: argocd
  finalizers:                              # 删除本应用前先级联清理它创建的资源，防止仓库移除后集群残留孤儿对象
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default                          # 根应用只能用内置 default：自定义 project 尚未同步，不能先给自己套约束
  source:
    repoURL: https://github.com/ZAAN3660/argocd-gitops.git # 配置仓库自身地址
    targetRevision: main                    # hub 跟随 main；团队应用发布靠 overlay 改动，不靠分支
    path: argocd-settings                   # 只同步 Argo CD 自身配置目录，不碰 apps/ 业务代码
  destination:
    server: https://kubernetes.default.svc  # 目标 = hub 集群自身，根应用不跨集群
    namespace: argocd
  syncPolicy:
    automated:                              # 开自动同步：检测到漂移立即回滚，人工只改仓库不改集群
      prune: true                           # 仓库里删除的清单同步时从集群删除，集群严格等于仓库
      selfHeal: true                        # 集群侧手动改动视为漂移，自动恢复成仓库定义的状态
    syncOptions:
      - CreateNamespace=true                # 目标命名空间不存在时自动创建，省一轮手动建 namespace
