# v1（一个应用一个 AppSet：取消 git 目录扫描，路径固定，环境清单每应用独立维护）
# 本文件为 reviews 应用生成按环境发散的 Application。
# 与 productpage/details/ratings/routing 各自的 AppSet 同构，差异只在名字与路径。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: reviews
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - environment: dev
            server: https://kubernetes.default.svc
            namespace: dev
          # - environment: staging
          #   server: https://kubernetes.default.svc
          #   namespace: staging
          # - environment: prod
          #   server: https://kubernetes.default.svc
          #   namespace: prod
  template:
    metadata:
      name: 'bookinfo-reviews-{{.environment}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bookinfo
      ignoreDifferences:
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/template/metadata/labels/rollouts-pod-template-hash
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            - .spec.http[].route[].weight
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/selector
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: apps/bookinfo/reviews/overlays/{{.environment}}
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
