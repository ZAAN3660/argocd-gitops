# infra 应用域：istio base（= 全部 CRD + 集群级资源）的 AppSet
# X 方案对 istio 的落法：沿用官方结构，base / istiod / gateway 三个 chart 三个 Application，
# CRD 留在 base chart 里随它走，不单独拆库。生成 Application：infra-istio-base-dev
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-istio-base
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - environment: dev
            server: https://kubernetes.default.svc
            namespace: istio-system
  template:
    metadata:
      name: 'infra-istio-base-{{.environment}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "-2"          # CRD 必须先于 istiod（wave -1）就绪
    spec:
      project: infra
      ignoreDifferences:                            # istiod-default-validator 的 caBundle 由 istiod 运行时回填
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: infra/istio/base
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        # 接管期 v1：manual；全部验证后 v2 提交统一改 automated prune selfHeal
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true                    # istio CRD 数量大，SSA 是硬要求（annotation 超限）
