# infra 应用域：KEDA 的 AppSet（X 方案：CRD 随组件 chart 走，不单独拆库）
# 生成 Application：infra-keda-dev
# 接管说明：接管前为集群外安装（keda 2.20.2，见 keda/README.md），本 AppSet 收编它。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-keda
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - environment: dev
            server: https://kubernetes.default.svc
            namespace: keda
  template:
    metadata:
      name: 'infra-keda-{{.environment}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
    spec:
      project: infra
      ignoreDifferences:                            # webhook caBundle 由运行时证书机制回填（keda 自签轮换），
        - group: admissionregistration.k8s.io       # 不豁免会形成"sync 清掉 → 控制器重写 → 漂移"的死循环
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: infra/keda
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        # 接管期 v1：manual；全部验证后 v2 提交统一改 automated prune selfHeal
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
