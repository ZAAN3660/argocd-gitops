# observability 域：otel-agent 是 mode: daemonset 的集群级可观测性基础设施，
# 每个节点一份、整个集群只装一次，不随环境分发（与 infra 组件同规则，但
# 归属 observability 域，不并入 infra-components）。
# 生成 Application：observability-otel-agent（无环境后缀）
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel-agent
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - {}                       # 固定单元素：N 恒等于 1，无发散维度
  template:
    metadata:
      name: 'observability-otel-agent'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: observability
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: otel/otel-agent
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
