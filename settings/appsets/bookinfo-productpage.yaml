# v1（一个应用一个 AppSet：取消 git 目录扫描，路径固定，环境清单每应用独立维护）
# 本文件为 productpage 应用生成按环境发散的 Application。
# 与 details/ratings/reviews 各自的 AppSet 同构，差异只在名字与路径。
# 应用名 = bookinfo-<应用>-<环境>，与 AppProject bookinfo 对齐。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: productpage
  namespace: argocd
spec:
  goTemplate: true                        # 允许下面的字符串用 {{变量}} 占位，生成时替换成真实值
  generators:                             # 决定生成哪些组合（每个组合 = 一个 Application）
    - list:                               # 环境清单：一条记录 = 一个 Application
        elements:
          - environment: dev              # 环境名：同时用作 overlay 路径段和应用名后缀
            server: https://kubernetes.default.svc
            namespace: dev                # 该环境独占的命名空间
          - environment: staging
            server: https://kubernetes.default.svc
            namespace: staging
          - environment: prod
            server: https://kubernetes.default.svc
            namespace: prod
  template:                               # 每个组合套这份模板，产出 1 个 Application
    metadata:
      name: 'bookinfo-productpage-{{.environment}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: bookinfo                   # 挂到同名 AppProject 下，部署目标受其 destinations 白名单约束
      ignoreDifferences:                  # 预置豁免清单：灰度发布时 Rollout 控制器会动态改写下述字段，
        - group: argoproj.io              # Argo CD 检测漂移时跳过它们，不把这些运行时改动当漂移回滚
          kind: Rollout
          jsonPointers:
            - /spec/template/metadata/labels/rollouts-pod-template-hash
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            - .spec.http[].route[].weight
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/selector
      source:                             # 这个应用去仓库的哪个路径拿清单
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: apps/bookinfo/productpage/overlays/{{.environment}}
      destination:                        # 这个应用部署到哪里
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
