# infra 应用域：metrics-server 的 AppSet（X 方案：CRD 随组件 chart 走，不单独拆库）
# 生成 Application：infra-metrics-server-dev
# 接管说明：本组件接管前集群里不存在（kube-system 只有 coredns），属 GitOps 新装。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-metrics-server
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - environment: dev
            server: https://kubernetes.default.svc
            namespace: kube-system
  template:
    metadata:
      name: 'infra-metrics-server-{{.environment}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        argocd.argoproj.io/sync-wave: "-2"          # 首 sync 排序：基础组件先就绪
    spec:
      project: infra
      source:
        repoURL: https://github.com/ZAAN3660/argocd-gitops.git
        targetRevision: init
        path: infra/metrics-server
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        # 接管期 v1：manual 手动同步（先看 diff 再 sync）；全部验证后 v2 提交统一改 automated prune selfHeal
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true                    # X 方案核心：统一走 SSA，绕开大对象 last-applied annotation 超限
